// ---------- 流程 UI ----------

function flowButton(doc, label, onClick, { primary = false, disabled = false } = {}) {
  const btn = Object.assign(doc.createElement('button'), {
    type: 'button', textContent: label, disabled,
  });
  btn.className = 'flow-btn' + (primary ? ' primary' : '');
  btn.addEventListener('click', onClick);
  return btn;
}

function buildScenarioTools(doc) {
  const bar = doc.createElement('div');
  bar.className = 'flow-actions';
  bar.append(
    flowButton(doc, '＋ 新增情境', newScenario, { primary: true }),
    flowButton(doc, '匯出 YAML', exportScenarios),
    flowButton(doc, '匯入', pickImportFile),
  );
  return bar;
}

// L2：簡報頁清單 ＋ 播放控制
function buildFlowPanel(doc) {
  const wrap = doc.createElement('div');
  wrap.className = 'flow-panel';
  if (!currentScenario) return wrap;

  const head = doc.createElement('div');
  head.className = 'flow-head';
  const back = flowButton(doc, '‹ 情境', () => { panelLevel = 'scenarios'; renderFlow(); });
  const title = doc.createElement('span');
  title.className = 'flow-title';
  title.textContent = currentScenario.name;
  const counter = doc.createElement('span');
  counter.className = 'flow-counter';
  counter.textContent = flowSteps.length
    ? (flowIndex < 0 ? `尚未開始 · 共 ${flowSteps.length} 步` : `第 ${flowIndex + 1} / ${flowSteps.length} 步`)
    : '這個情境沒有可播的頁';
  head.append(back, title, counter);
  wrap.appendChild(head);

  const now = doc.createElement('p');
  now.className = 'flow-now';
  now.textContent = flowIndex < 0
    ? '按「開始」或方向鍵 → 進入第一步'
    : stepLabel(flowSteps[flowIndex]);
  wrap.appendChild(now);

  const bar = doc.createElement('div');
  bar.className = 'flow-actions';
  bar.append(
    flowButton(doc, '‹ 上一步', prevFlow, { disabled: flowIndex <= 0 }),
    flowButton(doc, flowIndex < 0 ? '開始' : '下一步 ›',
      () => (flowIndex < 0 ? gotoFlow(0) : nextFlow()),
      { primary: true, disabled: !flowSteps.length || flowIndex >= flowSteps.length - 1 }),
    flowButton(doc, '停止', stopFlow),
  );
  wrap.appendChild(bar);

  const list = doc.createElement('div');
  list.className = 'flow-list';
  const currentSlideId = flowIndex >= 0 ? flowSteps[flowIndex].slideId : null;
  currentScenario.slides.forEach(slide => {
    const row = doc.createElement('div');
    row.className = 'flow-row' + (slide.id === currentSlideId ? ' current' : '')
      + (slide.enabled === false ? ' off' : '');

    const toggle = doc.createElement('label');
    toggle.className = 'flow-toggle';
    const box = Object.assign(doc.createElement('input'),
      { type: 'checkbox', checked: slide.enabled !== false });
    box.setAttribute('aria-label', `啟用「${slide.title}」`);
    box.addEventListener('change', () => toggleSlideEnabled(slide.id));
    toggle.appendChild(box);

    const name = doc.createElement('span');
    name.className = 'flow-row-title';
    name.textContent = slide.title;

    // 一眼看出這頁畫面上有什麼：綠幕人物最重要，其次是字幕，都沒有就是純場景
    const meta = doc.createElement('span');
    meta.className = 'flow-row-meta';
    const green = Scenarios.layerOf(slide, 'greenscreen');
    const text = Scenarios.layerOf(slide, 'text');
    meta.textContent = slide.enabled === false ? '播放時跳過'
      : green ? (green.segment ? `片段 ${green.segment}` : '綠幕人物')
      : text ? '字幕'
      : (slide.note ? '等教官' : '純場景');

    const edit = flowButton(doc, '編輯', () => {
      editingSlideId = slide.id;
      panelLevel = 'edit';
      // 同時跳到這一頁：滑桿永遠操作「目前這一步」，不跳的話會變成
      // 「在編第 3 頁、滑桿卻在改第 1 頁」，預覽與投影也對不上
      const i = flowSteps.findIndex(s => s.id === slide.id);
      if (i >= 0) gotoFlow(i); else renderFlow();
    });
    edit.classList.add('flow-btn-mini');

    row.append(toggle, name, meta, edit);

    // 拖曳排序：把手就是整列，放開時看落在哪一列的上／下半決定插入位置
    row.draggable = true;
    row.dataset.slideId = slide.id;
    row.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', slide.id);
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      if (!draggedId || draggedId === slide.id) return;
      const target = currentScenario.slides.findIndex(s => s.id === slide.id);
      const from = currentScenario.slides.findIndex(s => s.id === draggedId);
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      let to = target + (after ? 1 : 0);
      if (from < to) to -= 1;      // 往下搬時，自己被抽走會讓後面的索引往前一格
      moveSlide(draggedId, to);
    });

    if (slide.enabled !== false) {
      row.classList.add('clickable');
      row.addEventListener('click', e => {
        if (e.target.closest('.flow-toggle') || e.target.closest('button')) return;
        const i = flowSteps.findIndex(s => s.slideId === slide.id);
        if (i >= 0) gotoFlow(i);
      });
    }
    list.appendChild(row);
  });
  wrap.appendChild(list);

  const editBar = doc.createElement('div');
  editBar.className = 'flow-actions';
  editBar.append(
    flowButton(doc, '＋ 新增頁', addSlide),
    flowButton(doc, '重新命名', () => {
      const name = doc.defaultView.prompt('情境名稱', currentScenario.name);
      if (name && name.trim()) renameScenario(name.trim());
    }),
  );
  wrap.appendChild(editBar);
  return wrap;
}

// L3：編輯單一簡報頁
function buildSlideEditor(doc) {
  const wrap = doc.createElement('div');
  wrap.className = 'flow-panel';
  const slide = editingSlide();
  if (!slide) return wrap;

  const head = doc.createElement('div');
  head.className = 'flow-head';
  head.append(
    flowButton(doc, '‹ 頁清單', () => { panelLevel = 'slides'; editingSlideId = null; renderFlow(); }),
    Object.assign(doc.createElement('span'), { className: 'flow-title', textContent: '編輯頁' }),
  );
  wrap.appendChild(head);

  const titleRow = doc.createElement('label');
  titleRow.className = 'edit-field';
  titleRow.append(Object.assign(doc.createElement('span'), { textContent: '標題' }));
  const titleInput = Object.assign(doc.createElement('input'), { type: 'text', value: slide.title });
  // input 事件每打一個字就存一次會太吵，改成離開欄位時才寫入
  titleInput.addEventListener('change', () => {
    slide.title = titleInput.value.trim() || slide.title;
    persistScenarioEdit();
  });
  titleRow.appendChild(titleInput);
  wrap.appendChild(titleRow);

  // 給教官的提詞。**不會投影出去**——要投影給學員看的字請加 text 圖層。
  const noteRow = doc.createElement('label');
  noteRow.className = 'edit-field';
  noteRow.append(Object.assign(doc.createElement('span'), { textContent: '提詞' }));
  const noteInput = Object.assign(doc.createElement('input'),
    { type: 'text', placeholder: '只有教官看得到，不會投影', value: slide.note || '' });
  noteInput.addEventListener('change', () => {
    const v = noteInput.value.trim();
    if (v) slide.note = v; else delete slide.note;
    persistScenarioEdit();
  });
  noteRow.appendChild(noteInput);
  wrap.appendChild(noteRow);

  const layersTitle = doc.createElement('div');
  layersTitle.className = 'panel-section-title';
  layersTitle.textContent = '圖層（由下往上疊，順序固定）';
  wrap.appendChild(layersTitle);

  const LAYER_LABEL = {
    scene: '場景', patient: '病患照片', greenscreen: '去背人物', text: '說明文字', sound: '聲音',
  };

  // 由上往下顯示＝畫面上由前往後，跟一般繪圖軟體的圖層面板一致
  [...slide.layers].reverse().forEach(layer => {
    const row = doc.createElement('div');
    row.className = 'edit-action';
    row.append(Object.assign(doc.createElement('span'),
      { className: 'layer-name', textContent: LAYER_LABEL[layer.type] || layer.type }));

    if (layer.type === 'greenscreen') {
      // 編輯器也要把關：這個情境的環境×事件下沒素材的狀況，不該編得進去
      const compSel = doc.createElement('select');
      optionsFor('complication').forEach(c => {
        const usable = complicationUsable(c, currentScenario.environment, currentScenario.medicalEvent);
        compSel.appendChild(Object.assign(doc.createElement('option'), {
          value: c, textContent: usable ? c : `${c}（此情境無素材）`, disabled: !usable,
        }));
      });
      compSel.value = layer.complication;
      compSel.addEventListener('change', () => updateLayer('greenscreen', { complication: compSel.value }));
      row.appendChild(compSel);

      const seg = Object.assign(doc.createElement('input'),
        { type: 'text', className: 'edit-seg', placeholder: '片段（留空＝第一段）', value: layer.segment || '' });
      seg.addEventListener('change', () => updateLayer('greenscreen', { segment: seg.value.trim() }));
      row.appendChild(seg);
    }

    if (layer.type === 'text') {
      const text = Object.assign(doc.createElement('input'),
        { type: 'text', placeholder: '投影給學員看的字', value: layer.text || '' });
      text.addEventListener('change', () => updateLayer('text', { text: text.value.trim() || layer.text }));
      row.appendChild(text);
    }

    if (layer.type === 'scene' || layer.type === 'patient') {
      // 釘選＝所見即所得；留空＝auto，重新產生會換一張
      const pin = Object.assign(doc.createElement('input'),
        { type: 'text', className: 'edit-seg', placeholder: '素材 id（留空＝auto）', value: layer.asset || '' });
      pin.addEventListener('change', () => updateLayer(layer.type, { asset: pin.value.trim() }));
      row.appendChild(pin);
    }

    const tools = doc.createElement('span');
    tools.className = 'edit-tools';
    // 沒有上下鍵：z 順序由型別決定，投影視窗的 z-index 是寫死的
    tools.append(flowButton(doc, '✕', () => removeLayer(layer.type)));
    row.appendChild(tools);
    wrap.appendChild(row);
  });

  const addBar = doc.createElement('div');
  addBar.className = 'flow-actions';
  Scenarios.LAYER_TYPES.forEach(type => {
    if (Scenarios.layerOf(slide, type)) return;   // 每種一頁最多一個
    addBar.append(flowButton(doc, `＋ ${LAYER_LABEL[type]}`, () => addLayer(type)));
  });
  if (addBar.children.length) wrap.appendChild(addBar);

  const slideBar = doc.createElement('div');
  slideBar.className = 'flow-actions edit-danger';
  slideBar.append(
    flowButton(doc, '複製這頁', () => duplicateSlide(slide.id)),
    flowButton(doc, '刪除這頁', () => deleteSlide(slide.id)),
  );
  wrap.appendChild(slideBar);
  return wrap;
}

// ---------- 預覽 ----------
// 圖層編輯器沒有預覽等於盲編：改了位置要開投影視窗才看得到。
// 預覽把同一頁的圖層堆在一個 16:9 的小框裡，用的是**與投影端同一組數值**
// （size→vw/vh 對應到框的寬高百分比，x/y→left/top，中心點對齊），
// 所以這裡看到的位置就是投影上的位置。

// 圖層要用哪一筆素材：釘選了就用那筆，否則用本次產生時挑到的
function layerAsset(layer, fallback) {
  if (!layer) return null;
  if (layer.asset) return DATA.assets.find(a => a.id === layer.asset) || null;
  return fallback || null;
}

function previewImage(asset, className) {
  if (!asset || asset.type === 'none') return null;
  const file = assetPath(asset, assetFiles(asset)[0]);
  if (!file) return null;
  return Object.assign(document.createElement('img'),
    { className, src: absoluteAssetUrl(file), alt: asset.description || '' });
}

// 綠幕在投影上是逐幀去背的 canvas；預覽只需要一張靜止的去背圖就夠了，
// 位置調得對不對不需要動畫，而且省下一整個 rAF 迴圈。
function previewGreenscreen(layer, canvas) {
  const segment = layer.segment || complicationSegments(layer.complication,
    $('sel-env').value, $('sel-med').value)[0];
  const asset = complicationVideoAssets[segmentKey(layer.complication, segment)];
  if (!hasProjectableComplication(asset)) return false;

  const file = assetPath(asset, assetFiles(asset)[0]);
  const url = absoluteAssetUrl(file);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const paint = (source, w, h) => {
    const width = Math.min(w || KEY_MAX_WIDTH, KEY_MAX_WIDTH);
    canvas.width = width;
    canvas.height = Math.max(1, Math.round(width * ((h && w) ? h / w : 9 / 16)));
    try {
      // 容差讀執行期物件，理由同 updatePreviewLayout：滑桿改的是它，圖層慢一拍
      chromaKeyFrame(ctx, source, canvas.width, canvas.height,
        complicationOverlay(layer.complication).tolerance);
    } catch { /* 素材還沒解碼完就跳過，下次重繪會補上 */ }
  };
  // 調「去背」滑桿要重算像素，不只是換位置——把重畫函式掛在 canvas 上供 updatePreviewLayout 呼叫。
  // paint 讀的是 layer.tolerance，而 layer 是被就地修改的同一個物件，所以永遠拿到最新值。
  const remember = (source, w, h) => {
    canvas.__repaint = () => paint(source, w, h);
    canvas.__repaint();
    // canvas 沒有 load 事件，畫完才知道長寬比——這時才擺得出正確的尺寸上限
    updatePreviewLayout();
  };
  if (mediaKind(asset, file) === 'video') {
    // preload 必須是 auto：metadata 只抓中繼資料、不抓影格，loadeddata 會拿到空白畫面
    const video = Object.assign(document.createElement('video'),
      { src: url, muted: true, playsInline: true, preload: 'auto' });
    video.addEventListener('loadeddata', () => remember(video, video.videoWidth, video.videoHeight), { once: true });
  } else {
    const img = new Image();
    img.addEventListener('load', () => remember(img, img.naturalWidth, img.naturalHeight), { once: true });
    img.src = url;
  }
  return true;
}

// 位置與大小改成直接在預覽上拖，所以這裡是唯一寫入 layout 的地方之一。
// 讀寫的都是 patientOverlay／complicationOverlay 這兩個**執行期物件**，
// 圖層要等 persistLayerLayout() 才同步——讀圖層會慢一拍。

// size 是「可佔畫面的百分比」，投影端用 vw/vh。預覽的 stage 不是視窗大小，
// 所以要換算成 px；百分比放在 shrink-to-fit 的外層裡會被瀏覽器當成沒設。
function placePreviewItem(item, layout, stage) {
  if (!item || !layout) return;
  const rect = stage.getBoundingClientRect();
  item.style.left = layout.x + '%';
  item.style.top = layout.y + '%';
  const media = item.querySelector('.preview-media');
  if (media) {
    media.style.maxWidth = (rect.width * layout.size / 100) + 'px';
    media.style.maxHeight = (rect.height * layout.size / 100) + 'px';
  }
}

function previewLayoutOf(slide, type) {
  if (type === 'patient') return Scenarios.layerOf(slide, 'patient') ? patientOverlay : null;
  const green = Scenarios.layerOf(slide, 'greenscreen');
  return green ? complicationOverlay(green.complication) : null;
}

function updatePreviewLayout() {
  const stage = document.querySelector('#flow .preview-stage');
  if (!stage) return;
  const slide = (panelLevel === 'edit' && editingSlide()) || currentSlide();
  if (!slide) return;
  for (const type of ['patient', 'greenscreen']) {
    const item = stage.querySelector(`.preview-item[data-type="${type}"]`);
    placePreviewItem(item, previewLayoutOf(slide, type), stage);
  }
  const canvas = stage.querySelector('canvas.preview-media');
  if (canvas && canvas.__repaint) canvas.__repaint();   // 去背容差要重算像素
}

// 動完之後三個地方都要跟上：投影畫面、還留著的滑桿、情境檔
function commitPreviewLayout(type, comp) {
  if (type === 'patient') { applyPatientOverlayLayout(); syncPatientOverlayBoxes(); }
  else {
    applyComplicationOverlayLayout();
    if (chromaRedraw && !chromaFrame) chromaRedraw();
    syncComplicationOverlayBoxes(comp);
  }
  persistLayerLayout(type, comp);
}

// 直接在預覽上操作：整塊拖＝移動，右下角把手＝縮放。
// 縮放用「離中心的距離比例」而不是單看水平位移，因為從任何一角拉都該是同一種手感。
function makePreviewDraggable(item, type, comp, stage) {
  const layout = () => (type === 'patient' ? patientOverlay : complicationOverlay(comp));
  const handle = item.querySelector('.preview-handle');

  const start = (event, mode) => {
    event.preventDefault();
    event.stopPropagation();
    const rect = stage.getBoundingClientRect();
    const from = { ...layout() };
    const centre = { x: rect.left + rect.width * from.x / 100, y: rect.top + rect.height * from.y / 100 };
    const startDist = Math.hypot(event.clientX - centre.x, event.clientY - centre.y) || 1;
    const origin = { x: event.clientX, y: event.clientY };
    const target = mode === 'resize' ? handle : item;
    item.classList.add('dragging');
    // 指標非活躍時（某些瀏覽器、或程式合成的事件）會丟例外，不能讓它擋掉後面的監聽
    try { target.setPointerCapture(event.pointerId); } catch { /* 沒有捕捉也還是能拖 */ }

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
    const move = e => {
      const l = layout();
      if (mode === 'resize') {
        const dist = Math.hypot(e.clientX - centre.x, e.clientY - centre.y);
        l.size = clamp(from.size * (dist / startDist), ...Scenarios.LAYER_RANGES.size);
      } else {
        l.x = clamp(from.x + (e.clientX - origin.x) / rect.width * 100, ...Scenarios.LAYER_RANGES.x);
        l.y = clamp(from.y + (e.clientY - origin.y) / rect.height * 100, ...Scenarios.LAYER_RANGES.y);
      }
      placePreviewItem(item, l, stage);
      // 投影要即時跟著動，教官才看得到自己在調什麼
      if (type === 'patient') applyPatientOverlayLayout(); else applyComplicationOverlayLayout();
    };
    const end = e => {
      item.classList.remove('dragging');
      try { target.releasePointerCapture(e.pointerId); } catch { /* 已經放掉了 */ }
      target.removeEventListener('pointermove', move);
      target.removeEventListener('pointerup', end);
      target.removeEventListener('pointercancel', end);
      commitPreviewLayout(type, comp);
    };
    target.addEventListener('pointermove', move);
    target.addEventListener('pointerup', end);
    target.addEventListener('pointercancel', end);
  };

  item.addEventListener('pointerdown', e => { if (e.button === 0) start(e, 'move'); });
  if (handle) handle.addEventListener('pointerdown', e => { if (e.button === 0) start(e, 'resize'); });
}

// 把媒體包進可拖曳的外層
function previewItem(type, media, comp) {
  const item = document.createElement('div');
  item.className = 'preview-item';
  item.dataset.type = type;
  media.classList.add('preview-media');
  item.append(media, Object.assign(document.createElement('span'),
    { className: 'preview-handle', title: '拖曳縮放' }));
  item.title = '拖曳移動，拉右下角縮放';
  return item;
}

function buildPreview() {
  // 編輯中就預覽正在編的那一頁，播放中就預覽目前這一步
  const slide = (panelLevel === 'edit' && editingSlide()) || currentSlide();
  if (!slide) return null;

  const wrap = document.createElement('div');
  wrap.className = 'preview';
  const stage = document.createElement('div');
  stage.className = 'preview-stage';

  const scene = previewImage(layerAsset(Scenarios.layerOf(slide, 'scene'), currentEnvironmentAsset), 'preview-scene');
  if (scene) stage.appendChild(scene);
  else stage.appendChild(Object.assign(document.createElement('div'),
    { className: 'preview-empty', textContent: '這一頁沒有可預覽的場景素材' }));

  const patient = Scenarios.layerOf(slide, 'patient');
  const patientImg = previewImage(layerAsset(patient, currentPatientPhotoAsset), '');
  if (patient && patientImg) {
    const item = previewItem('patient', patientImg);
    stage.appendChild(item);
    // 圖還沒載完就量不到尺寸，載完再擺一次
    patientImg.addEventListener('load', () => placePreviewItem(item, patientOverlay, stage), { once: true });
    makePreviewDraggable(item, 'patient', null, stage);
  }

  const green = Scenarios.layerOf(slide, 'greenscreen');
  if (green) {
    const canvas = document.createElement('canvas');
    if (previewGreenscreen(green, canvas)) {
      const item = previewItem('greenscreen', canvas, green.complication);
      stage.appendChild(item);
      makePreviewDraggable(item, 'greenscreen', green.complication, stage);
    } else {
      stage.appendChild(Object.assign(document.createElement('div'),
        { className: 'preview-missing', textContent: `綠幕素材不存在：${green.complication}` }));
    }
  }

  const text = Scenarios.layerOf(slide, 'text');
  if (text) {
    const node = Object.assign(document.createElement('div'),
      { className: 'preview-text', textContent: text.text });
    Object.assign(node.style, { fontSize: `${text.size / 10}cqw`, top: text.y + '%', left: text.x + '%' });
    stage.appendChild(node);
  }

  wrap.appendChild(stage);
  const caption = document.createElement('p');
  caption.className = 'preview-caption';
  caption.textContent = `預覽：${slide.title}　·　拖曳人物移動、拉右下角縮放`
    + (slide.note ? `　·　提詞（不投影）：${slide.note}` : '');
  wrap.appendChild(caption);
  // stage 要先進 DOM 才量得到寬高，尺寸換算靠的是它
  requestAnimationFrame(() => updatePreviewLayout());
  return wrap;
}

function renderFlow() {
  const box = $('flow');
  let node;
  if (!currentScenario) node = document.createElement('div');
  else if (panelLevel === 'edit' && editingSlide()) node = buildSlideEditor(document);
  else node = buildFlowPanel(document);
  const preview = currentScenario ? buildPreview() : null;
  box.replaceChildren(...(preview ? [preview, node] : [node]));
  box.hidden = !currentScenario;
  // 還沒挑情境時右欄不該是一片空白，要說明下一步該做什麼
  $('workspace-empty').hidden = !!currentScenario;
}

function buildCard({ role, label, result, changed, emptyText, extras, silentVoice }) {
  const card = document.createElement('div');
  card.className = 'card' + (result ? '' : ' empty') + (changed ? ' changed' : '');

  const head = document.createElement('div');
  head.className = 'role';
  head.innerHTML = `<strong>${label}</strong>${role}`;
  card.appendChild(head);

  const body = document.createElement('div');
  if (result) {
    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = result.asset.description || '(無說明)';
    if (result.hit) {
      const b = document.createElement('span');
      b.className = 'badge hit';
      b.textContent = '命中突發狀況';
      desc.appendChild(b);
    }
    const pool = document.createElement('span');
    pool.className = 'badge' + (result.poolSize === 1 ? ' only' : '');
    pool.textContent = result.poolSize === 1
      ? '此條件僅 1 筆素材，重新產生不會變'
      : `${result.poolSize} 筆可選`;
    desc.appendChild(pool);
    body.appendChild(desc);
    if (result.asset.line) {
      const line = document.createElement('blockquote');
      line.className = 'line';
      line.textContent = '「' + result.asset.line + '」';
      body.appendChild(line);
    }
    if (result.asset.tts) body.appendChild(ttsBlock(result.asset.tts));
    // 這一段的綠幕素材是影片時就用影片自己的原聲，配音檔不放播放器，免得兩個聲音疊在一起
    if (silentVoice && result.asset.type !== 'none') {
      const note = document.createElement('div');
      note.className = 'none-note';
      note.textContent = '這一段用綠幕影片的原聲，這個配音檔不會播放';
      body.appendChild(note);
    } else {
      body.appendChild(mediaFor(result.asset));
    }
    if (role === 'patient_photo' && hasProjectablePatientPhoto(result.asset)) {
      body.appendChild(patientOverlayControls());
    }
    const extraNode = extras && extras(result.asset);
    if (extraNode) body.appendChild(extraNode);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const paths = assetFiles(result.asset).map(file => assetPath(result.asset, file));
    meta.textContent = `${result.asset.id} · ${paths.join(', ') || '（無檔案）'}`;
    body.appendChild(meta);
  } else {
    const desc = document.createElement('p');
    desc.className = 'desc';
    // 這一段本來就吃影片原聲，沒有另外的配音不是資料缺口，不要報成查無素材
    desc.textContent = silentVoice ? '這一段用綠幕影片的原聲，沒有另外的配音' : emptyText;
    body.appendChild(desc);
  }
  card.appendChild(body);
  return card;
}

// 播放／停止一段演出：綠幕素材與台詞一起，投影上同時去背疊上該段的人物
function segmentActions(comp, segment, block, playLabel) {
  const actions = document.createElement('div');
  actions.className = 'comp-group-actions';
  const play = Object.assign(document.createElement('button'), { className: 'play', textContent: playLabel });
  play.dataset.comp = comp;
  play.dataset.segment = segment;
  const stop = Object.assign(document.createElement('button'), { className: 'stop', textContent: '停止' });
  const playThis = () => {
    stopMediaIn($('comp-groups'));   // 一次只演一段，接著演下一段就把上一段收掉
    playMediaIn(block);
    startComplicationProjection(comp, segment, 'play');
  };
  // 流程推進時走的是同一個函式，不是另寫一份——複製一份播放邏輯遲早會跟按鈕長不一樣
  segmentPlayers.set(segmentKey(comp, segment), playThis);
  play.addEventListener('click', playThis);
  stop.addEventListener('click', () => {
    stopMediaIn(block);
    if (activeComplication === comp && activeSegment === segment) stopComplicationProjection();
  });
  actions.append(play, stop);
  return actions;
}

// 一個突發狀況＝一組。組內可再拆成好幾個片段，教官依現場節奏逐段觸發。
// 只有一段時不加片段標題，維持單純的「一組兩張卡」版面。
function buildComplicationGroup(comp, seq, segments) {
  const section = document.createElement('section');
  section.className = 'comp-group';
  const single = segments.length === 1;

  const head = document.createElement('div');
  head.className = 'comp-group-head';
  const title = document.createElement('h2');
  title.className = 'comp-group-title';
  title.innerHTML = `<span class="seq">${seq}</span>`;
  title.append(document.createTextNode(comp));
  if (!single) {
    const count = document.createElement('span');
    count.className = 'badge';
    count.textContent = `${segments.length} 個片段`;
    title.appendChild(count);
  }
  head.appendChild(title);

  const stopAllInGroup = Object.assign(document.createElement('button'),
    { className: 'stop', textContent: '停止' });
  stopAllInGroup.addEventListener('click', () => {
    stopMediaIn(section);
    if (activeComplication === comp) stopComplicationProjection();
  });

  if (single) {
    head.appendChild(segmentActions(comp, segments[0].segment, section, '播放這組'));
  } else {
    const actions = document.createElement('div');
    actions.className = 'comp-group-actions';
    actions.appendChild(stopAllInGroup);
    head.appendChild(actions);
  }
  section.appendChild(head);

  for (const { segment, nodes } of segments) {
    const cards = document.createElement('div');
    cards.className = 'cards';
    nodes.forEach(node => cards.appendChild(node));
    if (single) {
      section.appendChild(cards);
      continue;
    }
    const block = document.createElement('div');
    block.className = 'comp-segment';
    const bar = document.createElement('div');
    bar.className = 'comp-segment-head';
    const label = document.createElement('h3');
    label.className = 'comp-segment-title';
    label.textContent = `片段 ${segment}`;
    bar.append(label, segmentActions(comp, segment, block, '播放這段'));
    block.append(bar, cards);
    section.appendChild(block);
  }
  return section;
}

function generate() {
  const env = $('sel-env').value;
  const med = $('sel-med').value;
  const comps = selectedComplications();
  const cards = $('cards');
  const groups = $('comp-groups');
  const before = { ...shownIds };
  disposeMediaSources();
  stopComplicationProjection();
  cards.innerHTML = '';
  groups.innerHTML = '';
  complicationOverlayBoxes.length = 0;
  patientOverlayBoxes.length = 0;
  segmentPlayers.clear();
  currentEnvironmentAsset = null;
  currentPatientPhotoAsset = null;
  Object.keys(complicationVideoAssets).forEach(key => delete complicationVideoAssets[key]);
  genCount++;

  let changed = 0, locked = 0;
  const track = (key, result) => {
    shownIds[key] = result ? result.asset.id : null;
    if (before[key] !== shownIds[key]) changed++;
    if (result && result.poolSize === 1) locked++;
    return genCount > 1 && before[key] !== shownIds[key];
  };

  let patientPhoto = null;
  for (const { role, label } of BASE_ROLES) {
    const result = pickForRole(role, env, med, comps, { patientPhoto });
    if (role === 'patient_photo' && result) {
      patientPhoto = result.asset;
      currentPatientPhotoAsset = result.asset;
    }
    if (role === 'environment_video') {
      currentEnvironmentAsset = result ? result.asset : null;
      // 版面不再跟著環境素材走（那是舊的 localStorage 模型）。這裡先回到預設，
      // 真正的值在進到某一頁時由 loadLayoutFromSlide() 從該頁的圖層讀進來。
      loadLayoutFromSlide(currentSlide());
    }
    cards.appendChild(buildCard({
      role, label, result,
      changed: track(role, result),
      emptyText: '此條件下查無符合的素材，可在 scenario-data.yaml 補一筆通用素材',
    }));
  }

  // 勾選的突發狀況全部展開成群組，不再每次隨機鎖定一個；一組可再拆成好幾個片段
  comps.forEach((comp, index) => {
    const segmentNumbers = complicationSegments(comp, env, med);
    const playLabel = segmentNumbers.length === 1 ? '播放這組' : '播放這段';
    const segments = segmentNumbers.map(segment => ({
      segment,
      nodes: COMP_ROLES.map(({ role, label }) => {
        const key = `${role}|${segmentKey(comp, segment)}`;
        const result = pickForRole(role, env, med, [comp], { memoKey: key, segment });
        if (role === 'complication_video' && result) {
          complicationVideoAssets[segmentKey(comp, segment)] = result.asset;
        }
        // COMP_ROLES 的順序是先影片再聲音，所以輪到聲音時已經知道這段的綠幕素材是哪一種
        const greenScreen = complicationVideoAssets[segmentKey(comp, segment)];
        return buildCard({
          role, label, result,
          silentVoice: role === 'complication_voice'
            && !!greenScreen && mediaKind(greenScreen) === 'video',
          changed: track(key, result),
          // 突發狀況素材有綁環境／事件，所以空卡片多半是「這一組不適合這個情境」而不是缺素材
          emptyText: (segmentNumbers.length === 1 ? `「${comp}」` : `「${comp}」片段 ${segment} `)
            + `在「${env}／${med}」沒有素材：可能是這一組不適合這個情境，`
            + '也可能是還沒做，要放寬就改 scenario-data.yaml 的 environment／medicalEvent',
          extras: role === 'complication_video'
            ? asset => (hasProjectableComplication(asset)
              ? complicationOverlayControls(comp, segment, playLabel, segmentNumbers.length > 1) : null)
            : null,
        });
      }),
    }));
    groups.appendChild(buildComplicationGroup(comp, index + 1, segments));
  });

  if (!comps.length) {
    const note = document.createElement('p');
    note.className = 'group-note';
    note.textContent = '未勾選突發狀況，本次沒有突發狀況群組。';
    groups.appendChild(note);
  }

  $('btn-gen').textContent = '重新產生';
  updatePlaybackButtons();
  updateProjectionButton();
  renderProjectionScene();
  const summary = comps.map(comp => {
    const count = complicationSegments(comp, env, med).length;
    return count > 1 ? `${comp}（${count} 段）` : comp;
  });
  const cond = `${env}／${med}` + (comps.length
    ? `／突發狀況 ${comps.length} 組：${summary.join('、')}`
    : '／未選突發狀況');
  const detail = genCount === 1
    ? cond
    : `${cond}｜換了 ${changed} 個角色的素材` + (locked ? `，${locked} 個角色只有 1 筆素材可選` : '');
  setStatus(`第 ${genCount} 次產生 · ${detail}`);
}

function playMediaIn(root) {
  root.querySelectorAll('.card').forEach(card => {
    const selected = card.querySelector('.media-option.selected audio[src], .media-option.selected video[src]');
    const el = selected || card.querySelector('audio[src], video[src]');
    if (el) {
      el.currentTime = 0;
      el.play().catch(() => {});
    }
  });
}

function stopMediaIn(root) {
  root.querySelectorAll('audio, video').forEach(el => { el.pause(); el.currentTime = 0; });
}

// 場景底層（環境＋病患）一起播；突發狀況各組自己按，避免多個突發狀況同時炸開
function playScene() {
  playMediaIn($('cards'));
  playProjection();
}
function stopAll() {
  stopMediaIn($('cards'));
  stopMediaIn($('comp-groups'));
  stopComplicationProjection();
  stopProjection();
}

// ---------- 快捷鍵 ----------
// 教官的手不會固定在某一個視窗上，所以主視窗與投影視窗都要掛一份。
// 焦點在表單元件上時一律放行——不然使用者在調滑桿或選單，按方向鍵卻跳了頁。
const FORM_TAGS = ['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON', 'OPTION'];

function handleFlowKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (FORM_TAGS.includes(tag) || (e.target && e.target.isContentEditable)) return;

  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': case 'Spacebar':
      if (!flowSteps.length) return;
      e.preventDefault();
      if (flowIndex < 0) gotoFlow(0); else nextFlow();
      break;
    case 'ArrowLeft': case 'PageUp':
      if (!flowSteps.length) return;
      e.preventDefault();
      prevFlow();
      break;
    case 'Home':
      if (!flowSteps.length) return;
      e.preventDefault();
      gotoFlow(0);
      break;
    case 'End':
      if (!flowSteps.length) return;
      e.preventDefault();
      gotoFlow(flowSteps.length - 1);
      break;
    case 'Escape':
      e.preventDefault();
      stopFlow();
      break;
    default:
  }
}

document.addEventListener('keydown', handleFlowKey);

$('btn-gen').addEventListener('click', generate);
// 手動改選單＝離開情境：流程會指向已經不存在的素材，留著比清掉更危險
// 順序有意義：先更新可用性（可能取消掉已不可用的勾選），再同步亮起狀態
const onConditionChange = () => { refreshComplicationAvailability(); syncScenarioActive(); leaveScenario(); };
$('sel-env').addEventListener('change', onConditionChange);
$('sel-med').addEventListener('change', onConditionChange);
$('btn-project').addEventListener('click', openProjection);
$('btn-play').addEventListener('click', playScene);
$('btn-stop').addEventListener('click', stopAll);
window.addEventListener('beforeunload', () => {
  if (projectionWindow && !projectionWindow.closed) projectionWindow.close();
});
init();
</script>
