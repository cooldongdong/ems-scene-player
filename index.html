<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防員場 事件腳本產生器</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #23272f;
    --line: #31363f;
    --text: #e9ecf1;
    --muted: #99a1af;
    --accent: #ff6b3d;
    --accent-dim: #ff6b3d22;
    --ok: #4ec9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 72px; }
  header h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }

  /* ---------- 編輯是「另一個畫面」 ----------
     不是同一頁往下長出幾個控制項，而是整個版面換掉：標題區與情境清單收起來，
     編輯佔滿整個寬度，靠頂部那條「‹ 回到情境」回去。使用者要「感覺自己進到了
     另一個地方」，靠的是版面換掉，不是欄位重排。 */
  body.editing .workspace-side { display: none; }
  /* 編輯模式收掉大標與說明，但**狀態列要留著**。
     原本這裡是 `body.editing header { display:none }`，於是「已匯出」「id 已改成…」
     「還不能貢獻」這些訊息全部寫進黑洞——程式不會報錯，字也確實寫進去了，
     使用者就是看不到。這正是 <header> 裡那行「狀態列必須永遠看得見」的註解要防的事，
     只是編輯畫面出現之後沒有人回頭看它。
     不要改成「把狀態列搬進編輯畫面」：那個節點會落進 #flow，而 renderFlow 每次
     replaceChildren 都會把它連根銷毀，下一次 getElementById 就是 null——踩過。 */
  body.editing header > :not(.status-line) { display: none; }
  body.editing header { margin: 0; }
  /* 但**只留錯誤**。成功的事情畫面上看得出來：匯出會下載一個檔、複製會直接跳到
     複本、改 id 欄位自己就變了。常駐一行「素材庫已載入：34 筆」只是把上一個畫面的
     訊息帶進來佔位置。看不出來的是「這件事沒做成、原因是什麼」，那才需要文字。 */
  body.editing .status-line:not(.error) { display: none; }
  body.editing .status-line.error { margin: 0 0 10px; }
  body.editing .workspace { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
  body.editing .workspace-main { margin-top: 0; }
  /* 編輯畫面自己有一條頂欄，所以外框不需要再留一圈圓角與邊界 */
  /* 編輯時把 .wrap 的左右留白還給預覽——那是整個畫面最需要空間的東西 */
  body.editing .wrap { max-width: none; padding-left: 16px; padding-right: 16px; }
  body.editing .workspace-main.panel {
    border-radius: 0; border-left: 0; border-right: 0; border-top: 0;
    min-height: 100vh;
    /* 窄畫面（單欄）時右欄仍靠 sticky 跟著捲，**這一行是它能不能成立的關鍵**：
       瀏覽模式為了右欄滑入動畫設了 overflow:hidden，而 overflow 不是 visible 的
       祖先會讓底下所有 position:sticky 失效——不會報錯，只是安靜地跟著捲走。
       寬畫面走底下那組固定高度的版面，那裡整頁本來就不捲，用不到 sticky。 */
    overflow: visible;
  }

  /* ---------- 編輯畫面鎖成一個視窗高 ----------
     整頁不再捲，只有左欄的頁清單自己捲。這解掉的是同一個病的兩個症狀：
     ① **分隔 bar 跟視窗一樣高**——bar 的高度是 grid 的列高，而在「整頁往下長」
        的版面裡，列高等於較高那一欄的內容高度，跟視窗沒有關係。
     ② **滾輪不再把整個編輯畫面推走**——「‹ 回到情境」的出口、預覽、備註
        永遠在原地，眼睛不用追。
     窄畫面（單欄）刻意不套用：那裡本來就該是一條可以一路捲到底的長頁面。 */
  @media (min-width: 901px) {
    body.editing { overflow: hidden; }
    body.editing .wrap {
      height: 100vh; padding-top: 16px; padding-bottom: 0;
      display: flex; flex-direction: column;
    }
    /* 從 .wrap 到 .edit-screen 每一層都要「有確定高度且不自己撐高」，
       中間漏掉任何一層，高度就會在那裡退回內容高度，底下全部跟著失效。
       min-height:0 是必要的：flex 子項預設 min-height:auto，會被內容撐破。 */
    body.editing .workspace { flex: 1; min-height: 0; align-items: stretch; }
    body.editing .workspace-main.panel {
      min-height: 0; display: flex; flex-direction: column;
    }
    body.editing #flow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    body.editing .edit-screen { flex: 1; min-height: 0; align-items: stretch; }

    /* 左欄：頂部（‹ 回到情境、情境名稱、第 N/M 步）釘住，只有頁清單捲 */
    body.editing .edit-main { display: flex; flex-direction: column; min-height: 0; }
    body.editing .flow-head { flex: none; }
    /* **bar 兩側看起來一樣寬，靠的是這三行。**
       .edit-main 的 padding-right:14px 是為了讓左欄與 bar 之間留白，但左欄的清單
       底下還永遠留著一條捲軸槽（scrollbar-gutter:stable ＋ padding-right:4px），
       於是卡片右緣離 bar 是 14+15=29px，而右邊只有 14px——**左邊看起來寬一倍**，
       而且捲軸沒出現時那 15px 是一塊純空白，沒有任何東西解釋它為什麼在那裡。
       所以左欄自己不再留 padding，改由捲軸槽當那份間距；頂欄沒有捲軸槽，
       手動補上一樣的寬度，才能跟底下的卡片右緣切齊。 */
    body.editing .edit-main { padding-right: 0; }
    body.editing .flow-head { padding-right: 15px; }
    body.editing .edit-main .flow-list {
      flex: 1; min-height: 0; overflow-y: auto;
      padding-right: 4px;          /* 捲軸不要壓在列的右邊界上 */
      scrollbar-gutter: stable;
      /* **這一行不能省。** .flow-list 是 grid，而 grid 的 align-content 預設是
         stretch：它本來高度隨內容走、沒有多餘空間所以看不出來；一旦變成固定高度
         的捲動容器，頁不夠多時剩下的空白就會被平均塞進每一列之間，看起來像
         「間距整個變大了」。列距要由 gap 決定，不是由「還剩多少空間」決定。 */
      align-content: start;
    }
    /* 捲軸交給頁面自己畫：系統預設那條在深色底上是一塊亮灰，比它旁邊的任何
       一列都搶眼。細一點、用邊框色、平常淡、滑到才明顯。
       標準屬性與 ::-webkit-scrollbar 兩套都寫：新版 Chrome／Firefox／Safari 走
       上面那兩行（且會讓 webkit 那組失效），舊版 Safari／Chrome 走下面那組。 */
    body.editing .edit-main .flow-list {
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    body.editing .edit-main .flow-list::-webkit-scrollbar { width: 10px; }
    body.editing .edit-main .flow-list::-webkit-scrollbar-track { background: transparent; }
    body.editing .edit-main .flow-list::-webkit-scrollbar-thumb {
      /* border + background-clip：讓拇指看起來比軌道窄，兩側留白靠邊框做出來 */
      background: var(--line); border-radius: 999px;
      border: 3px solid transparent; background-clip: content-box;
    }
    body.editing .edit-main .flow-list:hover { scrollbar-color: #454b57 transparent; }
    body.editing .edit-main .flow-list::-webkit-scrollbar-thumb:hover {
      background: #454b57; background-clip: content-box;
    }

    /* 右欄：整個畫面都不動了，sticky 沒有意義也沒有作用（它需要一個會捲的祖先）。
       視窗變矮時讓步的是預覽——備註與翻頁列是固定高度的，而且都是不能被切掉的東西。 */
    body.editing .edit-aside { position: static; display: flex; min-height: 0; }
    body.editing .edit-sticky { flex: 1; min-height: 0; container-type: size; }
    /* 預覽**不吃剩餘空間**（flex: 0 1 auto）：它是 16:9 的，長不高就是長不高，
       讓它 flex:1 只會把多出來的高度變成舞台上下兩塊空白，並把備註推到最底下。
       剩餘空間留在整欄最後，跟改版前一樣；列距一律交給 .edit-sticky 的 gap。 */
    body.editing .edit-sticky .preview {
      flex: 0 1 auto; min-height: 0; max-height: none; margin-bottom: 0;
    }
    /* 舞台**必須維持 16:9**：圖層的 x/y 是百分比，框一被壓扁，預覽的位置就
       對不上投影。所以不用 max-height 夾（那會拉伸），而是直接算出
       「塞得進這個框的 16:9 寬度」——高不夠就用高換算，寬不夠就用寬。
       --preview-reserve 是同欄其他東西（翻頁列、備註、gap）實際佔掉的高度，
       由 updatePreviewFit() 量出來寫進來。寫死一個數字遲早跟備註欄對不上，
       而低估的方向會把備註擠出畫面——整頁不捲，擠出去就是永遠看不到。 */
    body.editing .edit-sticky .preview-stage {
      width: min(100cqw, calc((100cqh - var(--preview-reserve, 200px)) * var(--stage-aspect, 1.778)));
      height: auto;
    }
  }

  /* 標題平常是標題，雙擊才變輸入框 */
  .inline-title { margin-top: 4px; }
  .inline-title-view {
    font-size: 17px; font-weight: 600; color: var(--text);
    padding: 6px 8px; border-radius: 8px; border: 1px solid transparent;
    cursor: inherit;              /* 不要 I 型游標——它不是輸入框，是一段標題 */
  }
  .inline-title-view:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .inline-title-edit {
    width: 100%; padding: 6px 8px; font: inherit; font-size: 17px; font-weight: 600;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
  }

  /* ---------- 編輯畫面：左操作、右結果 ----------
     左欄放全部的編輯功能，右欄只有預覽而且 sticky——改哪一格眼睛都不用移動。
     舊版是預覽在上、編輯在下，捲一下就有一邊看不見。 */
  /* 欄寬由 buildFlowPanel 寫在 style 上（存在 localStorage），這裡只給預設值 */
  .edit-screen {
    display: grid; grid-template-columns: 42% 10px minmax(0, 1fr);
    gap: 0; align-items: start;
  }
  /* bar 兩側留一樣的間距——只給左欄的話，預覽會整個貼到 bar 上，看起來像沒對齊 */
  .edit-main { padding-right: 14px; }
  .edit-aside { padding-left: 14px; }
  .edit-splitter {
    align-self: stretch; min-height: 220px; cursor: col-resize;
    position: relative; border-radius: 3px;
  }
  .edit-splitter::before {
    content: ''; position: absolute; inset: 0 4px; border-radius: 3px;
    background: var(--line); transition: background .15s;
  }
  .edit-splitter:hover::before, .edit-splitter:focus-visible::before { background: var(--accent); }
  .edit-splitter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 拖曳中：整頁禁止選字，游標一路維持 col-resize，不然滑出 bar 就變回箭頭 */
  body.splitting { user-select: none; cursor: col-resize; }
  .edit-aside { position: sticky; top: 16px; }
  .edit-sticky { display: flex; flex-direction: column; gap: 8px; }
  /* 預覽與備註之間：翻頁靠左、整場設定靠右 */
  .preview-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-top: 4px;
  }
  .preview-bar .flow-actions { margin: 0; }
  .note-field { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .note-label { font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .note-field textarea {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 84px;
    padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.6;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .note-field textarea:focus { outline: none; border-color: var(--accent); }
  .note-field textarea::placeholder { color: var(--muted); }
  /* 預覽最高不超過視窗，否則頁一多右欄自己就先捲掉了 */
  /* 上限放寬：欄拖寬之後若高度先撞到上限，會出現「拖了卻沒變大」 */
  .edit-sticky .preview { max-height: calc(100vh - 32px); }
  /* 窄畫面疊成一欄，預覽回到最上面並維持 sticky */
  @media (max-width: 900px) {
    .edit-screen { grid-template-columns: minmax(0, 1fr) !important; }
    .edit-splitter { display: none; }
    .edit-main { padding-right: 0; }
    .edit-aside { order: -1; top: 0; padding-left: 0; }
  }

  /* 一頁 = 一列標頭 ＋（展開時）它的內容。只有目前這一頁是展開的。 */
  .flow-item { border-radius: 10px; }
  /* 列距一律由 .flow-list 的 gap 決定。展開的卡片曾經另外帶 margin: 6px 0，
     結果是「相鄰間距」變成兩種（6px 或 12px，看鄰居展開了沒），而界線兩側
     剛好各站一種時就會歪得最明顯。卡片要被看出來靠的是外框與底色，不是外距。 */
  .flow-item.expanded {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  /* 展開時外框由外層畫，列自己不再畫——否則列的方角會戳出外層的圓角 */
  .flow-item.expanded:has(> .flow-row.current) { border-color: var(--accent); }
  .flow-item.expanded > .flow-row {
    border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; background: transparent;
  }
  .flow-item.expanded > .flow-row.current { background: var(--accent-dim); }
  .flow-body { padding: 4px 12px 14px; }
  .flow-body-inner > .panel-section-title:first-child { margin-top: 8px; }
  .flow-row-title .inline-title-view { font-size: 14px; font-weight: 500; padding: 3px 6px; }
  .flow-row-title .inline-title-edit { font-size: 14px; padding: 3px 6px; }

  /* 每頁自己的複製／刪除：hover 或鍵盤 focus 時才浮出來。
     常駐兩顆大按鈕會蓋過內容，而且「這頁」指的是哪一頁並不明顯。 */
  .flow-row-tools { display: flex; gap: 4px; margin-left: 6px; opacity: 0; transition: opacity .12s; }
  .flow-row:hover .flow-row-tools,
  .flow-row:focus-within .flow-row-tools { opacity: 1; }
  .flow-row-tools button { padding: 2px 7px; font-size: 12px; line-height: 1.5; }
  /* ---------- 兩欄工作區 ----------
     左邊挑情境、右邊看預覽並決定要演還是要改。預覽是選完情境後最重要的東西，
     所以右欄拿走全部剩餘寬度；窄畫面時疊成一欄，情境清單在上。 */
  /* 還沒挑情境時左欄佔滿畫面，讓人一眼看完所有情境；選了才把右欄推出來。
     兩個狀態都是「兩軌」（0fr → 1fr），軌數不變才動得起來——
     1fr → 260px 1fr 是軌數改變，瀏覽器不會補間。 */
  /* 欄寬**不做 transition**：兩個狀態的軌道定義是 minmax(0,1fr) → minmax(200px,260px)，
     min 從 0 變 200px、max 從 1fr 變 260px，fr 與 px 之間無法插值，瀏覽器會卡在起始值
     （實測快速重繪時欄寬就停在未選狀態不動）。所以欄寬瞬間切換，
     「滑入」的感覺改由右欄自己的位移＋淡入負責——那兩個屬性一定插得動。 */
  .workspace {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
    gap: 0; align-items: start; margin-top: 24px;
  }
  .workspace.has-scenario { grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); gap: 20px; }
  .workspace-side { position: sticky; top: 16px; min-width: 0; }
  /* 兩欄上緣要切齊：右欄沿用 .panel 的 margin-top 會比左欄低 24px，
     padding 也得跟左欄的卡片一致，否則第一行內容仍對不齊。 */
  .workspace-main {
    min-width: 0; overflow: hidden; margin-top: 0; padding: 14px;
    opacity: 0; transform: translateX(18px);
    transition: opacity .3s ease, transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .workspace.has-scenario .workspace-main { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .workspace-main { transition: none; transform: none; }
  }
  @media (max-width: 820px) {
    .workspace, .workspace.has-scenario { grid-template-columns: 1fr; }
    .workspace-side { position: static; }
  }
  .stage-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stage-bar button { font-size: 14px; padding: 9px 16px; }
  /* 瀏覽模式只需要「開始投影」，播放與停止是編輯時才用得到的 */
  .stage-bar.browse #btn-play { display: none; }

  /* 媒體池：實際發出聲音的地方。推到畫面外而不是 display:none／hidden——
     隱藏的 <video> 在部分瀏覽器不保證會播，而這裡的綠幕影片正是靠原聲發聲。 */
  #media-pool { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
  /* 音量。滑桿平常不佔位（絕對定位浮在按鈕上方），不然主控列會被撐開一截 */
  .volume { position: relative; display: inline-flex; align-items: center; }
  /* 瀏覽模式是「確認這是不是我要的情境」，不是調音的地方——調音屬於編輯 */
  .stage-bar.browse .volume { display: none; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 9px 12px; line-height: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  /* 直的滑桿：音量就是「高低」，橫的要在腦子裡轉一次。
     writing-mode 直排 ＋ direction: rtl ＝ 下面是小聲、上面是大聲。 */
  .volume-popup {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    /* 這一層是透明的橋：**貼著按鈕**，滑鼠從按鈕移向滑桿的路上不會離開 .volume。
       留成真的空隙（bottom: calc(100% + 8px)）的話，滑桿會在半路消失。
       視覺上的空隙由這層的 padding-bottom 讓出來，看得見的是內層。 */
    padding-bottom: 8px;
    opacity: 0; visibility: hidden;
    /* 淡出：visibility 沒有中間值，所以延後到淡完才切，否則會直接消失 */
    transition: opacity .18s ease, visibility 0s linear .18s;
  }
  .volume:hover .volume-popup,
  .volume:has(:focus-visible) .volume-popup {
    opacity: 1; visibility: visible;
    transition: opacity .18s ease, visibility 0s;
  }
  .volume-panel {
    position: relative;
    /* **display: flex 不能省。** input 預設是 inline 元素，會坐在文字基線上，
       底下多出一截下緣間隙——於是細線離上緣與離下緣的距離不一樣。 */
    display: flex;
    padding: 14px 12px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
  }
  /* 細軌道自己畫成一個元素，不是 input 的背景：背景圓不了角，而端點的圓角
     正是它看起來像「一條軌道」而不是「一段色塊」的原因。
     上下用 inset 對齊 panel 的 padding，所以它與 input 的可拖範圍完全重合。 */
  .volume-panel::before {
    content: ''; position: absolute; z-index: 0;
    top: 14px; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 5px; border-radius: 999px;
    background: linear-gradient(to top,
      var(--accent) var(--fill, 100%), rgba(255, 255, 255, .14) var(--fill, 100%));
  }
  /* **input 的寬度要等於軌道的寬度，不能更寬。**
     input 16px、軌道 5px 的時候，軌道靠著自己的框對齊、thumb 靠著 input 的框對齊，
     兩個中心對不上——畫出來就是歪的。左右用 padding 撐出好按的範圍，
     padding 只影響橫向，不會動到「拖到哪等於幾」。 */
  .volume-panel input[type=range] {
    -webkit-appearance: none; appearance: none;
    writing-mode: vertical-lr; direction: rtl;
    display: block; position: relative; z-index: 1;
    width: 14px; height: 104px; margin: 0; padding: 0 6px;
    box-sizing: content-box; background: transparent; cursor: pointer;
  }
  /* 原生軌道整個透明：看得見的那條由 .volume-panel::before 畫，
     這裡只留下「可以拖」這件事。兩邊都畫的話，粗細與圓角會有兩個決定者。 */
  .volume-panel input[type=range]::-webkit-slider-runnable-track {
    width: 14px; height: 100%; background: transparent;
  }
  .volume-panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .5);
  }
  .volume-panel input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  /* 靜音不換顏色：圖示本身（喇叭上打叉）已經說完了，再加一個紅框是同一件事講兩次 */


  .field label.title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  select {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .coverage-note.warn { color: #ffb27a; }
  .assets-link { margin: 4px 0 0; font-size: 13px; }
  .assets-link a { color: var(--muted); text-decoration: none; }
  .assets-link a:hover { color: var(--accent); }

  /* 情境清單：左欄的直式清單，一列一個情境 */
  .presets {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .presets .title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; letter-spacing: .5px; }
  /* 沒選情境時鋪成多欄（左欄佔滿畫面），選了之後收成一欄 */
  .preset-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .workspace.has-scenario .preset-list { grid-template-columns: 1fr; }
  .preset-list button[data-scenario-id] {
    width: 100%; text-align: left; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; line-height: 1.4;
  }
  .preset-list .flow-actions { grid-column: 1 / -1; }
  /* 目前載入的那一組亮起來，讓人知道自己在哪 */
  .preset-list button.active { border-color: var(--accent); background: var(--accent-dim); }
  /* 新增／匯出／匯入排在清單底下，跟情境本身分開 */
  .preset-list .flow-actions { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .preset-list .flow-actions button { font-size: 13px; padding: 6px 12px; }

  /* ---------- 流程 ----------
     builder 仍吃 doc 參數，之後若要把面板再長回投影視窗，接上宿主即可。 */
  /* 現在是右欄的第一個元素，不能再帶舊版那條分隔線的上緣間距，否則跟左欄對不齊 */
  .flow { margin-top: 0; padding-top: 0; border-top: 0; }
  .flow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .flow-title { font-size: 16px; font-weight: 700; }
  .flow-title .inline-title-view { font-size: 16px; font-weight: 700; padding: 4px 8px; }
  .flow-title .inline-title-edit { font-size: 16px; font-weight: 700; padding: 4px 8px; }
  .flow-counter { font-size: 13px; color: var(--muted); margin-left: auto; }
  .flow-now {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 15px; line-height: 1.5;
  }
  .flow-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .flow-btn { font-size: 14px; padding: 8px 16px; }
  .flow-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 700; }
  .flow-list { display: grid; gap: 6px; margin-top: 12px; }
  .flow-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 14px;
  }
  .flow-row.clickable { cursor: pointer; }
  .flow-row.clickable:hover { border-color: var(--accent); }
  /* 目前播到的那一頁；訓練進行中這是唯一要一眼看到的資訊 */
  .flow-row.current { border-color: var(--accent); background: var(--accent-dim); }
  /* 關掉的頁留在清單裡（是跳過，不是刪除），但要一眼看得出它不會播 */
  .flow-row.off .flow-row-title { text-decoration: line-through; opacity: .55; }
  .flow-row-title { flex: 1 1 auto; }
  .flow-row-meta { flex: none; font-size: 12px; color: var(--muted); }
  .flow-toggle { display: inline-flex; align-items: center; flex: none; }
  .flow-toggle input { margin: 0; accent-color: var(--accent); }
  /* 自訂／改過的情境要一眼認得出來，否則不知道哪些是自己的 */
  .preset-list button.custom { border-style: dashed; }
  /* 引用到沒素材的突發狀況（多半是匯入別人的情境）——能點，但先講清楚 */
  .preset-list button.broken { border-color: #ffb27a; color: #ffb27a; }
  .flow-btn-mini { font-size: 12px; padding: 4px 10px; }
  button.danger { color: #ff8f6b; border-color: #6b3524; }
  button.danger:hover { border-color: #ff8f6b; }
  .flow-actions-tight { margin: -2px 0 4px; padding-left: 12px; }
  .flow-row.dragging { opacity: .4; }
  /* 拖曳時的插入位置提示：線畫在會插進去的那一側 */
  .flow-row { position: relative; }
  .flow-row.drop-before::before, .flow-row.drop-after::after {
    content: ''; position: absolute; left: 0; right: 0; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .flow-row.drop-before::before { top: -1px; }
  .flow-row.drop-after::after { bottom: -1px; }
  /* 眼睛：擺在圖層名稱之前，關掉時整列淡掉並劃線，一眼看出這層不會出現 */
  .layer-eye {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; border-radius: 7px; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--muted);
  }
  .layer-eye:hover { color: var(--text); border-color: var(--line); background: var(--panel); }
  .layer-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layer-eye.off { color: var(--muted); opacity: .8; }
  .edit-action:has(.layer-eye.off) .layer-name,
  .edit-action:has(.layer-eye.off) .layer-asset { opacity: .45; text-decoration: line-through; }
  /* grab 游標只出現在把手上。整列可拖時游標整條都是 grab，會讓人以為哪裡都能拖 */
  .flow-drag {
    flex: none; color: var(--muted); cursor: grab;
    padding: 0 2px; line-height: 1; user-select: none; opacity: .5;
  }
  .flow-drag:hover { opacity: 1; color: var(--accent); }
  .flow-drag:active { cursor: grabbing; }

  /* 編輯頁 */
  .edit-field { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  /* 標籤固定寬、不換行，兩個欄位的輸入區才會左側切齊 */
  .edit-field > span { flex: 0 0 64px; white-space: nowrap; }
  .edit-field input, .edit-field select {
    flex: 1 1 auto; padding: 8px 10px; font: inherit; font-size: 14px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  /* 情境層設定：整組共用，與下面的逐頁編輯用一條分隔線隔開 */
  /* 情境設定列：沿用手風琴，但刻意不長得像一頁——沒有編號、沒有勾選框、不能拖 */
  .settings-row { gap: 10px; }
  .settings-gear { flex: none; color: var(--muted); font-size: 14px; line-height: 1; }
  .settings-row:hover .settings-gear { color: var(--accent); }
  /* 整個情境的操作（匯出／貢獻／刪除）。用一條線跟上面的環境×急救事件隔開：
     上面是「這個情境是什麼」，下面是「拿這個情境做什麼」，同一個面板裡的兩件事。 */
  .settings-actions {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .settings-actions button, .settings-actions .flow-btn { font-size: 13px; padding: 6px 12px; }
  /* 只在「這個情境還不能貢獻」時才出現，所以不是常駐說明，是當下的理由 */
  .settings-note { margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: #ff8f6b; }
  /* 同一個位置，但這一則不是「出事了」，是「你還有一步要做」 */
  .settings-note-plain { color: var(--muted); flex-basis: 100%; }
  /* 連結版的按鈕：<a> 沒有 button 的預設樣式，這裡把它補齊 */
  a.flow-btn {
    display: inline-block; text-decoration: none; line-height: normal;
    font-family: inherit; font-size: 15px; padding: 11px 22px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  a.flow-btn:hover { border-color: var(--accent); }
  /* 與底下的頁之間留一條界線：它不是第 0 頁。
     **這條線是 .flow-list 自己的一格，不是設定列的 ::after。** 畫在設定列裡面時，
     展開狀態的 .flow-item 會用 overflow:hidden ＋ 外框把它吃掉（線消失），而且
     上下間距會變成兩種——上面是 ::after 的 margin 8px，下面是 grid gap 6px。
     當成格子畫就兩邊都吃 gap，永遠對稱，也永遠不會被誰蓋住。 */
  /* 界線兩側比一般列距再開一點：情境設定管的是「這一整組」，底下管的是「這一頁」，
     那是一次層級的切換，不是下一列。margin 兩邊一樣，加上 gap 後上下各 14px。 */
  .flow-divider { height: 1px; background: var(--line); margin: 8px 0; }
  .edit-action {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
    padding: 9px 11px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .edit-action select, .edit-action input {
    padding: 7px 9px; font: inherit; font-size: 13px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
  }
  .edit-action select { width: auto; flex: none; }
  .edit-action input { flex: 1 1 140px; min-width: 100px; }
  .edit-action .edit-seg { flex: 0 1 130px; }
  /* ---------- 預覽 ----------
     16:9 的框，圖層用與投影端相同的百分比定位；container-type 讓文字大小
     跟著框寬走（cqw），縮圖與投影上的比例才會一致。 */
  /* 預覽拿走右欄的全寬——選完情境後它是最重要的東西 */
  .preview { margin-bottom: 16px; }
  /* 舞台的長寬比跟著「目前在調哪一種投影格式」走（COO-104）。
     以前這裡寫死 16/9，還配著一句「舞台必須維持 16:9，框一被壓扁位置就對不上投影」——
     那句話的前提是投影一定是 16:9，而訓練場是 270°。**要調超寬螢幕的版面，
     預覽就得先變成超寬**，否則等於閉著眼睛調。 */
  .preview-stage {
    position: relative; width: 100%; aspect-ratio: var(--stage-aspect, 16 / 9);
    overflow: hidden; border-radius: 10px; background: #000;
    border: 1px solid var(--line); container-type: size;
  }
  /* 場景的框由 Scenarios.sceneBoxStyle() 以百分比寫在 style 上（COO-104）。
     框的長寬比永遠等於素材本身，所以 object-fit 用 fill 也不會變形；
     用 fill 是為了讓「框多大就畫多大」這件事只有一個決定者。 */
  .preview-scene { position: absolute; object-fit: fill; }
  /* 圖層外包一層：絕對定位且寬高 auto 會縮到內容大小，把手才貼得到真正的邊角。
     媒體的尺寸上限用 px 由 JS 依 stage 實際寬高算出——百分比在 shrink-to-fit
     的容器裡會變成循環參照，瀏覽器直接當成沒設。 */
  .preview-item {
    position: absolute; transform: translate(-50%, -50%);
    line-height: 0; cursor: grab; touch-action: none;
  }
  .preview-item.dragging { cursor: grabbing; }
  .preview-item:hover, .preview-item.dragging { outline: 1px dashed rgba(255,255,255,.65); outline-offset: 2px; }
  /* 瀏覽模式：預覽只是給人看的，不給拖也不給把手 */
  .preview-locked .preview-item { cursor: default; }
  .preview-locked .preview-item:hover { outline: none; }
  .preview-locked .preview-handle { display: none; }
  .preview-media {
    display: block; width: auto; height: auto; object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
    pointer-events: none;   /* 拖曳事件一律由外層接，免得抓到圖片的原生拖曳 */
  }
  .preview-handle {
    position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
    border-radius: 3px; background: var(--accent); border: 1px solid #1a1005;
    cursor: nwse-resize; opacity: 0; transition: opacity .15s ease; touch-action: none;
  }
  .preview-item:hover .preview-handle, .preview-item.dragging .preview-handle { opacity: 1; }
  /* 說明文字也是一個 .preview-item（外層負責定位與拖曳），這裡只管它長什麼樣。
     寬度上限掛在外層而不是這裡：外層是 shrink-to-fit，在裡面寫百分比會變成
     循環參照被瀏覽器當成沒設——與 .preview-media 踩過的是同一個坑。 */
  .preview-item[data-type="text"] { max-width: 90%; }
  .preview-text {
    text-align: center; color: #fff; font-weight: 700; line-height: 1.3;
    text-shadow: 0 2px 6px rgba(0,0,0,.85); white-space: pre-wrap;
    filter: none;   /* 蓋掉 .preview-media 的 drop-shadow，文字用自己的 text-shadow */
  }
  .preview-empty, .preview-missing {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; font-size: 12px; color: var(--muted);
  }
  .preview-missing { color: #ffb27a; align-content: end; inset: auto 0 8px 0; }
  .preview-caption { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* 預覽上的翻頁：貼在左右兩側，滑鼠移到預覽上才浮現，平常不擋畫面 */
  .preview-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
    width: 40px; height: 56px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff;
    font: 700 20px/1 inherit; cursor: pointer;
    opacity: 0; transition: opacity .18s ease;
  }
  .preview-stage:hover .preview-nav { opacity: .85; }
  /* 投影格式分頁。長得像分頁而不是按鈕：它切換的是「你正在看哪一種螢幕」，
     不是一個會做事的動作。 */
  /* 預設位置畫布的角標：預覽在這個狀態下顯示的不是某一頁，必須講出來 */
  .preview-badge {
    position: absolute; left: 8px; top: 8px; z-index: 4;
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(0,0,0,.66); color: var(--accent); border: 1px solid var(--accent);
    pointer-events: none;
  }
  .format-tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .format-tab {
    font-size: 12px; padding: 5px 12px; border-radius: 999px;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
  }
  .format-tab.active { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
  /* 還沒調過的格式：目前照基準那組在跑，用虛線邊講出「這裡還沒被決定」 */
  .format-tab.untuned:not(.active) { border-style: dashed; }
  .preview-nav:hover { opacity: 1 !important; background: rgba(0,0,0,.8); }
  .preview-nav:disabled { opacity: 0 !important; pointer-events: none; }
  .preview-nav.prev { left: 8px; }
  .preview-nav.next { right: 8px; }
  .preview-page {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4;
    padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.6);
    font-size: 12px; color: #fff; pointer-events: none;
  }

  /* 瀏覽模式：確認這是不是要的情境，只給兩個出口 */
  .browse-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .browse-title { font-size: 20px; font-weight: 700; }
  .browse-meta { font-size: 13px; color: var(--muted); }
  .browse-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .browse-actions .flow-btn { font-size: 15px; padding: 11px 22px; }

  .edit-pages .flow-row { padding: 7px 9px; font-size: 13px; gap: 8px; }
  .edit-pages .flow-row-meta { font-size: 11px; }
  .flow-row-num {
    flex: 0 0 20px; text-align: right; font: 600 12px/1 ui-monospace, monospace;
    color: var(--muted);
  }
  .flow-row.current .flow-row-num { color: var(--accent); }
  .layer-asset {
    flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .layer-name { flex: 0 0 68px; font-size: 13px; color: var(--muted); }
  .edit-tools { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .edit-tools .flow-btn { font-size: 13px; padding: 5px 9px; }

  button {
    font-family: inherit; font-size: 15px; padding: 11px 22px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .overlay-controls button.reset { font-size: 13px; padding: 5px 12px; white-space: nowrap; }
  .overlay-controls button.preview.on { border-color: var(--accent); background: var(--accent-dim); }

  #status { color: var(--muted); font-size: 13px; }
  #status:empty { display: none; }
  /* 出錯時要夠明顯：它常常是使用者唯一能看到的線索 */
  #status.error {
    color: var(--accent); font-weight: 600;
    padding: 8px 12px; border-radius: 8px;
    background: var(--accent-dim); border: 1px solid var(--accent);
  }
  .status-line { margin: 10px 0 0; }

  .role {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    font-size: 12px; color: var(--muted);
  }
  .role strong { font-size: 15px; color: var(--text); }
  /* 素材路徑是不能斷行的長字串，窄視窗會把卡片撐出橫向捲動 */
  .meta { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .badge.hit { border-color: var(--ok); color: var(--ok); }
  .card.empty .desc { color: var(--muted); }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>消防員場 事件腳本產生器</h1>
    <p>選一個情境，確認畫面沒問題就可以開始投影；沒有合適的就新增或複製一個來改。</p>
    <!-- 狀態列必須永遠看得見。它曾經放在只有載入情境後才顯示的工具列裡，
         結果「資料層是舊版、請強制重新整理」這種訊息剛好在最需要被看到時被藏起來，
         使用者只看到一片空白的情境清單。 -->
    <p class="status-line" id="status">載入素材庫中…</p>
  </header>

  <!-- 兩欄：左邊挑情境，右邊看預覽並決定要演還是要改。
       預覽是選完情境後最重要的東西，所以它拿最大的一塊。 -->
  <div class="workspace">
    <aside class="workspace-side">
      <div class="presets" id="presets" hidden>
        <span class="title">情境</span>
        <div class="preset-list" id="preset-list"></div>
      </div>
      <p class="assets-link"><a href="assets.html">素材庫與覆蓋表 →</a></p>
    </aside>

    <section class="workspace-main panel">
      <div class="flow" id="flow" hidden></div>
      <!-- 這一列會被 renderFlow() 搬進當下模式該放的位置：
           節點是搬的不是重建的，所以 id、listener 與既有的啟用／文字邏輯都不受影響。 -->
      <div class="stage-bar" id="stage-bar">
        <button id="btn-project" disabled>開始投影</button>
        <button id="btn-play" disabled>播放環境音</button>
        <!-- 音量：滑桿收在按鈕上方，hover 或鍵盤 focus 才浮出來。
             兩者包在同一個容器裡，滑鼠從喇叭移到滑桿的路上不會經過容器外面，
             否則滑桿會在半路消失。 -->
        <div class="volume" id="volume-control">
          <button id="btn-mute" type="button" class="icon-btn" aria-label="靜音"></button>
          <!-- 兩層：外層是透明的「橋」，一路貼到按鈕，滑鼠移過去的路上不會離開
               .volume；看得見的那塊是內層，所以視覺上仍有空隙。 -->
          <div class="volume-popup">
            <div class="volume-panel">
              <input id="volume-slider" type="range" min="0" max="100" step="1"
                     aria-label="音量" title="音量">
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- 播放的實際宿主。 -->
  <div id="media-pool" aria-hidden="true"></div>
</div>

<script src="vendor/js-yaml.min.js"></script>
<script>
// 本地 vendor 讀不到時（例如只丟了 index.html）退回 CDN
if (typeof jsyaml === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"><\/script>');
}
</script>
<!-- 情境資料層：純函式、不碰 DOM，同一份檔案也被 test/scenarios.test.js 用 Node 載入測試 -->
<script src="js/scenarios.js"></script>
<script>
const ROLES = [
  { role: 'environment_video',  label: '環境影像' },
  { role: 'ambient_sound',      label: '環境聲音' },
  { role: 'patient_photo',      label: '病患樣貌照片' },
  { role: 'patient_voice',      label: '病患聲音' },
  { role: 'complication_video', label: '突發狀況綠幕影片' },
  { role: 'complication_voice', label: '突發狀況聲音' },
];
// 這兩個角色一律成對綁在同一個突發狀況上，避免影片與台詞來自不同事件
const COMPLICATION_ROLES = ['complication_video', 'complication_voice'];
const BASE_ROLES = ROLES.filter(r => !COMPLICATION_ROLES.includes(r.role));
const COMP_ROLES = ROLES.filter(r => COMPLICATION_ROLES.includes(r.role));
const PATIENT_PAIR_TAGS = ['gender', 'ageGroup'];
// 決定「哪一筆素材比較貼合這次條件」的維度，順序不影響結果
const SPECIFICITY_TAGS = ['environment', 'medicalEvent', 'complication'];

let DATA = null;
// key = 基本角色的 role，或突發狀況的 `role|突發狀況`（同一次可有多組，不能只用 role）
const lastPicked = {};   // key -> 上一次選到的 id，重新產生時盡量換一個
const mediaObjectUrls = new Set();
const mediaLoadControllers = new Set();
let currentEnvironmentAsset = null;
let currentPatientPhotoAsset = null;
let projectionWindow = null;

// 病患疊加的開關與版面；size 是「照片可佔畫面的比例」，x／y 是照片中心點位置
const PATIENT_OVERLAY_DEFAULTS = { size: 85, x: 50, y: 57 };
const patientOverlay = { enabled: false, ...PATIENT_OVERLAY_DEFAULTS };
// 大小／位置改成直接在預覽上拖，不再有滑桿——同一件事給兩種操作方式，
// 使用者會不知道該用哪個，而且兩邊的狀態遲早對不起來。

// ---------- 流程（第二刀）----------
// 「目前載入哪個情境、播到第幾頁」是一份狀態。編輯一律在主視窗——
// 投影視窗在投影機上、是給學員看的，任何介面出現在那裡都會被學員看到。
let currentScenario = null;
let flowIndex = -1;                    // 指向「會播的頁」的 index；-1 = 尚未開始
let panelLevel = 'browse';           // 'browse'（確認情境）| 'edit'（頁清單＋圖層，同一畫面）
let editingSlideId = null;             // 'edit' 層正在展開哪一頁；null = 全部收起
// 「情境設定」那一列有沒有展開。與 editingSlideId 一起構成一組手風琴：一次只開一個。
let settingsExpanded = false;
// 片段 key -> 播放函式，由 pickAssets() 登記與清空
const segmentPlayers = new Map();

// 綠幕疊加：每個突發狀況各自記版面與去背容差，重新產生情境後沿用
const COMP_OVERLAY_DEFAULTS = { size: 70, x: 50, y: 55, tolerance: 40 };
// 只剩去背：它調的是像素運算，不是空間位置，拖不出來。
// 容差再往上會開始吃掉白色、深色制服這類低彩度的顏色，所以上限收在 60。
const COMP_OVERLAY_SLIDERS = [
  { key: 'tolerance', label: '去背', min: 5,  max: 60, unit: '' },
];
// 一個突發狀況可以拆成好幾個片段，素材以 `突發狀況|片段` 當 key；
// 但版面設定是整個突發狀況共用一份——同一個人站在同一個位置，不該每段重調一次。
const complicationOverlays = {};       // 突發狀況 -> 版面設定
const complicationVideoAssets = {};    // 片段 -> 本次選到的綠幕素材
let activeComplication = null;         // 目前疊在投影上的那一段（含預覽）
let activeSegment = null;

function segmentKey(comp, segment) {
  return `${comp}|${segment}`;
}

function complicationOverlay(comp) {
  return complicationOverlays[comp] || (complicationOverlays[comp] = { ...COMP_OVERLAY_DEFAULTS });
}

// 版面現在寫在情境檔的圖層上。
//
// 舊版是「依當下的環境素材」存進 localStorage，那有兩個問題：
//   ① 它是依環境的，對不上圖層模型的依頁——同一個環境的兩頁想擺不同位置就做不到
//   ② 存在瀏覽器裡，換一台電腦就不見，也沒辦法跟別人分享或送 PR
// 圖層本來就要存自己的位置，所以這一層直接消失，不做遷移（2026-08-03 Dong 拍板）。

// text 沒有執行期物件（見 previewLayoutTarget），這裡列出來只是為了讓
// persistLayerLayout 的迴圈對三種型別長得一樣——它對 text 是自己寫給自己。
const LAYOUT_KEYS = {
  patient: ['size', 'x', 'y'],
  greenscreen: ['size', 'x', 'y', 'tolerance'],
  text: ['size', 'x', 'y'],
};

function currentSlide() {
  return flowIndex >= 0 ? flowSteps[flowIndex] : null;
}

// ---------- 投影格式（COO-104）----------
// 同一個情境會投在教室的 16:9 螢幕，也會投在訓練場的 270° 超寬投影上，而**同一組
// 座標在兩種螢幕上不會落在同一個地方**——x/y 是視窗寬高的百分比，size 又同時吃
// vw 與 vh 取小的，在超寬螢幕上永遠被高度綁住。所以每個圖層每種格式各存一份版面。
//
// **一次只有一個格式是「作用中」的，預覽與投影共用它。** 分成兩個的話，
// 編輯畫面顯示 16:9、投影機是超寬，人就會對著一個騙他的預覽調位置——而這個專案
// 最核心的性質就是「預覽 == 投影」。開投影視窗時會依它的長寬比自動切換。
let activeFormat = null;

function projectionFormats() {
  return Scenarios.projectionFormats(DATA && DATA.options);
}

function activeFormatId() {
  return activeFormat || Scenarios.baseFormatId(DATA && DATA.options);
}

function activeFormatInfo() {
  const id = activeFormatId();
  return projectionFormats().find(f => f.id === id) || projectionFormats()[0];
}

/**
 * 這個圖層在目前格式下「該被寫進哪裡」。
 * 基準格式就寫在圖層自己身上；其他格式寫進 layer.layouts[id]。
 *
 * 回傳的是**真正的儲存位置**（拖曳會就地改它），所以第一次建立時要先把目前生效的
 * 值抄進去——只寫 x 的話，沒寫的 size/y 會在下次讀取時退回基準，位置就會跳一下。
 */
/**
 * 換一個投影格式。**整個畫面連同投影視窗一起換**，因為作用中的格式只有一個。
 * 換完要重讀版面：執行期物件裡裝的是上一個格式的座標。
 */
function setActiveFormat(id) {
  if (id === activeFormatId()) return;
  activeFormat = id;
  const slide = (panelLevel === 'edit' && editingSlide()) || currentSlide();
  loadLayoutFromSlide(slide);
  renderFlow();
  // 投影視窗要立刻跟著跳，不然教官會以為切了沒事發生
  applyPatientOverlayLayout();
  applyComplicationOverlayLayout();
  renderProjectionText(slide);
  applyProjectionSceneBox();
}

function layoutSlot(layer, formatId) {
  if (!layer) return null;
  const base = Scenarios.baseFormatId(DATA && DATA.options);
  if (formatId === base) return layer;
  if (!layer.layouts) layer.layouts = {};
  if (!layer.layouts[formatId]) layer.layouts[formatId] = Scenarios.layoutFor(layer, formatId);
  return layer.layouts[formatId];
}

// 滑桿下方那行字要誠實：沒載入情境時調了不會被記住
// 進到某一頁時，把該頁圖層上的版面搬進執行期物件（渲染程式讀的還是這兩個物件）
/**
 * 這一頁的病患在某個格式下實際該站的位置。
 *
 * **這一頁還沒替這個格式調過時，退回「這個情境在這個格式的預設」**，而不是退回
 * 圖層的基準值——16:9 的座標放到 270° 上是錯的位置，而那正是切換格式後病患
 * 沒有跳到對的地方、要按一次歸位才會對的原因。
 *
 * 基準格式不走這條：它的值就寫在圖層自己身上，本來就是對的。
 */
function patientLayoutOf(slide, fmt) {
  const layer = Scenarios.layerOf(slide, 'patient');
  if (!layer) return null;
  if (fmt === Scenarios.baseFormatId(DATA.options) || Scenarios.hasLayoutFor(layer, fmt)) {
    return Scenarios.layoutFor(layer, fmt);
  }
  return Scenarios.patientHomeFor(currentScenario, fmt);
}

function loadLayoutFromSlide(slide) {
  Object.assign(patientOverlay, PATIENT_OVERLAY_DEFAULTS);
  // **就地覆寫，不能 delete 再重建。** 投影的去背迴圈與預覽都抓著這兩個物件的參考
  // （chromaRedraw 每一幀讀 complicationOverlay(comp).tolerance），換成新物件的話
  // 它們會繼續讀舊的那個孤兒，畫面就不會跟著動——這裡曾經踩過。
  Object.values(complicationOverlays).forEach(l => Object.assign(l, COMP_OVERLAY_DEFAULTS));

  // 讀的一律是「目前格式下生效的版面」，不是圖層上那組原始值——
  // 沒調過的格式會退回基準，那個退回發生在 Scenarios.layoutFor 裡，只有一份實作
  const fmt = activeFormatId();

  const patient = slide && Scenarios.layerOf(slide, 'patient');
  // 有沒有 patient 圖層就是「要不要疊病患」——不需要另一個獨立的開關狀態
  patientOverlay.enabled = !!patient;
  if (patient) {
    const layout = patientLayoutOf(slide, fmt);
    LAYOUT_KEYS.patient.forEach(k => { patientOverlay[k] = layout[k]; });
  }

  const green = slide && Scenarios.layerOf(slide, 'greenscreen');
  if (green) {
    const layout = complicationOverlay(green.complication);
    const from = Scenarios.layoutFor(green, fmt);
    LAYOUT_KEYS.greenscreen.forEach(k => { layout[k] = from[k]; });
  }
}

// 拖曳／滑桿改的是哪一個物件。
// patient 與 greenscreen 有執行期物件當中介（渲染程式抓著它的參考），圖層要等
// persistLayerLayout 才同步；**text 沒有**，它的位置只存在圖層上，所以直接寫回圖層。
// 不替 text 多開一個執行期物件，是因為那個物件唯一的用途就是「等一下再抄回圖層」——
// 多一份就多一次抄漏的機會，而它連一幀都不需要被別人抓著參考。
function previewLayoutTarget(type, comp, slide) {
  if (type === 'patient') return editingDefaults() ? patientHomeSlot() : patientOverlay;
  if (type === 'greenscreen') return complicationOverlay(comp);
  // text 直接寫回儲存位置——而「哪個儲存位置」取決於目前是哪一個投影格式
  if (type === 'scene') return sceneFrameSlot();
  return layoutSlot(Scenarios.layerOf(slide || currentSlide(), type), activeFormatId());
}

// 拖滑桿會連續觸發，每一格都寫 localStorage 太重，收斂成一次
let layoutSaveTimer = null;
function persistLayerLayout(type, comp) {
  // 場景不是圖層版面，它住在情境層——拖曳時就地改了 sceneFrame，這裡只要存檔
  if (type === 'scene') { persistSceneFrame(); return; }
  // 預設值畫布上動的是 patientHome，同樣住在情境層
  if (type === 'patient' && editingDefaults()) { persistSceneFrame(); return; }
  const slide = currentSlide();
  const layer = slide && Scenarios.layerOf(slide, type);
  // 沒載入情境（直接按「產生情境」的臨時模式）就只在記憶體裡調，不寫進任何情境檔
  if (!currentScenario || !layer) return;
  const src = previewLayoutTarget(type, comp, slide);
  // 寫回目前格式的那一份，不是永遠寫回圖層——調 270° 的位置不該把 16:9 的改掉
  const slot = layoutSlot(layer, activeFormatId());
  LAYOUT_KEYS[type].forEach(k => { slot[k] = src[k]; });
  clearTimeout(layoutSaveTimer);
  layoutSaveTimer = setTimeout(() => saveScenarioOverride(currentScenario), 400);
}

// 素材沒寫 segment 就是第 1 段；判斷在資料層，這裡只是轉呼叫
const segmentOf = asset => Scenarios.segmentOf(asset);

// 這個突發狀況在目前條件下被拆成哪幾段
function complicationSegments(comp, env, med) {
  return Scenarios.complicationSegments(DATA.assets, comp, env, med);
}

// ---------- 把關 ----------
// 選得到卻演不出來是最傷的一種挫折：使用者以為自己設定好了，實際上按下去什麼都沒有。
// 5 環境 × 6 事件 × 6 突發狀況 = 180 種勾選，實際上只有 46 種會出現東西。
// 所以「有沒有素材」必須在選之前就看得見，而不是產生之後才發現。
let availabilityCache = { key: null, comps: null, base: null };

function availabilityFor(env, med) {
  const key = `${env}|${med}`;
  if (availabilityCache.key !== key) {
    availabilityCache = {
      key,
      comps: Scenarios.availableComplications(DATA.assets, DATA.options, env, med),
      base: Scenarios.baseCoverage(DATA.assets, env, med),
    };
  }
  return availabilityCache;
}

// 環境×急救事件的唯一真相是「目前載入的情境」。舊入口那兩個選單是同一份資料的
// 第二份副本——載入情境時被寫進去、產生素材時又被讀回來——選單一刪就整條斷掉。
const currentEnv = () => currentScenario && currentScenario.environment;
const currentMed = () => currentScenario && currentScenario.medicalEvent;

// 上次抽素材時用的突發狀況集合。編輯是就地改同一個情境物件，所以「有沒有變」
// 必須跟一份留存的舊值比，不能拿物件跟自己比。
const complicationsKey = scenario =>
  (scenario ? Scenarios.complicationsOf(scenario) : []).slice().sort().join('|');
let lastPickedComps = null;

function complicationUsable(comp, env = currentEnv(), med = currentMed()) {
  const found = availabilityFor(env, med).comps.find(c => c.comp === comp);
  return !!found && found.ok;
}

// 新增動作時要預設一個「真的能演」的狀況；沒有任何可用的就回傳第一個，
// 讓它顯示成「此情境無素材」而不是靜靜地存進一個壞動作
function firstUsableComplication() {
  const ok = availabilityFor(currentEnv(), currentMed()).comps.find(c => c.ok);
  return ok ? ok.comp : optionsFor('complication')[0];
}

// 情境用到的狀況在它自己的環境×事件下有沒有素材（匯入別人的情境時特別重要）
function scenarioBrokenComplications(scenario) {
  return Scenarios.complicationsOf(scenario)
    .filter(c => !complicationUsable(c, scenario.environment, scenario.medicalEvent));
}

const ROLE_LABEL = {
  environment_video: '環境影像', ambient_sound: '環境聲音',
  patient_photo: '病患照片', patient_voice: '病患聲音',
};

// 「刻意留白」（type: none）不算缺，那是資料作者的決定，不是漏洞
function missingBaseLabels(env, med) {
  const base = availabilityFor(env, med).base;
  return Scenarios.BASE_ROLES.filter(r => base[r] === 'missing').map(r => ROLE_LABEL[r]);
}

const $ = id => document.getElementById(id);
const status = $('status');

function setStatus(msg, isError) {
  status.textContent = msg;
  status.classList.toggle('error', !!isError);
}

// index.html 會用到的資料層 API。少一個就代表 js/scenarios.js 是舊版——
// 通常是瀏覽器拿了快取：YAML 用 no-cache 每次都新的，<script src> 卻可能不問就用舊的，
// 於是新資料配舊程式，錯誤訊息還會指向完全無關的地方。
const REQUIRED_SCENARIO_API = [
  'normalizeScenarios', 'mergeScenarios', 'forExport', 'complicationsOf', 'playableSlides',
  'exportScenarioYaml', 'parseImport', 'contributionUrl',
  'scenarioIdProblem', 'copyScenarioId', 'scenarioPath',
  'projectionFormats', 'baseFormatId', 'formatForAspect', 'layoutFor', 'hasLayoutFor',
  'segmentOf', 'complicationSegments', 'eligibleAssets',
  'availableComplications', 'baseCoverage',
];

// 常數也要檢查。只檢查函式的話，少一個常數會在很深的地方炸成
// 「Cannot read properties of undefined」，完全看不出是快取問題——實際踩過。
const REQUIRED_SCENARIO_DATA = ['LAYER_TYPES', 'LAYER_DEFAULTS', 'LAYER_RANGES', 'ALWAYS_ON_LAYERS'];

function checkScenarioApi() {
  if (typeof Scenarios === 'undefined') {
    return 'js/scenarios.js 未載入（確認檔案存在，且是用本地伺服器開啟）';
  }
  const missing = REQUIRED_SCENARIO_API.filter(name => typeof Scenarios[name] !== 'function')
    .concat(REQUIRED_SCENARIO_DATA.filter(name => Scenarios[name] === undefined));
  if (missing.length) {
    return `js/scenarios.js 是舊版，缺少 ${missing.join('、')}。`
      + '請強制重新整理清掉快取（Mac：⌘+Shift+R，Windows：Ctrl+F5）';
  }
  return null;
}

// 情境住在 scenarios/，一個檔一個情境。但**純靜態網站沒辦法問伺服器「這個資料夾裡有什麼」**
// ——HTTP 根本沒有這個動詞——所以只能先讀 scenarios/index.yaml 這張檔名清單，再照著一個一個抓。
//
// 那張清單是資料夾的副本，不是真相，由 tools/build-scenarios-index.js 掃資料夾產生
// （GitHub 上由 .github/workflows/scenarios-index.yml 在 push 到 main 後自動重產）。
//
// 不要改成「去讀伺服器自動生的目錄列表」：python3 -m http.server 會生一頁，
// GitHub Pages 不會（沒有 index.html 的資料夾直接 404）。那種寫法本機測起來全綠，一上線全掛。
async function fetchYaml(url) {
  // no-cache：改完 YAML 重新整理就要看到新資料，不能讀到瀏覽器快取的舊版
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return jsyaml.load(await res.text());
}

async function loadScenarioFiles() {
  let index;
  try {
    index = await fetchYaml('scenarios/index.yaml');
  } catch (err) {
    // 清單讀不到就是沒有內建情境，但自訂情境（localStorage）仍該照常出現
    console.warn('讀不到 scenarios/index.yaml，這次沒有內建情境：' + err.message);
    return [];
  }
  const files = Array.isArray(index && index.files) ? index.files : [];
  const loaded = await Promise.all(files.map(async name => {
    try {
      return await fetchYaml('scenarios/' + name);
    } catch (err) {
      // 一個檔壞掉不該讓整份清單消失。會走到這裡多半是 index 列了已經被刪掉的檔
      console.warn(`情境檔 scenarios/${name} 讀取失敗，已跳過：${err.message}`);
      return null;
    }
  }));
  return loaded.filter(Boolean);
}

async function init() {
  // 讀檔與後續處理分開接錯：只有真的抓不到檔才該建議「用本地伺服器開啟」。
  // 混在一起的話，任何錯誤都會被說成伺服器問題，把人指向錯的方向。
  let text;
  try {
    const res = await fetch('scenario-data.yaml', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (err) {
    setStatus('讀取 scenario-data.yaml 失敗：' + err.message
      + '（請用本地伺服器開啟，例如 python3 -m http.server 8000）', true);
    return;
  }

  try {
    if (typeof jsyaml === 'undefined') throw new Error('js-yaml 未載入');
    const apiProblem = checkScenarioApi();
    if (apiProblem) throw new Error(apiProblem);
    DATA = jsyaml.load(text);
    if (!DATA || !Array.isArray(DATA.assets)) throw new Error('scenario-data.yaml 缺少 assets 陣列');
    DATA.scenarios = await loadScenarioFiles();
    buildScenarios();
    syncScenarioActive();
    renderFlow();   // 先把版面收成「未選情境」的樣子
    setStatus(`素材庫已載入：${DATA.assets.length} 筆，情境 ${DATA.scenarios.length} 組`);
  } catch (err) {
    setStatus('初始化失敗：' + err.message, true);
  }
}

function optionsFor(dim) {
  const declared = DATA.options && DATA.options[dim];
  if (Array.isArray(declared) && declared.length) return declared;
  // options 沒寫時，從素材標籤自動蒐集
  const seen = new Set();
  DATA.assets.forEach(a => (a.tags?.[dim] || []).forEach(v => seen.add(v)));
  return [...seen];
}

// environment 可在 YAML 依室內／室外分組；舊版平鋪陣列和未宣告 options 的資料也可繼續使用。
function environmentGroups() {
  const declared = DATA.options && DATA.options.environment;
  if (declared && !Array.isArray(declared) && typeof declared === 'object') {
    const groups = Object.entries(declared)
      .filter(([, values]) => Array.isArray(values) && values.length);
    if (groups.length) return groups;
  }
  return [['未分類', optionsFor('environment')]];
}


// ---------- 情境（scenario）----------
// 一個情境 = 素材組合（環境×急救事件）＋ 一串照順序演的簡報頁。
// 資料層在 js/scenarios.js，是不碰 DOM 的純函式，由 test/scenarios.test.js 釘住（node --test）。
// 這裡只負責「把資料接到畫面上」，判斷邏輯一律不要寫在這一層，否則測不到。

const SCENARIO_STORE_KEY = 'ems-scene-player:scenarios';

// buildScenarios 時算一次就存起來：正規化會印 console 警告，
// 若每次選單變動都重算，同一則警告會被洗版式地重複印出。
let activeScenarios = [];

// 自訂情境存 localStorage，用 JSON——只存字串、往返精確、沒有人會手讀這一份。
// （匯出給人看的檔案才用 YAML，那是另一條路，見 js/scenarios.js 的 exportScenarioYaml。）
function readCustomScenarios() {
  try {
    const raw = localStorage.getItem(SCENARIO_STORE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    // 壞掉的工作副本不該讓整個站台開不起來，回到純內建即可
    console.warn('自訂情境讀取失敗，改用內建情境：' + err.message);
    return [];
  }
}

function writeCustomScenarios(scenarios) {
  try {
    localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(Scenarios.forExport(scenarios)));
    return true;
  } catch (err) {
    setStatus('自訂情境儲存失敗：' + err.message, true);
    return false;
  }
}

function buildScenarios() {
  const box = $('presets');
  const list = $('preset-list');
  list.innerHTML = '';
  activeScenarios = [];

  if (DATA) {
    const builtin = Scenarios.normalizeScenarios(DATA.scenarios, DATA.options);
    const custom = Scenarios.normalizeScenarios(readCustomScenarios(), DATA.options);
    [...builtin.warnings, ...custom.warnings].forEach(w => console.warn(w));
    activeScenarios = Scenarios.mergeScenarios(builtin.scenarios, custom.scenarios);
  }

  // 沒宣告 scenarios 就整塊收起來，舊的 scenario-data.yaml 不會多出空欄位
  box.hidden = !activeScenarios.length;
  if (!activeScenarios.length) return;

  activeScenarios.forEach(scenario => {
    const comps = Scenarios.complicationsOf(scenario);
    const pages = Scenarios.playableSlides(scenario).length;
    const broken = scenarioBrokenComplications(scenario);
    const btn = Object.assign(document.createElement('button'), {
      type: 'button',
      textContent: scenario.name + (broken.length ? ' ⚠' : ''),
      title: [
        `${scenario.environment}／${scenario.medicalEvent}`,
        comps.length ? `突發狀況：${comps.join('、')}` : '不含突發狀況',
        `${pages} 頁流程`,
        broken.length ? `⚠ 這些狀況在此情境下沒有素材：${broken.join('、')}` : '',
        scenario.note || '',
      ].filter(Boolean).join('\n'),
    });
    if (broken.length) btn.classList.add('broken');
    btn.dataset.scenarioId = scenario.id;
    if (scenario.source !== 'builtin') btn.classList.add('custom');
    btn.addEventListener('click', () => loadScenario(scenario));
    list.appendChild(btn);
  });
  list.appendChild(buildScenarioTools(document));
}

function loadScenario(scenario) {
  // 每次都拿最新的那一份（可能剛被覆蓋過），不要抱著按鈕建立時的舊物件
  currentScenario = activeScenarios.find(s => s.id === scenario.id) || scenario;
  syncScenarioActive();
  pickAssets();               // 素材要先挑好，segmentPlayers 才有東西可登記
  buildFlowSteps();
  flowIndex = 0;          // 直接停在第一頁，右欄一出現就有畫面可看
  panelLevel = 'browse';
  browseAutoStopped = false;
  renderFlow();
  runStep(flowSteps[0]);
}

// 回到「沒有載入任何情境」的狀態。刪掉目前這一組、或匯入把它換掉時會走到——
// 流程必須跟著失效，否則它會指向已經不存在的素材。
function leaveScenario() {
  if (!currentScenario) return;
  currentScenario = null;
  flowSteps = [];
  flowIndex = -1;
  panelLevel = 'browse';
  syncScenarioActive();
  renderFlow();
}

// 清單上亮起來的那一顆＝目前載入的情境。舊版是反推的（比對環境×事件×突發狀況
// 集合），因為當時可以手動改選單、進到一個不屬於任何情境的狀態；現在沒有那條路了。
function syncScenarioActive() {
  if (!DATA) return;
  [...$('preset-list').children].forEach((btn, i) => {
    const scenario = activeScenarios[i];
    btn.classList.toggle('active', !!scenario && !!currentScenario && scenario.id === currentScenario.id);
  });
}

// ---------- 流程引擎 ----------

// **一頁＝一步。** 舊模型要在這裡把多片段的突發狀況展開成多步；圖層模型下那個展開
// 已經發生在資料層（migrateScenario），每一段都是真正的一頁，所以這裡只剩「會播的頁」。
let flowSteps = [];

function buildFlowSteps() {
  flowSteps = currentScenario ? Scenarios.playableSlides(currentScenario) : [];
}

// 這一頁畫面上有什麼——講給教官聽的一句話
// withNote=false 給編輯畫面用：那裡提詞就在正下方有自己的欄位，
// 再印一次只是同一句話出現兩遍。
function stepLabel(slide, withNote = true) {
  if (!slide) return '';
  const green = Scenarios.layerOf(slide, 'greenscreen');
  const text = Scenarios.layerOf(slide, 'text');
  const parts = [];
  if (green) parts.push(green.complication + (green.segment ? `　片段 ${green.segment}` : ''));
  if (text) parts.push(`字幕：${text.text}`);
  if (withNote && slide.note) parts.push(slide.note);
  return parts.join('　·　') || '只有場景';
}

function runStep(slide) {
  if (!slide) return;
  // 版面存在這一頁的圖層上，換頁就要換一組——這是圖層模型取代舊 localStorage 的地方
  loadLayoutFromSlide(slide);
  renderProjectionPatient();
  const green = Scenarios.layerOf(slide, 'greenscreen');
  if (!green) {
    // 沒有綠幕圖層的頁不該讓上一頁的人物還站在畫面上
    stopSegmentMedia();
    stopComplicationProjection();
    renderProjectionText(slide);
    return;
  }
  // segment 省略＝第一段（與資料層的規則一致）
  const segment = green.segment || complicationSegments(green.complication,
    currentEnv(), currentMed())[0];
  const play = segmentPlayers.get(segmentKey(green.complication, segment));
  if (play) { play(); renderProjectionText(slide); return; }
  // 素材缺了不能靜靜跳過——教官會以為自己按錯
  stopSegmentMedia();
  stopComplicationProjection();
  // 說明文字仍要換成這一頁的：素材缺席不代表上一頁的字該繼續投在學員面前
  renderProjectionText(slide);
  setStatus(`這一頁的素材不存在：${green.complication}${green.segment ? ` 片段 ${green.segment}` : ''}`, true);
}

// text 圖層＝投影給學員看的字。與 slide.note（給教官的提詞）是兩件事，
// 混掉的後果是把提詞投到大螢幕上，所以這裡只讀 text 圖層。
function renderProjectionText(slide) {
  const doc = projectionDocument();
  if (!doc) return;
  const box = doc.getElementById('projection-text');
  const layer = slide && Scenarios.layerOf(slide, 'text');
  if (!Scenarios.layerVisible(layer)) { box.style.display = 'none'; box.textContent = ''; return; }
  box.textContent = layer.text;
  box.style.display = 'block';
  // 投影的舞台就是視窗，所以單位是 vw；預覽用 cqw。座標公式只有這一份。
  Object.assign(box.style,
    Scenarios.textBoxStyle(Scenarios.layoutFor(layer, activeFormatId()), 'vw'));
}

function gotoFlow(index) {
  if (!flowSteps.length) return;
  flowIndex = Math.max(0, Math.min(index, flowSteps.length - 1));
  // 編輯時「展開的頁」與「目前的頁」必須是同一頁：預覽畫的是展開的那一頁，
  // 而方向鍵動的是目前這一頁，不同步的話換頁後預覽不會動。
  if (panelLevel === 'edit') editingSlideId = flowSteps[flowIndex].id;
  runStep(flowSteps[flowIndex]);
  renderFlow();
}

function nextFlow() {
  if (!flowSteps.length) return;
  if (flowIndex >= flowSteps.length - 1) return;   // 最後一步就停在那，不繞回開頭
  gotoFlow(flowIndex + 1);
}

function prevFlow() {
  if (!flowSteps.length || flowIndex <= 0) return;
  gotoFlow(flowIndex - 1);
}

function stopFlow() {
  flowIndex = -1;
  stopAll();
  renderFlow();
}

// 任何一種編輯之後都要做的事，集中在這裡——散在各個操作裡遲早會有人漏掉一步
function persistScenarioEdit() {
  if (!currentScenario) return;
  const beforeStep = flowIndex >= 0 ? flowSteps[flowIndex] : null;

  saveScenarioOverride(currentScenario);

  // 突發狀況的集合變了才重新挑素材：pickAssets() 會重抽，編輯中每動一下就重抽很擾人。
  // 比對對象是「上次抽素材時的集合」而不是 currentScenario 的前後值——編輯是就地
  // 修改同一個物件，等這裡執行時它早就變了，自己跟自己比永遠相等。
  if (complicationsKey(currentScenario) !== lastPickedComps) pickAssets();

  buildFlowSteps();
  // 頁數可能變了，目前這一步未必還存在，收斂回合理範圍
  const i = beforeStep ? flowSteps.findIndex(s => s.id === beforeStep.id) : -1;
  flowIndex = i >= 0 ? i : (flowSteps.length ? Math.min(flowIndex, flowSteps.length - 1) : -1);
  renderFlow();
}

// 切換某頁的啟用：這是「現場臨時抽掉一個橋段」，所以要立刻反映在流程與儲存上
function toggleSlideEnabled(slideId) {
  if (!currentScenario) return;
  const slide = currentScenario.slides.find(s => s.id === slideId);
  if (!slide) return;
  slide.enabled = slide.enabled === false;
  persistScenarioEdit();
}

// ---------- 編輯：頁 ----------

function nextSlideId(scenario) {
  let n = scenario.slides.length + 1;
  while (scenario.slides.some(s => s.id === `s${n}`)) n++;
  return `s${n}`;
}

function addSlide() {
  if (!currentScenario) return;
  const slide = {
    id: nextSlideId(currentScenario),
    title: `第 ${currentScenario.slides.length + 1} 頁`,
    enabled: true,
    // 新頁先給場景＋病患：沒有圖層的頁在資料層會被丟掉，等於按了沒反應
    layers: [newLayer('scene'), newLayer('patient')],
  };
  currentScenario.slides.push(slide);
  editingSlideId = slide.id;
  persistScenarioEdit();
}

function duplicateSlide(slideId) {
  if (!currentScenario) return;
  const i = currentScenario.slides.findIndex(s => s.id === slideId);
  if (i < 0) return;
  const copy = JSON.parse(JSON.stringify(currentScenario.slides[i]));
  copy.id = nextSlideId(currentScenario);
  copy.title += '（複製）';
  currentScenario.slides.splice(i + 1, 0, copy);
  persistScenarioEdit();
}

function deleteSlide(slideId) {
  if (!currentScenario) return;
  if (currentScenario.slides.length <= 1) {
    setStatus('至少要留一頁——沒有任何頁的情境會被資料層整筆跳過。', true);
    return;
  }
  currentScenario.slides = currentScenario.slides.filter(s => s.id !== slideId);
  if (editingSlideId === slideId) editingSlideId = null;
  persistScenarioEdit();
}

function moveSlide(slideId, toIndex) {
  if (!currentScenario) return;
  const from = currentScenario.slides.findIndex(s => s.id === slideId);
  if (from < 0) return;
  const to = Math.max(0, Math.min(toIndex, currentScenario.slides.length - 1));
  if (from === to) return;
  const [slide] = currentScenario.slides.splice(from, 1);
  currentScenario.slides.splice(to, 0, slide);
  persistScenarioEdit();
}

// ---------- 編輯：圖層 ----------

function editingSlide() {
  return currentScenario && currentScenario.slides.find(s => s.id === editingSlideId);
}

// 圖層上下順序由型別決定（投影視窗的 z-index 是寫死的），所以新增後一律重排，
// 不提供拖曳把手——做一個拖了卻沒效果的介面比不做更糟。
function sortLayers(slide) {
  slide.layers.sort((a, b) =>
    Scenarios.LAYER_TYPES.indexOf(a.type) - Scenarios.LAYER_TYPES.indexOf(b.type));
}

function newLayer(type) {
  const layer = { type, ...Scenarios.LAYER_DEFAULTS[type] };
  // 病患站的位置由情境決定：新的一頁應該直接站在對的地方，而不是回到全域預設再拖一次
  if (type === 'patient' && currentScenario && currentScenario.patientHome) {
    const home = currentScenario.patientHome;
    Object.keys(Scenarios.LAYER_DEFAULTS.patient).forEach(k => {
      if (home[k] !== undefined) layer[k] = home[k];
    });
    // 覆寫一起帶走，新的一頁在**每一種格式**都站在對的地方，不只基準那個
    if (home.layouts && Object.keys(home.layouts).length) {
      layer.layouts = Object.fromEntries(
        Object.entries(home.layouts).map(([id, v]) => [id, { ...v }]));
    }
  }
  if (type === 'greenscreen') layer.complication = firstUsableComplication();
  if (type === 'text') layer.text = '說明文字';
  return layer;
}

// 「歸位」對病患而言是回到**這個情境**的預設位置，不是全域預設——
// 全域預設只是還沒有人設定過時的起點。
function homeLayoutFor(type) {
  // **要取目前格式的那一份。** 只取基準的話，在 270° 下按「歸位」會跳到 16:9 的
  // 預設位置——在超寬螢幕上是錯的，而且會順手替 270° 建一筆不必要的覆寫。
  if (type === 'patient' && currentScenario) {
    return Scenarios.patientHomeFor(currentScenario, activeFormatId());
  }
  return Scenarios.LAYER_DEFAULTS[type];
}

// 把目前這一頁的病患位置，收成整個情境的預設。之後新增的頁都從這裡開始。
// 這一頁的病患有沒有偏離預設（比的是**目前格式**生效的那兩份值）
function patientMovedFromHome(layer) {
  if (!layer || !currentScenario) return false;
  const slide = editingSlide() || currentSlide();
  const now = patientLayoutOf(slide, activeFormatId()) || Scenarios.layoutFor(layer, activeFormatId());
  const home = Scenarios.patientHomeFor(currentScenario, activeFormatId());
  return Object.keys(Scenarios.LAYER_DEFAULTS.patient).some(k => now[k] !== home[k]);
}

// 「設為預設」已經移除：預設位置在「情境設定」展開時的畫布上直接拖就好。
// 留著它等於**同一件事有兩個入口**，而其中一個還是「在某一頁按一顆按鈕改全域值」——
// 那正是當初讓 patientHome 變成隱形值的原因。
function addLayer(type) {
  const slide = editingSlide();
  if (!slide) return;
  if (Scenarios.layerOf(slide, type)) {
    setStatus(`這一頁已經有一個 ${type} 圖層——每種型別一頁只能有一個。`, true);
    return;
  }
  slide.layers.push(newLayer(type));
  sortLayers(slide);
  persistScenarioEdit();
}

function removeLayer(type) {
  const slide = editingSlide();
  if (!slide) return;
  if (slide.layers.length <= 1) {
    setStatus('每頁至少要留一個圖層——沒有圖層的頁會被資料層丟掉。', true);
    return;
  }
  slide.layers = slide.layers.filter(l => l.type !== type);
  persistScenarioEdit();
}

// 病患通常不會動，拖歪了要能一鍵回到預設——位置存在圖層上，所以改的是同一份資料
function resetLayerLayout(type, comp) {
  const defaults = homeLayoutFor(type);
  if (!defaults) return;
  const live = type === 'patient' ? patientOverlay : (comp ? complicationOverlay(comp) : null);
  if (live) Object.assign(live, defaults);
  if (type === 'patient') applyPatientOverlayLayout();
  else { applyComplicationOverlayLayout(); if (chromaRedraw && !chromaFrame) chromaRedraw(); }
  const slide = editingSlide();
  const layer = slide && Scenarios.layerOf(slide, type);
  if (layer) {
    const fmt = activeFormatId();
    if (fmt === Scenarios.baseFormatId(DATA.options)) {
      // 基準格式的值就寫在圖層自己身上
      Object.assign(layer, defaults);
    } else if (layer.layouts) {
      // 其他格式：**把覆寫刪掉**，回到「這一頁還沒替這個格式調過」的狀態，
      // 而不是把預設值抄一份進去。抄一份的話它會變成一筆「調過、剛好等於預設」的
      // 資料，之後改預設時這一頁不會跟著動。
      delete layer.layouts[fmt];
      if (!Object.keys(layer.layouts).length) delete layer.layouts;
    }
  }
  persistScenarioEdit();
}

function updateLayer(type, patch) {
  const slide = editingSlide();
  const layer = slide && Scenarios.layerOf(slide, type);
  if (!layer) return;
  Object.assign(layer, patch);
  // 空字串代表「回到 auto／不指定」，留著會被資料層當成真的值
  for (const key of ['segment', 'asset']) {
    if (layer[key] === '') delete layer[key];
  }
  persistScenarioEdit();
}

// ---------- 編輯：情境 ----------

function nextScenarioId() {
  let n = 1;
  while (activeScenarios.some(s => s.id === `custom-${n}`)) n++;
  return `custom-${n}`;
}

function newScenario() {
  const scenario = {
    id: nextScenarioId(),
    name: '新情境',
    // 只是個起點：環境×急救事件在編輯畫面選，所以這裡填什麼都會被馬上看見並改掉
    environment: currentEnv() || environmentGroups().flatMap(([, v]) => v)[0],
    medicalEvent: currentMed() || optionsFor('medicalEvent')[0],
    slides: [{ id: 's1', title: '抵達現場', enabled: true, layers: [newLayer('scene'), newLayer('patient')] }],
  };
  saveScenarioOverride(scenario);
  loadScenario(activeScenarios.find(s => s.id === scenario.id) || scenario);
  // 直接進編輯畫面：新情境的第一件事一定是挑環境×急救事件，停在瀏覽模式等於要人多按一次
  panelLevel = 'edit';
  // 新情境的第一件事就是挑環境×急救事件，所以直接把設定攤開
  settingsExpanded = true;
  editingSlideId = null;
  renderFlow();
  setStatus('新情境已建立——先選「環境」與「急救事件」，素材會跟著換。');
}

// 複製的 id 從原本那個長出來（home-ohca → home-ohca-copy），不回到 custom-N：
// 一眼看得出是從哪一個複製的，之後送 PR 時 review 的人也看得懂。
function duplicateScenario(scenario) {
  const copy = JSON.parse(JSON.stringify(Scenarios.forExport([scenario])[0]));
  copy.id = Scenarios.copyScenarioId(scenario.id, activeScenarios.map(s => s.id));
  copy.name = scenario.name + '（複製）';
  saveScenarioOverride(copy);
  loadScenario(activeScenarios.find(s => s.id === copy.id) || copy);
  // 複製完的下一件事一定是改名與改 id，所以直接停在攤開的情境設定上
  panelLevel = 'edit';
  settingsExpanded = true;
  editingSlideId = null;
  renderFlow();
  setStatus(`已複製成「${copy.name}」（id：${copy.id}）——改個 id 與名字再開始編輯。`);
}

// 改 id ＝ **宣告「這是一個新情境」**，不是改個標籤。
//
// localStorage 靠 id 比對「自訂覆蓋內建」，所以換掉 id 之後：
//   ① 本機那筆資料要跟著搬過去，不搬就變成孤兒，永遠躺在 localStorage 裡沒人看得到
//   ② 舊 id 底下如果壓著一個內建情境，**那個內建情境會回到清單上**——它一直都在，
//      只是被蓋住了。這是刻意的行為，但一定要講出來，否則使用者會以為自己多做了一個
//
// 這個動作同時就是「送修正 PR 還是新增 PR」的宣告（COO-102）：不改 id ＝ 我在修那個檔，
// 改了 id ＝ 這是新東西。用「要不要換名字」去問一件教官答得出來的事，
// 比另外做一個「這是修正還是新增」的開關好——那個開關他答不出來。
function changeScenarioId(nextId) {
  if (!currentScenario) return;
  const from = currentScenario.id;
  const to = String(nextId == null ? '' : nextId).trim();
  if (to === from) return;

  const taken = activeScenarios.filter(s => s.id !== from).map(s => s.id);
  const problem = Scenarios.scenarioIdProblem(to, taken);
  if (problem) {
    setStatus(problem, true);
    renderFlow();          // 把輸入框的值退回原本的 id，不要留著一個沒有生效的字串
    return;
  }

  const custom = readCustomScenarios().filter(s => s.id !== from);
  currentScenario.id = to;
  custom.push(Scenarios.forExport([currentScenario])[0]);
  writeCustomScenarios(Scenarios.normalizeScenarios(custom, DATA.options).scenarios);
  buildScenarios();

  currentScenario = activeScenarios.find(s => s.id === to) || currentScenario;
  syncScenarioActive();
  renderFlow();

  // 重建之後舊 id 還在清單上，代表底下本來就壓著一個內建情境，現在它冒回來了
  const revealed = activeScenarios.find(s => s.id === from);
  setStatus(revealed
    ? `id 已改成「${to}」，匯出與送 PR 的檔名都會是 ${to}.yaml。`
      + `原本的「${revealed.name}」是內建情境，已經回到清單上。`
    : `id 已改成「${to}」，匯出與送 PR 的檔名都會是 ${to}.yaml。`);
}

// 刪自訂＝真的消失；刪「覆蓋內建的那份」＝還原成內建，不是刪掉內建
function deleteScenario(scenario) {
  writeCustomScenarios(
    Scenarios.normalizeScenarios(
      readCustomScenarios().filter(s => s.id !== scenario.id), DATA.options).scenarios);
  buildScenarios();
  if (currentScenario && currentScenario.id === scenario.id) {
    const still = activeScenarios.find(s => s.id === scenario.id);
    if (still) loadScenario(still); else leaveScenario();
  } else {
    renderFlow();
  }
}

function renameScenario(name) {
  if (!currentScenario) return;
  currentScenario.name = name;
  persistScenarioEdit();
}

// **換環境或急救事件＝整組素材換掉**，不是改一個標籤。所以這裡不能只存起來就算了：
// 素材要重挑，而且原本的綠幕人物可能在新組合下根本沒有素材——那幾頁會安靜地變成
// 只有場景。用匯入情境時的同一套檢查把話講明白，別讓人自己發現。
function changeScenarioCondition(patch) {
  if (!currentScenario) return;
  Object.assign(currentScenario, patch);
  saveScenarioOverride(currentScenario);   // 內含 buildScenarios()，清單的 ⚠ 會跟著更新
  pickAssets();                            // 不重挑的話畫面上還是舊組合的照片
  syncScenarioActive();
  buildFlowSteps();
  renderFlow();
  runStep(flowSteps[flowIndex] || flowSteps[0]);

  const where = `${currentScenario.environment}／${currentScenario.medicalEvent}`;
  // 兩種缺口要分開講：突發狀況缺 = 那幾頁沒有人物；基本角色缺 = 整場都沒有那樣東西。
  // 只報前者的話，「工地×OHCA 沒有病患照片」這種會靜靜地發生（30 格裡只有 8 格有照片）。
  const broken = scenarioBrokenComplications(currentScenario);
  const missing = missingBaseLabels(currentScenario.environment, currentScenario.medicalEvent);
  const warnings = [
    missing.length ? `這個組合缺少：${missing.join('、')}` : '',
    broken.length ? `這些突發狀況沒有素材，那幾頁不會有人物出現：${broken.join('、')}` : '',
  ].filter(Boolean);
  setStatus(warnings.length
    ? `已改為「${where}」。⚠ ${warnings.join('；')}`
    : `已改為「${where}」，素材齊全。`, warnings.length > 0);
}

// 情境層欄位：整個情境共用，不是某一頁的。舊入口那兩個選單被刪掉之後，
// 這裡是**唯一**能設定環境×急救事件的地方——沒有它就只能改 YAML 再匯入。
// 情境設定：頁清單最上面那一列，沿用同一套手風琴（只展開一個）。
// **刻意不長得像一頁**——沒有編號、沒有啟用勾選、沒有眼睛、不能拖也不能刪，
// 圖示用齒輪。它享受手風琴的一致性，但不該被誤認成第 0 張投影片。
function buildScenarioSettingsRow(doc) {
  const item = doc.createElement('div');
  item.className = 'flow-item settings-item' + (settingsExpanded ? ' expanded' : '');

  const row = doc.createElement('div');
  // 展開時借用跟「目前這一頁」同一套 current 樣式：選中就是選中，
  // 不必為情境設定另外發明一種外觀
  row.className = 'flow-row settings-row clickable' + (settingsExpanded ? ' current' : '');
  const gear = doc.createElement('span');
  gear.className = 'settings-gear';
  gear.textContent = '⚙';
  gear.setAttribute('aria-hidden', 'true');
  const name = doc.createElement('span');
  name.className = 'flow-row-title';
  name.textContent = '情境設定';
  const meta = doc.createElement('span');
  meta.className = 'flow-row-meta';
  meta.textContent = `${currentScenario.environment}／${currentScenario.medicalEvent}`;
  row.append(gear, name, meta);
  row.addEventListener('click', () => {
    settingsExpanded = !settingsExpanded;
    if (settingsExpanded) editingSlideId = null;   // 一次只展開一個
    renderFlow();
  });
  item.appendChild(row);

  if (settingsExpanded) {
    const body = doc.createElement('div');
    body.className = 'flow-body';
    const inner = doc.createElement('div');
    inner.className = 'flow-body-inner';

    const envSel = doc.createElement('select');
    // 沿用室內／室外分組，不要退回平鋪——環境多了才找得到
    for (const [group, values] of environmentGroups()) {
      const g = Object.assign(doc.createElement('optgroup'), { label: group });
      for (const v of values) g.appendChild(Object.assign(doc.createElement('option'), { value: v, textContent: v }));
      envSel.appendChild(g);
    }
    envSel.value = currentScenario.environment;
    envSel.addEventListener('change', () => changeScenarioCondition({ environment: envSel.value }));

    const medSel = doc.createElement('select');
    for (const v of optionsFor('medicalEvent')) {
      medSel.appendChild(Object.assign(doc.createElement('option'), { value: v, textContent: v }));
    }
    medSel.value = currentScenario.medicalEvent;
    medSel.addEventListener('change', () => changeScenarioCondition({ medicalEvent: medSel.value }));

    // id 排在最上面：它是這個情境的**身分**，不是設定。環境×急救事件回答「這是什麼情境」，
    // id 回答「這是哪一個情境」——後者管檔名、管覆蓋比對，順序上該先看到。
    const idInput = Object.assign(doc.createElement('input'), {
      type: 'text', value: currentScenario.id, spellcheck: false,
    });
    idInput.setAttribute('autocapitalize', 'off');
    // 用 change 而不是 input：邊打邊套用的話，打到一半的每一個字（h、ho、hom…）
    // 都會變成一次改名，localStorage 會被灌滿孤兒
    idInput.addEventListener('change', () => changeScenarioId(idInput.value));

    for (const [label, sel] of [['id', idInput], ['環境', envSel], ['急救事件', medSel]]) {
      const field = doc.createElement('label');
      field.className = 'edit-field';
      field.append(Object.assign(doc.createElement('span'), { textContent: label }), sel);
      inner.appendChild(field);
    }

    // 整個情境的操作住在這裡。**受詞不必寫出來**——在情境設定的面板裡，
    // 「匯出」不會被讀成匯出這一頁。原本它們排在「＋ 新增頁」旁邊，
    // 才需要靠「這個情境」四個字澄清自己在對誰動手。
    const actions = doc.createElement('div');
    actions.className = 'flow-actions settings-actions';
    actions.append(
      // 複製排第一：它是「以這個為起點做一個自己的」，教官最常做的事。
      // 內建情境刪不掉也改不動，複製是他唯一的入口
      flowButton(doc, '複製', () => duplicateScenario(currentScenario)),
      flowButton(doc, '匯出', exportCurrentScenario),
    );

    // 貢獻。把關在這裡跑而不是等他點下去——**不能用的東西該長得像不能用**，
    // 而不是點了以後被一句話拒絕。
    let note = null;
    const problem = contributionProblem(currentScenario);
    if (problem) {
      const blocked = flowButton(doc, '貢獻', () => {}, { disabled: true });
      blocked.title = `還不能貢獻：${problem}`;
      actions.appendChild(blocked);
    } else {
      // 成功時不留訊息：點連結會開一個新分頁，那個分頁自己就是回饋。
      // 再補一句「已開啟…」是在講使用者眼前正在發生的事
      const target = contributionTarget(currentScenario);
      const link = target.tooLong
        ? flowButton(doc, '貢獻', () => downloadForContribution(target))
        // 修正模式塞不進預填（GitHub 忽略 /edit/ 的 ?value=），所以點下去時
        // 把新內容送進剪貼簿，讓人到那一頁貼上
        : flowLink(doc, '貢獻', target.url,
            target.mode === 'edit' ? () => copyScenarioToClipboard(currentScenario) : null);
      // **網址要在按下去的前一刻重算。**
      // 它是 render 這一列時算好的，但情境之後還會被改——而拖曳人物位置只會在
      // 400ms 後存檔，**不重繪這一列**。結果就是：拖好位置、按貢獻，送出去的卻是
      // 「打開這個面板時」的那一份，位置全部不見，而且畫面上看不出哪裡不對。
      // 加一頁、改備註同理。重算一次很便宜，算錯的代價是一個看起來成功的錯 PR。
      if (!target.tooLong) {
        const refresh = () => {
          const now = contributionTarget(currentScenario);
          if (!now.tooLong) link.href = now.url;
        };
        link.addEventListener('pointerdown', refresh);
        link.addEventListener('click', refresh);   // 鍵盤 Enter 不會有 pointerdown
      }
      // 送出去會發生什麼，滑過去就知道——「修正」與「新增」是兩件很不一樣的事，
      // 但按鈕上寫不下，寫下去也會變成第二種說法
      link.title = target.mode === 'edit'
        ? `送出 ${Scenarios.scenarioPath(target.scenario.id)} 的修正`
        : `新增 ${Scenarios.scenarioPath(target.scenario.id)}`;
      actions.appendChild(link);
      // **這一行是流程的一部分，不是說明。** 沒有它，使用者會開到一個看起來
      // 沒變的檔案，完全不知道自己還有一步要做。
      // 放在按鈕列外面：塞進去會把後面的「刪除」擠到下一行
      if (target.mode === 'edit') {
        note = Object.assign(doc.createElement('p'), {
          className: 'settings-note settings-note-plain',
          textContent: '「貢獻」會複製這個情境的新內容並開啟 GitHub 的編輯頁——到那邊全選貼上再送出。',
        });
      }
    }
    // 內建情境來自 scenarios/，刪不掉也不該刪——這顆只給存在本機的自訂情境
    if (currentScenario.source !== 'builtin') {
      const del = flowButton(doc, '刪除', () => {
        if (confirm(`確定刪除情境「${currentScenario.name}」？這會從本機移除，無法復原。`)) {
          deleteScenario(currentScenario);
        }
      });
      del.className += ' danger';
      actions.appendChild(del);
    }
    inner.appendChild(actions);
    // 只在擋下來的時候出現：停用的按鈕說得出「不能」，說不出「為什麼不能」，
    // 而那個為什麼是他修得好的東西（多半是換個環境×急救事件就有素材了）
    if (problem) {
      inner.appendChild(Object.assign(doc.createElement('p'), {
        className: 'settings-note',
        textContent: `還不能貢獻：${problem}`,
      }));
    } else if (note) {
      inner.appendChild(note);
    }

    body.appendChild(inner);
    item.appendChild(body);
  }
  return item;
}

// ---------- 匯出／匯入 ----------

// 匯出的是**目前這一個情境**，不是全部。檔名就是 scenarios/ 裡該用的檔名，
// 所以下載下來的檔可以原樣丟進資料夾，不必再改名或剪貼。
function downloadScenario(scenario) {
  const text = Scenarios.exportScenarioYaml(scenario, jsyaml.dump);
  const blob = new Blob([text], { type: 'text/yaml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'),
    { href: url, download: `${scenario.id}.yaml` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportCurrentScenario() {
  if (!currentScenario) return;
  downloadScenario(currentScenario);
  setStatus(`已匯出情境「${currentScenario.name}」（${currentScenario.id}.yaml，可直接放進 scenarios/）`);
}

// ---------- 貢獻（送 PR）----------
// COO-86。網址與 id 的規則在 js/scenarios.js，這裡只負責把關與開分頁。

const CONTRIB_REPO = 'cooldongdong/ems-scene-player';
const CONTRIB_BRANCH = 'main';
// 網址長度的保險。實測 5 頁的情境約 2500 字元，離瀏覽器與 GitHub 的上限還很遠，
// 但頁數是線性長上去的，超過就退回「下載檔案」那條路——寧可多一步手動，
// 也不要送出一個被截斷的網址：那會生出一個看起來成功、內容卻少一半的 PR。
const CONTRIB_URL_LIMIT = 6000;

// 貢獻進來的情境**只是素材的引用**。用了這個環境×急救事件下不存在的素材，別人載入時
// 只會靜靜地少一段——沒有錯誤訊息、沒有紅字。所以擋在送出前，而不是等 review 才發現。
// 這個情境要送的是「新增一個檔」還是「改一個已經存在的檔」。
// **不必問使用者，資料裡就寫著**：
//   custom      他自己新開的（或改過 id 的）→ repo 裡沒有這個檔 → 新增
//   overridden  他改了一個內建情境          → repo 裡有那個檔   → 修正
//   builtin     他什麼都沒改                → 沒有東西好貢獻
function contributionMode(scenario) {
  return scenario.source === 'custom' ? 'new' : 'edit';
}

function contributionProblem(scenario) {
  // 沒改過的內建情境，送出去會是一個空的 diff
  if (scenario.source === 'builtin') {
    return '這個情境還沒有任何修改。改點什麼再貢獻，或用「複製」做一個自己的';
  }

  const broken = scenarioBrokenComplications(scenario);
  if (broken.length) {
    return `「${scenario.environment}／${scenario.medicalEvent}」下沒有這些突發狀況的素材：${broken.join('、')}`;
  }
  const missing = missingBaseLabels(scenario.environment, scenario.medicalEvent);
  if (missing.length) {
    return `「${scenario.environment}／${scenario.medicalEvent}」缺少素材：${missing.join('、')}`;
  }
  return null;
}

// 貢獻的目標檔與網址。在 render 時算好，所以「能不能貢獻」在畫面上就看得出來，
// 不必等他點下去才拒絕。
//
// **檔名就是這個情境的 id，不再另外生一個。** 曾經在這裡塞一個隨機的 contrib-日期-亂數，
// 理由是「本機 id 一律叫 custom-1，兩個人各自貢獻會撞」——但那是在 id 還改不動的時候。
// 現在 id 由人自己取、而且驗證會擋掉撞名，出口就不該再偷換一個他沒見過的名字：
// 編輯畫面寫著 street-trauma-copy，送出去卻叫 contrib-20260810-cjzr，那是兩個東西。
function contributionTarget(scenario) {
  const mode = contributionMode(scenario);
  const url = Scenarios.contributionUrl(scenario,
    { repo: CONTRIB_REPO, branch: CONTRIB_BRANCH, dump: jsyaml.dump, mode });
  return { scenario, url, mode, tooLong: url.length > CONTRIB_URL_LIMIT };
}

// 修正模式沒有預填（GitHub 忽略 /edit/ 的 ?value=，2026-08-10 實測），
// 所以在開啟編輯頁的同一下把新內容放進剪貼簿。**這不是貼心，是這條路能不能走的關鍵**：
// 沒有它，使用者會開到一個看起來完全沒變的檔案。
function copyScenarioToClipboard(scenario) {
  const text = Scenarios.exportScenarioYaml(scenario, jsyaml.dump);
  if (!navigator.clipboard) {
    // 複製不了就退回下載，至少內容拿得到——比開一個空手的編輯頁好
    downloadScenario(scenario);
    setStatus('這個瀏覽器不給複製到剪貼簿，已改成下載檔案——'
      + '到 GitHub 那一頁把檔案內容貼上去。', true);
    return;
  }
  navigator.clipboard.writeText(text).catch(err => {
    downloadScenario(scenario);
    setStatus('複製到剪貼簿失敗（' + err.message + '），已改成下載檔案。', true);
  });
}

// 網址塞不下時的退路：下載檔案，讓人自己放進 scenarios/。
// 寧可多一步手動，也不要送出一個被截斷的網址——那會生出一個看起來成功、
// 內容卻少一半的 PR。
function downloadForContribution(target) {
  downloadScenario(target.scenario);
  setStatus('這個情境太長，塞不進 GitHub 的預填網址，已改成下載檔案——'
    + `請把 ${target.scenario.id}.yaml 放進 repo 的 scenarios/ 資料夾。`, true);
}

function importScenarios(text) {
  const result = Scenarios.parseImport(text, DATA.options, jsyaml.load);
  result.warnings.forEach(w => console.warn(w));
  if (!result.ok) {
    setStatus('匯入失敗：' + result.warnings.join('；'), true);
    return;
  }
  if (!result.scenarios.length) {
    setStatus('匯入的檔案裡沒有任何有效情境。', true);
    return;
  }
  // 同 id 覆蓋，其餘保留——匯入是「加進來」，不是「取代全部」
  const kept = readCustomScenarios().filter(s => !result.scenarios.some(n => n.id === s.id));
  writeCustomScenarios(
    Scenarios.normalizeScenarios([...kept, ...Scenarios.forExport(result.scenarios)], DATA.options).scenarios);
  buildScenarios();
  leaveScenario();
  const skipped = result.warnings.length ? `，略過 ${result.warnings.length} 筆有問題的資料` : '';
  setStatus(`已匯入 ${result.scenarios.length} 個情境${skipped}`);
}

function pickImportFile() {
  const input = Object.assign(document.createElement('input'),
    { type: 'file', accept: '.yaml,.yml,.json,text/yaml,application/json' });
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    file.text().then(importScenarios).catch(err => setStatus('讀檔失敗：' + err.message, true));
  });
  input.click();
}

// 改過的情境（含內建）一律以自訂身分存進 localStorage，同 id 覆蓋內建
function saveScenarioOverride(scenario) {
  const custom = readCustomScenarios().filter(s => s.id !== scenario.id);
  custom.push(Scenarios.forExport([scenario])[0]);
  writeCustomScenarios(
    Scenarios.normalizeScenarios(custom, DATA.options).scenarios);
  buildScenarios();

  // **存完之後 source 就變了，但 currentScenario 不知道。**
  // buildScenarios() 重建的是 activeScenarios 裡的新物件，currentScenario 還抱著
  // 存檔前那一份——它的 source 永遠停在 'builtin'。於是「改了一個內建情境」之後，
  // 貢獻仍然以為沒有任何修改而停用，要離開編輯畫面再進來才會對。
  // 只同步 source 一個欄位，不整個換掉物件：flowSteps 抓著的是原本那些 slide 的參考，
  // 換物件會讓編輯中的那一頁跟畫面對不上。
  if (currentScenario && currentScenario.id === scenario.id) {
    const fresh = activeScenarios.find(s => s.id === scenario.id);
    if (fresh) currentScenario.source = fresh.source;
  }
}

function intersects(list, picks) {
  return (list || []).some(v => picks.includes(v));
}

// 篩選與特異性排序都在 js/scenarios.js（資料層），這裡只負責「從剩下的裡面抽一筆」。
// 分界的理由：篩選是判斷、要被測試釘住，而且要跟「這個選項能不能用」共用同一份實作；
// 隨機與「上次抽過什麼」是每次執行才有的狀態，測不了也不該測。
function pickForRole(role, env, med, comps, { patientPhoto = null, memoKey = role, segment = null } = {}) {
  const candidates = Scenarios.eligibleAssets(DATA.assets, role,
    { env, med, comps, patientPhoto, segment });
  if (!candidates.length) return null;

  // 同條件重新產生時盡量換一筆
  let picks = candidates;
  if (picks.length > 1 && lastPicked[memoKey]) {
    const others = picks.filter(a => a.id !== lastPicked[memoKey]);
    if (others.length) picks = others;
  }

  const chosen = picks[Math.floor(Math.random() * picks.length)];
  lastPicked[memoKey] = chosen.id;
  return {
    asset: chosen,
    hit: intersects(chosen.tags?.complication, comps),
    // 實際會被抽到的筆數（已排除輸掉特異性的通用素材），用來說明「為什麼重新產生沒變」
    poolSize: candidates.length,
  };
}

// file 可填單一檔名字串或多個檔名陣列；素材資料夾固定為 assets/<role>/。
// 仍接受舊版完整相對路徑，以及外部 URL，方便既有資料逐步遷移。
function assetFiles(asset) {
  const values = Array.isArray(asset.file) ? asset.file : [asset.file];
  return values
    .filter(file => typeof file === 'string')
    .map(file => file.trim())
    .filter(Boolean);
}

function assetPath(asset, file = assetFiles(asset)[0]) {
  if (typeof file !== 'string' || !file) return file;
  if (/^(?:[a-z][a-z0-9+.-]*:|\/|\.{1,2}\/)/i.test(file) || file.includes('/')) return file;
  return `assets/${asset.role}/${file}`;
}

function fallbackFiles(asset) {
  const files = Array.isArray(asset.fallback) ? asset.fallback : [asset.fallback];
  return files
    .filter(file => typeof file === 'string' && /\.(jpg|jpeg|png)$/i.test(file))
    .map(file => assetPath(asset, file));
}

// 副檔名優先於 YAML 的 type：真實素材常常換格式（例如綠幕從影片換成一張劇照），
// 這樣只要換檔案就能用，type 一時沒跟著改也不會讓整張卡壞掉。
function mediaKind(asset, file = assetPath(asset, assetFiles(asset)[0])) {
  if (asset.type === 'none') return 'none';
  if (typeof file === 'string') {
    if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(file)) return 'video';
    if (/\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(file)) return 'image';
    if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)$/i.test(file)) return 'audio';
  }
  return asset.type || 'audio';
}

// ---------- 音量 ----------
// **所有聲音都從 #media-pool 出來**（環境音、突發狀況的配音與影片原聲），所以
// 音量與靜音只要作用在那個容器上就涵蓋全部，不必逐一去找誰在響。
//
// 音量持存、靜音不持存：下次打開時「小聲」還原得回來是方便，「靜音」還原回來
// 卻是災難——教官在台上按了半天沒聲音，而畫面上唯一的線索是一顆小圖示。
// 寧可每次重開都會出聲。
const VOLUME_KEY = 'ems-scene-player:volume';
let masterVolume = (() => {
  // **不能直接 Number()**：沒存過時 getItem 回 null，而 Number(null) 是 0，
  // 0 又剛好落在 0–100 的合法範圍內——於是第一次打開就是靜音，
  // 而畫面上唯一的線索是一顆小圖示。這個坑實測踩過。
  const raw = localStorage.getItem(VOLUME_KEY);
  if (raw === null) return 100;
  const n = Number(raw);
  return Number.isFinite(n) && n >= 0 && n <= 100 ? n : 100;
})();
let audioMuted = false;

const SPEAKER_PATH = 'M4 9v6h3.2L12 19V5L7.2 9H4z';
function speakerIcon(level, muted) {
  const waves = muted ? '<path d="M16 9l5 6M21 9l-5 6"/>'
    : (level > 55 ? '<path d="M15.5 8.5a5 5 0 010 7"/><path d="M18 6a8.5 8.5 0 010 12"/>'
      : level > 0 ? '<path d="M15.5 8.5a5 5 0 010 7"/>' : '');
