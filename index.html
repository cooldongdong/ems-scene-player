<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防員場 事件腳本產生器</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #23272f;
    --line: #31363f;
    --text: #e9ecf1;
    --muted: #99a1af;
    --accent: #ff6b3d;
    --accent-dim: #ff6b3d22;
    --ok: #4ec9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 72px; }
  header h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }
  /* ---------- 兩欄工作區 ----------
     左邊挑情境、右邊看預覽並決定要演還是要改。預覽是選完情境後最重要的東西，
     所以右欄拿走全部剩餘寬度；窄畫面時疊成一欄，情境清單在上。 */
  .workspace {
    display: grid; grid-template-columns: minmax(200px, 260px) minmax(0, 1fr);
    gap: 20px; align-items: start; margin-top: 24px;
  }
  @media (max-width: 820px) { .workspace { grid-template-columns: 1fr; } }
  .workspace-side { position: sticky; top: 16px; }
  .workspace-main { min-height: 260px; }
  .workspace-empty { margin: 0; padding: 40px 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .stage-bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .stage-bar button { font-size: 14px; padding: 9px 16px; }

  /* 舊的手動組合入口，預設收起。卡片目前仍是播放機制的宿主，所以只能收不能刪。 */
  .legacy { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
  .legacy > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .legacy > summary:hover { color: var(--accent); }
  .legacy[open] > summary { margin-bottom: 16px; }

  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .field label.title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  select {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-dim); }
  .checks input { accent-color: var(--accent); margin: 0; }
  /* 這個環境×事件沒有素材的突發狀況：選得到卻演不出來最傷，直接擋在選之前 */
  .checks label.unavailable {
    opacity: .38; cursor: not-allowed; text-decoration: line-through;
    border-style: dashed;
  }
  .checks label.unavailable input { cursor: not-allowed; }
  .coverage-note { margin: 14px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .coverage-note.warn { color: #ffb27a; }
  .assets-link { margin: 4px 0 0; font-size: 13px; }
  .assets-link a { color: var(--muted); text-decoration: none; }
  .assets-link a:hover { color: var(--accent); }

  /* 情境清單：左欄的直式清單，一列一個情境 */
  .presets {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .presets .title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; letter-spacing: .5px; }
  .preset-list { display: grid; gap: 6px; }
  .preset-list button[data-scenario-id] {
    width: 100%; text-align: left; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; line-height: 1.4;
  }
  /* 目前載入的那一組亮起來，讓人知道自己在哪 */
  .preset-list button.active { border-color: var(--accent); background: var(--accent-dim); }
  /* 新增／匯出／匯入排在清單底下，跟情境本身分開 */
  .preset-list .flow-actions { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .preset-list .flow-actions button { font-size: 13px; padding: 6px 12px; }

  /* ---------- 流程 ----------
     builder 仍吃 doc 參數，之後若要把面板再長回投影視窗，接上宿主即可。 */
  .flow { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
  .flow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .flow-title { font-size: 16px; font-weight: 700; }
  .flow-counter { font-size: 13px; color: var(--muted); margin-left: auto; }
  .flow-now {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 15px; line-height: 1.5;
  }
  .flow-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .flow-btn { font-size: 14px; padding: 8px 16px; }
  .flow-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 700; }
  .flow-list { display: grid; gap: 6px; margin-top: 12px; }
  .flow-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 14px;
  }
  .flow-row.clickable { cursor: pointer; }
  .flow-row.clickable:hover { border-color: var(--accent); }
  /* 目前播到的那一頁；訓練進行中這是唯一要一眼看到的資訊 */
  .flow-row.current { border-color: var(--accent); background: var(--accent-dim); }
  /* 關掉的頁留在清單裡（是跳過，不是刪除），但要一眼看得出它不會播 */
  .flow-row.off .flow-row-title { text-decoration: line-through; opacity: .55; }
  .flow-row-title { flex: 1 1 auto; }
  .flow-row-meta { flex: none; font-size: 12px; color: var(--muted); }
  .flow-toggle { display: inline-flex; align-items: center; flex: none; }
  .flow-toggle input { margin: 0; accent-color: var(--accent); }
  /* 自訂／改過的情境要一眼認得出來，否則不知道哪些是自己的 */
  .preset-list button.custom { border-style: dashed; }
  /* 引用到沒素材的突發狀況（多半是匯入別人的情境）——能點，但先講清楚 */
  .preset-list button.broken { border-color: #ffb27a; color: #ffb27a; }
  .flow-btn-mini { font-size: 12px; padding: 4px 10px; }
  .flow-actions-tight { margin: -2px 0 4px; padding-left: 12px; }
  .flow-row.dragging { opacity: .4; }
  .flow-row[draggable="true"] { cursor: grab; }

  /* 編輯頁 */
  .edit-field { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .edit-field input {
    flex: 1 1 auto; padding: 8px 10px; font: inherit; font-size: 14px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .edit-action {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
    padding: 9px 11px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .edit-action select, .edit-action input {
    padding: 7px 9px; font: inherit; font-size: 13px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
  }
  .edit-action select { width: auto; flex: none; }
  .edit-action input { flex: 1 1 140px; min-width: 100px; }
  .edit-action input.edit-seg { flex: 0 1 130px; }
  /* ---------- 預覽 ----------
     16:9 的框，圖層用與投影端相同的百分比定位；container-type 讓文字大小
     跟著框寬走（cqw），縮圖與投影上的比例才會一致。 */
  /* 預覽拿走右欄的全寬——選完情境後它是最重要的東西 */
  .preview { margin-bottom: 16px; }
  .preview-stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    overflow: hidden; border-radius: 10px; background: #000;
    border: 1px solid var(--line); container-type: size;
  }
  .preview-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 圖層外包一層：絕對定位且寬高 auto 會縮到內容大小，把手才貼得到真正的邊角。
     媒體的尺寸上限用 px 由 JS 依 stage 實際寬高算出——百分比在 shrink-to-fit
     的容器裡會變成循環參照，瀏覽器直接當成沒設。 */
  .preview-item {
    position: absolute; transform: translate(-50%, -50%);
    line-height: 0; cursor: grab; touch-action: none;
  }
  .preview-item.dragging { cursor: grabbing; }
  .preview-item:hover, .preview-item.dragging { outline: 1px dashed rgba(255,255,255,.65); outline-offset: 2px; }
  .preview-media {
    display: block; width: auto; height: auto; object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
    pointer-events: none;   /* 拖曳事件一律由外層接，免得抓到圖片的原生拖曳 */
  }
  .preview-handle {
    position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
    border-radius: 3px; background: var(--accent); border: 1px solid #1a1005;
    cursor: nwse-resize; opacity: 0; transition: opacity .15s ease; touch-action: none;
  }
  .preview-item:hover .preview-handle, .preview-item.dragging .preview-handle { opacity: 1; }
  .preview-text {
    position: absolute; transform: translate(-50%, -50%); text-align: center;
    width: 90%; color: #fff; font-weight: 700; line-height: 1.3;
    text-shadow: 0 2px 6px rgba(0,0,0,.85);
  }
  .preview-empty, .preview-missing {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; font-size: 12px; color: var(--muted);
  }
  .preview-missing { color: #ffb27a; align-content: end; inset: auto 0 8px 0; }
  .preview-caption { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .layer-name { flex: 0 0 68px; font-size: 13px; color: var(--muted); }
  .edit-tools { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .edit-tools .flow-btn { font-size: 13px; padding: 5px 9px; }
  .edit-danger { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px; }
  button {
    font-family: inherit; font-size: 15px; padding: 11px 22px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* 病患照片疊加：開關與版面微調就放在照片旁邊，邊看照片邊調 */
  .overlay-controls {
    margin-top: 8px; padding: 9px 11px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    display: grid; gap: 8px;
  }
  .overlay-controls:has(input[type="checkbox"]:checked) { border-color: var(--accent); }
  .overlay-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer; }
  .overlay-toggle input { margin: 0; accent-color: var(--accent); }
  /* 卡片夠寬時滑桿排成兩欄，窄的時候自動疊回一欄 */
  .overlay-sliders { display: grid; gap: 6px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .overlay-slider {
    display: grid; grid-template-columns: 32px 1fr 38px; align-items: center;
    gap: 8px; font-size: 12px; color: var(--muted);
  }
  .overlay-slider input { width: 100%; margin: 0; accent-color: var(--accent); }
  .overlay-slider output { text-align: right; font-family: ui-monospace, monospace; }
  .overlay-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .overlay-hint { font-size: 11px; line-height: 1.5; color: var(--muted); flex: 1 1 140px; }
  .overlay-buttons { display: flex; gap: 8px; flex: none; }
  .overlay-controls button.reset { font-size: 13px; padding: 5px 12px; white-space: nowrap; }
  .overlay-controls button.preview.on { border-color: var(--accent); background: var(--accent-dim); }

  #status { color: var(--muted); font-size: 13px; }
  #status.error { color: var(--accent); }

  /* 同一個事件裡的影片／照片／配音維持由上而下的閱讀順序 */
  .cards { display: grid; gap: 12px; margin-top: 18px; grid-template-columns: 1fr; }
  /* 六個突發狀況彼此獨立，排成網格才不會把整頁拉成一長條 */
  #comp-groups {
    display: grid; gap: 16px; margin-top: 16px; align-items: start;
    /* min() 讓視窗比 420px 還窄時軌道能跟著縮，不然會撐出橫向捲動 */
    grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
  }
  .group-note { grid-column: 1 / -1; }
  /* 一次訓練可能要演多個突發狀況，所以勾選的每一項都各自成一組（影片＋聲音）並列在頁面上 */
  .comp-group {
    padding: 14px 16px 16px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  }
  .comp-group-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .comp-group-title { margin: 0; font-size: 17px; }
  .comp-group-title .seq {
    display: inline-block; min-width: 22px; margin-right: 8px; padding: 1px 8px;
    border-radius: 999px; background: var(--accent); color: #1a1005;
    font-size: 13px; font-weight: 700; text-align: center;
  }
  .comp-group-actions { display: flex; gap: 8px; }
  .comp-group-actions button { font-size: 13px; padding: 6px 14px; }
  .comp-group .cards { margin-top: 12px; }
  .comp-group .card { background: var(--panel); }
  /* 拆成多段時，每段自己一個可觸發的區塊 */
  .comp-segment {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .comp-segment-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .comp-segment-title { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
  .comp-segment .cards { margin-top: 10px; }
  .group-note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; gap: 10px;
    grid-template-columns: 1fr; align-content: start; min-width: 0;
  }
  .role {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    font-size: 12px; color: var(--muted);
  }
  .role strong { font-size: 15px; color: var(--text); }
  .desc { margin: 0 0 6px; font-size: 14px; }
  /* 素材路徑是不能斷行的長字串，窄視窗會把卡片撐出橫向捲動 */
  .meta { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 8px;
  }
  .badge.hit { border-color: var(--ok); color: var(--ok); }
  .badge.only { border-style: dashed; }
  @keyframes flash {
    from { border-color: var(--accent); background: var(--accent-dim); }
    to   { border-color: var(--line); background: var(--panel); }
  }
  .card.changed { animation: flash 1.1s ease-out; }
  .card.empty .desc { color: var(--muted); }
  .line {
    margin: 0 0 8px; padding: 8px 12px;
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    background: var(--panel-2); font-size: 15px;
  }
  .tts {
    margin: 0 0 8px; padding: 8px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  }
  .tts summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .tts[open] summary { margin-bottom: 8px; color: var(--text); }
  .tts-meta { font-size: 12px; color: var(--muted); }
  .tts pre {
    margin: 8px 0 10px; padding: 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line);
    font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .tts button.copy { font-size: 13px; padding: 5px 12px; }
  .none-note {
    color: var(--muted); font-size: 13px; padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: 8px;
  }
  audio { width: 100%; margin-top: 4px; }
  .media-options { display: grid; gap: 8px; }
  .media-option {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2);
  }
  .media-option.selected { border-color: var(--accent); }
  .media-option-label { color: var(--muted); font-size: 12px; word-break: break-all; }
  /* 直式綠幕素材有 720×1280，一定要限高，否則一張卡就比一個螢幕還長 */
  .card img {
    display: block; width: auto; max-width: 100%; max-height: 190px;
    border-radius: 8px; border: 1px solid var(--line);
  }
  /* 影片保持滿寬，控制列才夠空間；畫面本身用 contain 不裁切 */
  .card video {
    display: block; width: 100%; height: 190px;
    object-fit: contain; background: #0d0f12;
    border-radius: 8px; border: 1px solid var(--line);
  }
  .missing { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
  .fallback-media { display: grid; gap: .45rem; }
  .fallback-note { color: #9a5b00; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>消防員場 事件腳本產生器</h1>
    <p>選環境、急救事件與突發狀況，自動從素材庫組出情境卡；勾選的每個突發狀況都會各自成一組（影片＋聲音），訓練時再逐一播放。</p>
  </header>

  <!-- 兩欄：左邊挑情境，右邊看預覽並決定要演還是要改。
       預覽是選完情境後最重要的東西，所以它拿最大的一塊。 -->
  <div class="workspace">
    <aside class="workspace-side">
      <div class="presets" id="presets" hidden>
        <span class="title">情境</span>
        <div class="preset-list" id="preset-list"></div>
      </div>
      <p class="assets-link"><a href="assets.html">素材庫與覆蓋表 →</a></p>
    </aside>

    <section class="workspace-main panel">
      <div class="stage-bar">
        <button id="btn-project" disabled>開啟投影視窗</button>
        <button id="btn-play" disabled>播放場景</button>
        <button id="btn-stop" disabled>全部停止</button>
        <span id="status">載入素材庫中…</span>
      </div>
      <div class="flow" id="flow" hidden></div>
      <p class="workspace-empty" id="workspace-empty">從左邊挑一個情境，這裡會顯示預覽。</p>
    </section>
  </div>

  <!-- 舊入口：選環境×事件×突發狀況再產生。情境已經涵蓋它，這裡先收起來，
       下一刀把播放從卡片解耦之後就整批移除（卡片目前仍是播放機制的宿主）。 -->
  <details class="legacy" id="legacy">
    <summary>舊的手動組合入口（將移除）</summary>
    <div class="controls">
      <div class="field">
        <label class="title" for="sel-env">環境（單選）</label>
        <select id="sel-env"></select>
      </div>
      <div class="field">
        <label class="title" for="sel-med">急救事件（單選）</label>
        <select id="sel-med"></select>
      </div>
      <div class="field">
        <span class="title">突發狀況（可複選）</span>
        <div class="checks" id="checks-comp"></div>
      </div>
    </div>
    <p class="coverage-note" id="coverage-note"></p>
    <div class="actions">
      <button class="primary" id="btn-gen" disabled>產生情境</button>
    </div>
    <div class="cards" id="cards"></div>
    <div id="comp-groups"></div>
  </details>
</div>

<script src="vendor/js-yaml.min.js"></script>
<script>
// 本地 vendor 讀不到時（例如只丟了 index.html）退回 CDN
if (typeof jsyaml === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"><\/script>');
}
</script>
<!-- 情境資料層：純函式、不碰 DOM，同一份檔案也被 test/scenarios.test.js 用 Node 載入測試 -->
<script src="js/scenarios.js"></script>
<script>
const ROLES = [
  { role: 'environment_video',  label: '環境影像' },
  { role: 'ambient_sound',      label: '環境聲音' },
  { role: 'patient_photo',      label: '病患樣貌照片' },
  { role: 'patient_voice',      label: '病患聲音' },
  { role: 'complication_video', label: '突發狀況綠幕影片' },
  { role: 'complication_voice', label: '突發狀況聲音' },
];
// 這兩個角色一律成對綁在同一個突發狀況上，避免影片與台詞來自不同事件
const COMPLICATION_ROLES = ['complication_video', 'complication_voice'];
const BASE_ROLES = ROLES.filter(r => !COMPLICATION_ROLES.includes(r.role));
const COMP_ROLES = ROLES.filter(r => COMPLICATION_ROLES.includes(r.role));
const PATIENT_PAIR_TAGS = ['gender', 'ageGroup'];
// 決定「哪一筆素材比較貼合這次條件」的維度，順序不影響結果
const SPECIFICITY_TAGS = ['environment', 'medicalEvent', 'complication'];

let DATA = null;
// key = 基本角色的 role，或突發狀況的 `role|突發狀況`（同一次可有多組，不能只用 role）
const lastPicked = {};   // key -> 上一次選到的 id，重新產生時盡量換一個
const shownIds = {};     // key -> 目前卡片上的 id，用來標出這次換了哪幾張
const mediaObjectUrls = new Set();
const mediaLoadControllers = new Set();
let genCount = 0;
let currentEnvironmentAsset = null;
let currentPatientPhotoAsset = null;
let projectionWindow = null;

// 病患疊加的開關與版面；size 是「照片可佔畫面的比例」，x／y 是照片中心點位置
const PATIENT_OVERLAY_DEFAULTS = { size: 85, x: 50, y: 57 };
const patientOverlay = { enabled: false, ...PATIENT_OVERLAY_DEFAULTS };
// 大小／位置改成直接在預覽上拖，不再有滑桿——同一件事給兩種操作方式，
// 使用者會不知道該用哪個，而且兩邊的狀態遲早對不起來。
const PATIENT_OVERLAY_SLIDERS = [];
// 同一份 patientOverlay 可能同時顯示在多個地方（卡片、之後可能的其他面板），
// 任一邊動了都要把其他的推到同一個值——比照下面綠幕的 complicationOverlayBoxes。
const patientOverlayBoxes = [];        // { sync, enabled }

// ---------- 流程（第二刀）----------
// 「目前載入哪個情境、播到第幾頁」是一份狀態。編輯一律在主視窗——
// 投影視窗在投影機上、是給學員看的，任何介面出現在那裡都會被學員看到。
let currentScenario = null;
let flowIndex = -1;                    // 指向「會播的頁」的 index；-1 = 尚未開始
let panelLevel = 'scenarios';        // 'scenarios' | 'slides' | 'edit'
let editingSlideId = null;             // 'edit' 層正在編哪一頁
// 片段 key -> 播放函式，由 segmentActions 登記，generate() 時清空
const segmentPlayers = new Map();

// 綠幕疊加：每個突發狀況各自記版面與去背容差，重新產生情境後沿用
const COMP_OVERLAY_DEFAULTS = { size: 70, x: 50, y: 55, tolerance: 40 };
// 只剩去背：它調的是像素運算，不是空間位置，拖不出來。
// 容差再往上會開始吃掉白色、深色制服這類低彩度的顏色，所以上限收在 60。
const COMP_OVERLAY_SLIDERS = [
  { key: 'tolerance', label: '去背', min: 5,  max: 60, unit: '' },
];
// 一個突發狀況可以拆成好幾個片段，素材以 `突發狀況|片段` 當 key；
// 但版面設定是整個突發狀況共用一份——同一個人站在同一個位置，不該每段重調一次。
const complicationOverlays = {};       // 突發狀況 -> 版面設定
const complicationOverlayBoxes = [];   // { comp, sync }：同組各片段的滑桿要一起動
const complicationVideoAssets = {};    // 片段 -> 本次選到的綠幕素材
let activeComplication = null;         // 目前疊在投影上的那一段（含預覽）
let activeSegment = null;

function segmentKey(comp, segment) {
  return `${comp}|${segment}`;
}

function complicationOverlay(comp) {
  return complicationOverlays[comp] || (complicationOverlays[comp] = { ...COMP_OVERLAY_DEFAULTS });
}

// 版面現在寫在情境檔的圖層上。
//
// 舊版是「依當下的環境素材」存進 localStorage，那有兩個問題：
//   ① 它是依環境的，對不上圖層模型的依頁——同一個環境的兩頁想擺不同位置就做不到
//   ② 存在瀏覽器裡，換一台電腦就不見，也沒辦法跟別人分享或送 PR
// 圖層本來就要存自己的位置，所以這一層直接消失，不做遷移（2026-08-03 Dong 拍板）。

const LAYOUT_KEYS = { patient: ['size', 'x', 'y'], greenscreen: ['size', 'x', 'y', 'tolerance'] };

function currentSlide() {
  return flowIndex >= 0 ? flowSteps[flowIndex] : null;
}

// 滑桿下方那行字要誠實：沒載入情境時調了不會被記住
function layoutHint() {
  return currentScenario && currentSlide()
    ? '調整會即時反映在投影視窗，並存進這一頁的圖層'
    : '調整會即時反映在投影視窗；載入情境後才會被記住';
}

// 進到某一頁時，把該頁圖層上的版面搬進執行期物件（渲染程式讀的還是這兩個物件）
function loadLayoutFromSlide(slide) {
  Object.assign(patientOverlay, PATIENT_OVERLAY_DEFAULTS);
  // **就地覆寫，不能 delete 再重建。** 卡片上的滑桿在 generate() 時就抓住了這些物件的
  // 參考（overlaySliderRows 直接改傳進去的 state），換成新物件的話滑桿會改到孤兒，
  // 投影與預覽都不會動——這正是這裡曾經踩過的坑。
  Object.values(complicationOverlays).forEach(l => Object.assign(l, COMP_OVERLAY_DEFAULTS));

  const patient = slide && Scenarios.layerOf(slide, 'patient');
  // 有沒有 patient 圖層就是「要不要疊病患」——不需要另一個獨立的開關狀態
  patientOverlay.enabled = !!patient;
  if (patient) LAYOUT_KEYS.patient.forEach(k => { patientOverlay[k] = patient[k]; });

  const green = slide && Scenarios.layerOf(slide, 'greenscreen');
  if (green) {
    const layout = complicationOverlay(green.complication);
    LAYOUT_KEYS.greenscreen.forEach(k => { layout[k] = green[k]; });
  }
}

// 拖滑桿會連續觸發，每一格都寫 localStorage 太重，收斂成一次
let layoutSaveTimer = null;
function persistLayerLayout(type, comp) {
  const slide = currentSlide();
  const layer = slide && Scenarios.layerOf(slide, type);
  // 沒載入情境（直接按「產生情境」的臨時模式）就只在記憶體裡調，不寫進任何情境檔
  if (!currentScenario || !layer) return;
  const src = type === 'patient' ? patientOverlay : complicationOverlay(comp);
  LAYOUT_KEYS[type].forEach(k => { layer[k] = src[k]; });
  clearTimeout(layoutSaveTimer);
  layoutSaveTimer = setTimeout(() => saveScenarioOverride(currentScenario), 400);
}

function syncComplicationOverlayBoxes(comp) {
  complicationOverlayBoxes.forEach(box => { if (box.comp === comp) box.sync(); });
}

// 同一份狀態可能有多組滑桿在顯示，滑桿與「疊加」開關都要一起同步
function syncPatientOverlayBoxes() {
  patientOverlayBoxes.forEach(box => {
    box.sync();
    if (box.enabled) box.enabled.checked = patientOverlay.enabled;
  });
}

// 素材沒寫 segment 就是第 1 段；判斷在資料層，這裡只是轉呼叫
const segmentOf = asset => Scenarios.segmentOf(asset);

// 這個突發狀況在目前條件下被拆成哪幾段
function complicationSegments(comp, env, med) {
  return Scenarios.complicationSegments(DATA.assets, comp, env, med);
}

// ---------- 把關 ----------
// 選得到卻演不出來是最傷的一種挫折：使用者以為自己設定好了，實際上按下去什麼都沒有。
// 5 環境 × 6 事件 × 6 突發狀況 = 180 種勾選，實際上只有 46 種會出現東西。
// 所以「有沒有素材」必須在選之前就看得見，而不是產生之後才發現。
let availabilityCache = { key: null, comps: null, base: null };

function availabilityFor(env, med) {
  const key = `${env}|${med}`;
  if (availabilityCache.key !== key) {
    availabilityCache = {
      key,
      comps: Scenarios.availableComplications(DATA.assets, DATA.options, env, med),
      base: Scenarios.baseCoverage(DATA.assets, env, med),
    };
  }
  return availabilityCache;
}

function complicationUsable(comp, env = $('sel-env').value, med = $('sel-med').value) {
  const found = availabilityFor(env, med).comps.find(c => c.comp === comp);
  return !!found && found.ok;
}

// 新增動作時要預設一個「真的能演」的狀況；沒有任何可用的就回傳第一個，
// 讓它顯示成「此情境無素材」而不是靜靜地存進一個壞動作
function firstUsableComplication() {
  const env = currentScenario ? currentScenario.environment : $('sel-env').value;
  const med = currentScenario ? currentScenario.medicalEvent : $('sel-med').value;
  const ok = availabilityFor(env, med).comps.find(c => c.ok);
  return ok ? ok.comp : optionsFor('complication')[0];
}

// 情境用到的狀況在它自己的環境×事件下有沒有素材（匯入別人的情境時特別重要）
function scenarioBrokenComplications(scenario) {
  return Scenarios.complicationsOf(scenario)
    .filter(c => !complicationUsable(c, scenario.environment, scenario.medicalEvent));
}

const ROLE_LABEL = {
  environment_video: '環境影像', ambient_sound: '環境聲音',
  patient_photo: '病患照片', patient_voice: '病患聲音',
};

// 「刻意留白」（type: none）不算缺，那是資料作者的決定，不是漏洞
function missingBaseLabels(env, med) {
  const base = availabilityFor(env, med).base;
  return Scenarios.BASE_ROLES.filter(r => base[r] === 'missing').map(r => ROLE_LABEL[r]);
}

// 依目前的環境×事件更新突發狀況勾選框：沒素材的直接停用並說明原因
function refreshComplicationAvailability() {
  if (!DATA) return;
  const env = $('sel-env').value;
  const med = $('sel-med').value;
  document.querySelectorAll('#checks-comp label').forEach(label => {
    const input = label.querySelector('input');
    const usable = complicationUsable(input.value, env, med);
    input.disabled = !usable;
    label.classList.toggle('unavailable', !usable);
    label.title = usable ? '' : `${env}／${med} 沒有「${input.value}」的綠幕素材，勾了也不會出現`;
    // 條件變動後，原本勾著的可能已經不可用——留著會產生一組空的突發狀況卡
    if (!usable && input.checked) input.checked = false;
  });
  const missing = missingBaseLabels(env, med);
  const note = $('coverage-note');
  const usableCount = availabilityFor(env, med).comps.filter(c => c.ok).length;
  note.textContent = missing.length
    ? `這個組合缺：${missing.join('、')}　·　可用的突發狀況 ${usableCount} 個`
    : `四項基本素材齊全　·　可用的突發狀況 ${usableCount} 個`;
  note.classList.toggle('warn', missing.length > 0);
}

const $ = id => document.getElementById(id);
const status = $('status');

function setStatus(msg, isError) {
  status.textContent = msg;
  status.classList.toggle('error', !!isError);
}

// index.html 會用到的資料層 API。少一個就代表 js/scenarios.js 是舊版——
// 通常是瀏覽器拿了快取：YAML 用 no-cache 每次都新的，<script src> 卻可能不問就用舊的，
// 於是新資料配舊程式，錯誤訊息還會指向完全無關的地方。
const REQUIRED_SCENARIO_API = [
  'normalizeScenarios', 'mergeScenarios', 'forExport', 'complicationsOf', 'playableSlides',
  'exportYaml', 'parseImport', 'segmentOf', 'complicationSegments', 'eligibleAssets',
  'availableComplications', 'baseCoverage',
];

function checkScenarioApi() {
  if (typeof Scenarios === 'undefined') {
    return 'js/scenarios.js 未載入（確認檔案存在，且是用本地伺服器開啟）';
  }
  const missing = REQUIRED_SCENARIO_API.filter(name => typeof Scenarios[name] !== 'function');
  if (missing.length) {
    return `js/scenarios.js 是舊版，缺少 ${missing.join('、')}。`
      + '請強制重新整理清掉快取（Mac：⌘+Shift+R，Windows：Ctrl+F5）';
  }
  return null;
}

// 素材頁的覆蓋表點一格會帶 ?env=&med= 過來。值對不上就當作沒帶——
// 網址是使用者能亂改的東西，照單全收會讓選單進到一個不存在的狀態。
function applyQueryCondition() {
  const params = new URLSearchParams(location.search);
  const env = params.get('env');
  const med = params.get('med');
  const envs = environmentGroups().flatMap(([, values]) => values);
  let changed = false;
  if (env && envs.includes(env)) { $('sel-env').value = env; changed = true; }
  if (med && optionsFor('medicalEvent').includes(med)) { $('sel-med').value = med; changed = true; }
  if (changed) {
    refreshComplicationAvailability();
    syncScenarioActive();
  }
}

async function init() {
  // 讀檔與後續處理分開接錯：只有真的抓不到檔才該建議「用本地伺服器開啟」。
  // 混在一起的話，任何錯誤都會被說成伺服器問題，把人指向錯的方向。
  let text;
  try {
    // no-cache：改完 YAML 重新整理就要看到新資料，不能讀到瀏覽器快取的舊版
    const res = await fetch('scenario-data.yaml', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (err) {
    setStatus('讀取 scenario-data.yaml 失敗：' + err.message
      + '（請用本地伺服器開啟，例如 python3 -m http.server 8000）', true);
    return;
  }

  try {
    if (typeof jsyaml === 'undefined') throw new Error('js-yaml 未載入');
    const apiProblem = checkScenarioApi();
    if (apiProblem) throw new Error(apiProblem);
    DATA = jsyaml.load(text);
    if (!DATA || !Array.isArray(DATA.assets)) throw new Error('scenario-data.yaml 缺少 assets 陣列');
    buildControls();
    applyQueryCondition();
    $('btn-gen').disabled = false;
    setStatus(`素材庫已載入：${DATA.assets.length} 筆`);
  } catch (err) {
    setStatus('初始化失敗：' + err.message, true);
  }
}

function optionsFor(dim) {
  const declared = DATA.options && DATA.options[dim];
  if (Array.isArray(declared) && declared.length) return declared;
  // options 沒寫時，從素材標籤自動蒐集
  const seen = new Set();
  DATA.assets.forEach(a => (a.tags?.[dim] || []).forEach(v => seen.add(v)));
  return [...seen];
}

// environment 可在 YAML 依室內／室外分組；舊版平鋪陣列和未宣告 options 的資料也可繼續使用。
function environmentGroups() {
  const declared = DATA.options && DATA.options.environment;
  if (declared && !Array.isArray(declared) && typeof declared === 'object') {
    const groups = Object.entries(declared)
      .filter(([, values]) => Array.isArray(values) && values.length);
    if (groups.length) return groups;
  }
  return [['未分類', optionsFor('environment')]];
}

function buildControls() {
  const env = $('sel-env');
  env.innerHTML = '';
  for (const [group, values] of environmentGroups()) {
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group });
    for (const value of values) {
      optgroup.appendChild(Object.assign(document.createElement('option'), { value, textContent: value }));
    }
    env.appendChild(optgroup);
  }

  const med = $('sel-med');
  med.innerHTML = '';
  for (const value of optionsFor('medicalEvent')) {
    med.appendChild(Object.assign(document.createElement('option'), { value, textContent: value }));
  }
  const box = $('checks-comp');
  box.innerHTML = '';
  for (const v of optionsFor('complication')) {
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'checkbox', value: v });
    label.append(input, document.createTextNode(v));
    box.appendChild(label);
  }
  box.addEventListener('change', syncScenarioActive);

  refreshComplicationAvailability();
  buildScenarios();
  syncScenarioActive();
}

function selectedComplications() {
  return [...document.querySelectorAll('#checks-comp input:checked')].map(i => i.value);
}

// ---------- 情境（scenario）----------
// 一個情境 = 素材組合（環境×急救事件）＋ 一串照順序演的簡報頁。
// 資料層在 js/scenarios.js，是不碰 DOM 的純函式，由 test/scenarios.test.js 釘住（node --test）。
// 這裡只負責「把資料接到畫面上」，判斷邏輯一律不要寫在這一層，否則測不到。

const SCENARIO_STORE_KEY = 'ems-scene-player:scenarios';

// buildScenarios 時算一次就存起來：正規化會印 console 警告，
// 若每次選單變動都重算，同一則警告會被洗版式地重複印出。
let activeScenarios = [];

// 自訂情境存 localStorage，用 JSON——只存字串、往返精確、沒有人會手讀這一份。
// （匯出給人看的檔案才用 YAML，那是另一條路，見 js/scenarios.js 的 exportYaml。）
function readCustomScenarios() {
  try {
    const raw = localStorage.getItem(SCENARIO_STORE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    // 壞掉的工作副本不該讓整個站台開不起來，回到純內建即可
    console.warn('自訂情境讀取失敗，改用內建情境：' + err.message);
    return [];
  }
}

function writeCustomScenarios(scenarios) {
  try {
    localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(Scenarios.forExport(scenarios)));
    return true;
  } catch (err) {
    setStatus('自訂情境儲存失敗：' + err.message, true);
    return false;
  }
}

function buildScenarios() {
  const box = $('presets');
  const list = $('preset-list');
  list.innerHTML = '';
  activeScenarios = [];

  if (DATA) {
    const builtin = Scenarios.normalizeScenarios(DATA.scenarios, DATA.options);
    const custom = Scenarios.normalizeScenarios(readCustomScenarios(), DATA.options);
    [...builtin.warnings, ...custom.warnings].forEach(w => console.warn(w));
    activeScenarios = Scenarios.mergeScenarios(builtin.scenarios, custom.scenarios);
  }

  // 沒宣告 scenarios 就整塊收起來，舊的 scenario-data.yaml 不會多出空欄位
  box.hidden = !activeScenarios.length;
  if (!activeScenarios.length) return;

  activeScenarios.forEach(scenario => {
    const comps = Scenarios.complicationsOf(scenario);
    const pages = Scenarios.playableSlides(scenario).length;
    const broken = scenarioBrokenComplications(scenario);
    const btn = Object.assign(document.createElement('button'), {
      type: 'button',
      textContent: scenario.name + (broken.length ? ' ⚠' : ''),
      title: [
        `${scenario.environment}／${scenario.medicalEvent}`,
        comps.length ? `突發狀況：${comps.join('、')}` : '不含突發狀況',
        `${pages} 頁流程`,
        broken.length ? `⚠ 這些狀況在此情境下沒有素材：${broken.join('、')}` : '',
        scenario.note || '',
      ].filter(Boolean).join('\n'),
    });
    if (broken.length) btn.classList.add('broken');
    btn.dataset.scenarioId = scenario.id;
    if (scenario.source !== 'builtin') btn.classList.add('custom');
    btn.addEventListener('click', () => loadScenario(scenario));
    list.appendChild(btn);
  });
  list.appendChild(buildScenarioTools(document));
}

// 只設定三個選單，不產生情境。切換某頁啟用時會單獨用到它。
function applyScenarioSelection(scenario) {
  // 勾哪些突發狀況由 slides 推導，不讀情境上的欄位——那個欄位刻意不存在
  const comps = Scenarios.complicationsOf(scenario);
  $('sel-env').value = scenario.environment;
  $('sel-med').value = scenario.medicalEvent;
  document.querySelectorAll('#checks-comp input').forEach(input => {
    input.checked = comps.includes(input.value);
  });
  syncScenarioActive();
}

function loadScenario(scenario) {
  // 每次都拿最新的那一份（可能剛被覆蓋過），不要抱著按鈕建立時的舊物件
  currentScenario = activeScenarios.find(s => s.id === scenario.id) || scenario;
  applyScenarioSelection(currentScenario);
  generate();                 // 素材要先產生，segmentPlayers 才有東西可登記
  buildFlowSteps();
  flowIndex = -1;
  panelLevel = 'slides';
  renderFlow();
}

// 手動改選單 = 離開情境，流程跟著失效，否則流程會指向已經不存在的素材
function leaveScenario() {
  if (!currentScenario) return;
  currentScenario = null;
  flowSteps = [];
  flowIndex = -1;
  panelLevel = 'scenarios';
  renderFlow();
}

// 手動改選單後，亮起來的情境要跟著熄掉，否則會誤以為現在還是那一組
function syncScenarioActive() {
  if (!DATA) return;
  const env = $('sel-env').value;
  const med = $('sel-med').value;
  const picked = selectedComplications();
  const matches = scenario => scenario.environment === env
    && scenario.medicalEvent === med
    && (() => {
      const comps = Scenarios.complicationsOf(scenario);
      return comps.length === picked.length && comps.every(c => picked.includes(c));
    })();

  [...$('preset-list').children].forEach((btn, i) => {
    btn.classList.toggle('active', !!activeScenarios[i] && matches(activeScenarios[i]));
  });
}

// ---------- 流程引擎 ----------

// **一頁＝一步。** 舊模型要在這裡把多片段的突發狀況展開成多步；圖層模型下那個展開
// 已經發生在資料層（migrateScenario），每一段都是真正的一頁，所以這裡只剩「會播的頁」。
let flowSteps = [];

function buildFlowSteps() {
  flowSteps = currentScenario ? Scenarios.playableSlides(currentScenario) : [];
}

// 這一頁畫面上有什麼——講給教官聽的一句話
function stepLabel(slide) {
  if (!slide) return '';
  const green = Scenarios.layerOf(slide, 'greenscreen');
  const text = Scenarios.layerOf(slide, 'text');
  const parts = [];
  if (green) parts.push(green.complication + (green.segment ? `　片段 ${green.segment}` : ''));
  if (text) parts.push(`字幕：${text.text}`);
  if (slide.note) parts.push(slide.note);
  return parts.join('　·　') || '只有場景';
}

function runStep(slide) {
  if (!slide) return;
  // 版面存在這一頁的圖層上，換頁就要換一組——這是圖層模型取代舊 localStorage 的地方
  loadLayoutFromSlide(slide);
  renderProjectionPatient();
  syncPatientOverlayBoxes();
  const green = Scenarios.layerOf(slide, 'greenscreen');
  if (!green) {
    // 沒有綠幕圖層的頁不該讓上一頁的人物還站在畫面上
    stopMediaIn($('comp-groups'));
    stopComplicationProjection();
    renderProjectionText(slide);
    return;
  }
  // segment 省略＝第一段（與資料層的規則一致）
  const segment = green.segment || complicationSegments(green.complication,
    $('sel-env').value, $('sel-med').value)[0];
  const play = segmentPlayers.get(segmentKey(green.complication, segment));
  if (play) { play(); renderProjectionText(slide); return; }
  // 素材缺了不能靜靜跳過——教官會以為自己按錯
  stopMediaIn($('comp-groups'));
  stopComplicationProjection();
  setStatus(`這一頁的素材不存在：${green.complication}${green.segment ? ` 片段 ${green.segment}` : ''}`, true);
}

// text 圖層＝投影給學員看的字。與 slide.note（給教官的提詞）是兩件事，
// 混掉的後果是把提詞投到大螢幕上，所以這裡只讀 text 圖層。
function renderProjectionText(slide) {
  const doc = projectionDocument();
  if (!doc) return;
  const box = doc.getElementById('projection-message');
  const layer = slide && Scenarios.layerOf(slide, 'text');
  if (!layer) { box.style.display = 'none'; box.textContent = ''; return; }
  box.textContent = layer.text;
  box.style.display = 'grid';
  box.style.background = 'transparent';
  box.style.placeItems = 'center';
  box.style.fontSize = `clamp(18px, ${layer.size / 10}vw, 96px)`;
  box.style.left = 0;
  box.style.top = `${layer.y - 50}%`;
}

function gotoFlow(index) {
  if (!flowSteps.length) return;
  flowIndex = Math.max(0, Math.min(index, flowSteps.length - 1));
  runStep(flowSteps[flowIndex]);
  renderFlow();
}

function nextFlow() {
  if (!flowSteps.length) return;
  if (flowIndex >= flowSteps.length - 1) return;   // 最後一步就停在那，不繞回開頭
  gotoFlow(flowIndex + 1);
}

function prevFlow() {
  if (!flowSteps.length || flowIndex <= 0) return;
  gotoFlow(flowIndex - 1);
}

function stopFlow() {
  flowIndex = -1;
  stopAll();
  renderFlow();
}

// 任何一種編輯之後都要做的事，集中在這裡——散在各個操作裡遲早會有人漏掉一步
function persistScenarioEdit() {
  if (!currentScenario) return;
  const beforeStep = flowIndex >= 0 ? flowSteps[flowIndex] : null;
  const beforeComps = selectedComplications().slice().sort().join('|');

  saveScenarioOverride(currentScenario);
  applyScenarioSelection(currentScenario);   // 勾選是推導出來的，頁一動就要跟著變

  // 突發狀況的集合變了才重新產生素材：generate() 會重抽，編輯中每動一下就重抽很擾人
  if (selectedComplications().slice().sort().join('|') !== beforeComps) generate();

  buildFlowSteps();
  // 頁數可能變了，目前這一步未必還存在，收斂回合理範圍
  const i = beforeStep ? flowSteps.findIndex(s => s.slideId === beforeStep.slideId) : -1;
  flowIndex = i >= 0 ? i : (flowSteps.length ? Math.min(flowIndex, flowSteps.length - 1) : -1);
  renderFlow();
}

// 切換某頁的啟用：這是「現場臨時抽掉一個橋段」，所以要立刻反映在流程與儲存上
function toggleSlideEnabled(slideId) {
  if (!currentScenario) return;
  const slide = currentScenario.slides.find(s => s.id === slideId);
  if (!slide) return;
  slide.enabled = slide.enabled === false;
  persistScenarioEdit();
}

// ---------- 編輯：頁 ----------

function nextSlideId(scenario) {
  let n = scenario.slides.length + 1;
  while (scenario.slides.some(s => s.id === `s${n}`)) n++;
  return `s${n}`;
}

function addSlide() {
  if (!currentScenario) return;
  const slide = {
    id: nextSlideId(currentScenario),
    title: `第 ${currentScenario.slides.length + 1} 頁`,
    enabled: true,
    // 新頁先給場景＋病患：沒有圖層的頁在資料層會被丟掉，等於按了沒反應
    layers: [newLayer('scene'), newLayer('patient')],
  };
  currentScenario.slides.push(slide);
  editingSlideId = slide.id;
  panelLevel = 'edit';
  persistScenarioEdit();
}

function duplicateSlide(slideId) {
  if (!currentScenario) return;
  const i = currentScenario.slides.findIndex(s => s.id === slideId);
  if (i < 0) return;
  const copy = JSON.parse(JSON.stringify(currentScenario.slides[i]));
  copy.id = nextSlideId(currentScenario);
  copy.title += '（複製）';
  currentScenario.slides.splice(i + 1, 0, copy);
  persistScenarioEdit();
}

function deleteSlide(slideId) {
  if (!currentScenario) return;
  if (currentScenario.slides.length <= 1) {
    setStatus('至少要留一頁——沒有任何頁的情境會被資料層整筆跳過。', true);
    return;
  }
  currentScenario.slides = currentScenario.slides.filter(s => s.id !== slideId);
  if (editingSlideId === slideId) { editingSlideId = null; panelLevel = 'slides'; }
  persistScenarioEdit();
}

function moveSlide(slideId, toIndex) {
  if (!currentScenario) return;
  const from = currentScenario.slides.findIndex(s => s.id === slideId);
  if (from < 0) return;
  const to = Math.max(0, Math.min(toIndex, currentScenario.slides.length - 1));
  if (from === to) return;
  const [slide] = currentScenario.slides.splice(from, 1);
  currentScenario.slides.splice(to, 0, slide);
  persistScenarioEdit();
}

// ---------- 編輯：圖層 ----------

function editingSlide() {
  return currentScenario && currentScenario.slides.find(s => s.id === editingSlideId);
}

// 圖層上下順序由型別決定（投影視窗的 z-index 是寫死的），所以新增後一律重排，
// 不提供拖曳把手——做一個拖了卻沒效果的介面比不做更糟。
function sortLayers(slide) {
  slide.layers.sort((a, b) =>
    Scenarios.LAYER_TYPES.indexOf(a.type) - Scenarios.LAYER_TYPES.indexOf(b.type));
}

function newLayer(type) {
  const layer = { type, ...Scenarios.LAYER_DEFAULTS[type] };
  if (type === 'greenscreen') layer.complication = firstUsableComplication();
  if (type === 'text') layer.text = '說明文字';
  return layer;
}

function addLayer(type) {
  const slide = editingSlide();
  if (!slide) return;
  if (Scenarios.layerOf(slide, type)) {
    setStatus(`這一頁已經有一個 ${type} 圖層——每種型別一頁只能有一個。`, true);
    return;
  }
  slide.layers.push(newLayer(type));
  sortLayers(slide);
  persistScenarioEdit();
}

function removeLayer(type) {
  const slide = editingSlide();
  if (!slide) return;
  if (slide.layers.length <= 1) {
    setStatus('每頁至少要留一個圖層——沒有圖層的頁會被資料層丟掉。', true);
    return;
  }
  slide.layers = slide.layers.filter(l => l.type !== type);
  persistScenarioEdit();
}

function updateLayer(type, patch) {
  const slide = editingSlide();
  const layer = slide && Scenarios.layerOf(slide, type);
  if (!layer) return;
  Object.assign(layer, patch);
  // 空字串代表「回到 auto／不指定」，留著會被資料層當成真的值
  for (const key of ['segment', 'asset']) {
    if (layer[key] === '') delete layer[key];
  }
  persistScenarioEdit();
}

// ---------- 編輯：情境 ----------

function nextScenarioId() {
  let n = 1;
  while (activeScenarios.some(s => s.id === `custom-${n}`)) n++;
  return `custom-${n}`;
}

function newScenario() {
  const scenario = {
    id: nextScenarioId(),
    name: '新情境',
    environment: $('sel-env').value,
    medicalEvent: $('sel-med').value,
    slides: [{ id: 's1', title: '抵達現場', enabled: true, layers: [newLayer('scene'), newLayer('patient')] }],
  };
  saveScenarioOverride(scenario);
  loadScenario(activeScenarios.find(s => s.id === scenario.id) || scenario);
}

function duplicateScenario(scenario) {
  const copy = JSON.parse(JSON.stringify(Scenarios.forExport([scenario])[0]));
  copy.id = nextScenarioId();
  copy.name = scenario.name + '（複製）';
  saveScenarioOverride(copy);
  loadScenario(activeScenarios.find(s => s.id === copy.id) || copy);
}

// 刪自訂＝真的消失；刪「覆蓋內建的那份」＝還原成內建，不是刪掉內建
function deleteScenario(scenario) {
  writeCustomScenarios(
    Scenarios.normalizeScenarios(
      readCustomScenarios().filter(s => s.id !== scenario.id), DATA.options).scenarios);
  buildScenarios();
  if (currentScenario && currentScenario.id === scenario.id) {
    const still = activeScenarios.find(s => s.id === scenario.id);
    if (still) loadScenario(still); else leaveScenario();
  } else {
    renderFlow();
  }
}

function renameScenario(name) {
  if (!currentScenario) return;
  currentScenario.name = name;
  persistScenarioEdit();
}

// ---------- 匯出／匯入 ----------

function exportScenarios() {
  const text = Scenarios.exportYaml(activeScenarios, jsyaml.dump);
  const blob = new Blob([text], { type: 'text/yaml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'),
    { href: url, download: 'ems-scenarios.yaml' });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setStatus(`已匯出 ${activeScenarios.length} 個情境（YAML，可直接貼回 scenario-data.yaml）`);
}

function importScenarios(text) {
  const result = Scenarios.parseImport(text, DATA.options, jsyaml.load);
  result.warnings.forEach(w => console.warn(w));
  if (!result.ok) {
    setStatus('匯入失敗：' + result.warnings.join('；'), true);
    return;
  }
  if (!result.scenarios.length) {
    setStatus('匯入的檔案裡沒有任何有效情境。', true);
    return;
  }
  // 同 id 覆蓋，其餘保留——匯入是「加進來」，不是「取代全部」
  const kept = readCustomScenarios().filter(s => !result.scenarios.some(n => n.id === s.id));
  writeCustomScenarios(
    Scenarios.normalizeScenarios([...kept, ...Scenarios.forExport(result.scenarios)], DATA.options).scenarios);
  buildScenarios();
  leaveScenario();
  const skipped = result.warnings.length ? `，略過 ${result.warnings.length} 筆有問題的資料` : '';
  setStatus(`已匯入 ${result.scenarios.length} 個情境${skipped}`);
}

function pickImportFile() {
  const input = Object.assign(document.createElement('input'),
    { type: 'file', accept: '.yaml,.yml,.json,text/yaml,application/json' });
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    file.text().then(importScenarios).catch(err => setStatus('讀檔失敗：' + err.message, true));
  });
  input.click();
}

// 改過的情境（含內建）一律以自訂身分存進 localStorage，同 id 覆蓋內建
function saveScenarioOverride(scenario) {
  const custom = readCustomScenarios().filter(s => s.id !== scenario.id);
  custom.push(Scenarios.forExport([scenario])[0]);
  writeCustomScenarios(
    Scenarios.normalizeScenarios(custom, DATA.options).scenarios);
  buildScenarios();
}

function intersects(list, picks) {
  return (list || []).some(v => picks.includes(v));
}

// 篩選與特異性排序都在 js/scenarios.js（資料層），這裡只負責「從剩下的裡面抽一筆」。
// 分界的理由：篩選是判斷、要被測試釘住，而且要跟「這個選項能不能用」共用同一份實作；
// 隨機與「上次抽過什麼」是每次執行才有的狀態，測不了也不該測。
function pickForRole(role, env, med, comps, { patientPhoto = null, memoKey = role, segment = null } = {}) {
  const candidates = Scenarios.eligibleAssets(DATA.assets, role,
    { env, med, comps, patientPhoto, segment });
  if (!candidates.length) return null;

  // 同條件重新產生時盡量換一筆
  let picks = candidates;
  if (picks.length > 1 && lastPicked[memoKey]) {
    const others = picks.filter(a => a.id !== lastPicked[memoKey]);
    if (others.length) picks = others;
  }

  const chosen = picks[Math.floor(Math.random() * picks.length)];
  lastPicked[memoKey] = chosen.id;
  return {
    asset: chosen,
    hit: intersects(chosen.tags?.complication, comps),
    // 實際會被抽到的筆數（已排除輸掉特異性的通用素材），用來說明「為什麼重新產生沒變」
    poolSize: candidates.length,
  };
}

// file 可填單一檔名字串或多個檔名陣列；素材資料夾固定為 assets/<role>/。
// 仍接受舊版完整相對路徑，以及外部 URL，方便既有資料逐步遷移。
function assetFiles(asset) {
  const values = Array.isArray(asset.file) ? asset.file : [asset.file];
  return values
    .filter(file => typeof file === 'string')
    .map(file => file.trim())
    .filter(Boolean);
}

function assetPath(asset, file = assetFiles(asset)[0]) {
  if (typeof file !== 'string' || !file) return file;
  if (/^(?:[a-z][a-z0-9+.-]*:|\/|\.{1,2}\/)/i.test(file) || file.includes('/')) return file;
  return `assets/${asset.role}/${file}`;
}

function fallbackFiles(asset) {
  const files = Array.isArray(asset.fallback) ? asset.fallback : [asset.fallback];
  return files
    .filter(file => typeof file === 'string' && /\.(jpg|jpeg|png)$/i.test(file))
    .map(file => assetPath(asset, file));
}

// 副檔名優先於 YAML 的 type：真實素材常常換格式（例如綠幕從影片換成一張劇照），
// 這樣只要換檔案就能用，type 一時沒跟著改也不會讓整張卡壞掉。
function mediaKind(asset, file = assetPath(asset, assetFiles(asset)[0])) {
  if (asset.type === 'none') return 'none';
  if (typeof file === 'string') {
    if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(file)) return 'video';
    if (/\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(file)) return 'image';
    if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)$/i.test(file)) return 'audio';
  }
  return asset.type || 'audio';
}

function absoluteAssetUrl(file) {
  try {
    return new URL(file, document.baseURI).href;
  } catch {
    return file;
  }
}

function missingMedia(file) {
  const note = document.createElement('div');
  note.className = 'missing';
  note.textContent = '找不到素材檔：' + file;
  return note;
}

function imageMedia(file, description, onError) {
  const image = document.createElement('img');
  image.src = file;
  image.alt = description || '環境圖片';
  image.addEventListener('error', () => {
    const replacement = onError ? onError() : missingMedia(file);
    image.replaceWith(replacement);
  }, { once: true });
  return image;
}

function playableIn(root) {
  return root ? root.querySelectorAll('audio[src], video[src]').length > 0 : false;
}

function updatePlaybackButtons() {
  const scene = playableIn($('cards'));
  const groups = $('comp-groups');
  let anySegment = false;
  // 每個片段各自一顆播放鈕；靜態綠幕沒有可播媒體，但仍要能觸發投影疊加
  groups.querySelectorAll('button.play').forEach(button => {
    const block = button.closest('.comp-segment') || button.closest('.comp-group');
    const asset = complicationVideoAssets[segmentKey(button.dataset.comp, button.dataset.segment)];
    button.disabled = !playableIn(block) && !hasProjectableComplication(asset);
    if (!button.disabled) anySegment = true;
  });
  $('btn-play').disabled = !scene;
  $('btn-stop').disabled = !scene && !playableIn(groups) && !anySegment;
}

function updateProjectionButton() {
  const hasEnvironment = currentEnvironmentAsset
    && currentEnvironmentAsset.type !== 'none'
    && assetFiles(currentEnvironmentAsset).length > 0;
  $('btn-project').disabled = !hasEnvironment;
}

function hasProjectablePatientPhoto(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  return !!file && mediaKind(asset, file) === 'image';
}

function projectionMarkup() {
  return `<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情境環境投影</title>
<style>

  #projection-complication-layer > canvas {

  #projection-controls {
    position: fixed; top: 18px; right: 18px; z-index: 4;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,.3);
    border-radius: 10px; background: rgba(0,0,0,.72);
    opacity: 1; transition: opacity .2s ease;
  }
  body.projection-idle #projection-controls { opacity: .18; }
  #projection-controls:hover, #projection-controls:focus-within { opacity: 1; }
  #projection-hint { font-size: 13px; color: rgba(255,255,255,.75); }
  #projection-fullscreen {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.55);
    border-radius: 7px; background: #fff; color: #111;
    font: 700 14px/1.2 inherit; cursor: pointer;
  }
  #projection-fullscreen:focus-visible { outline: 3px solid #ff6b3d; outline-offset: 2px; }
  @media (max-width: 640px) { #projection-hint { display: none; } }

</style>
</head>
<body>
  <main id="projection-stage" aria-label="情境環境投影"></main>
  <div id="projection-patient-layer" aria-label="病患照片疊加層"></div>
  <div id="projection-complication-layer" aria-label="突發狀況綠幕疊加層"></div>
  <div id="projection-message" role="status"></div>
  <div id="projection-controls">
    <span id="projection-hint">將視窗移至投影螢幕後，可進入全螢幕</span>
    <button id="projection-fullscreen" type="button">進入全螢幕</button>
  </div>
</body>
</html>`;
}

function maximizeProjectionWindow(win) {
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  try {
    win.moveTo(left, top);
    win.resizeTo(window.screen.availWidth, window.screen.availHeight);
  } catch {
    // 瀏覽器可能基於權限或視窗設定忽略 moveTo／resizeTo，仍可由投影視窗進入全螢幕。
  }
}

function setupProjectionWindow(win) {
  const doc = win.document;
  doc.open();
  doc.write(projectionMarkup());
  doc.close();

  const fullscreenButton = doc.getElementById('projection-fullscreen');
  const hint = doc.getElementById('projection-hint');
  const defaultHint = hint.textContent;
  let idleTimer = null;
  const revealControls = () => {
    doc.body.classList.remove('projection-idle');
    win.clearTimeout(idleTimer);
    idleTimer = win.setTimeout(() => doc.body.classList.add('projection-idle'), 3500);
  };
  const updateFullscreenLabel = () => {
    fullscreenButton.textContent = doc.fullscreenElement ? '離開全螢幕' : '進入全螢幕';
    revealControls();
  };
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (doc.fullscreenElement) {
        await doc.exitFullscreen();
      } else {
        await doc.documentElement.requestFullscreen();
      }
    } catch {
      hint.textContent = '瀏覽器未允許全螢幕，請使用瀏覽器的全螢幕功能。';
      win.setTimeout(() => { hint.textContent = defaultHint; }, 3500);
    }
  });
  doc.addEventListener('pointermove', revealControls);
  doc.addEventListener('keydown', revealControls);
  doc.addEventListener('keydown', handleFlowKey);   // 投影視窗也要能推流程
  doc.addEventListener('click', () => {
    const video = doc.querySelector('#projection-stage video');
    if (video && video.paused) video.play().catch(() => {});
  });
  doc.addEventListener('fullscreenchange', updateFullscreenLabel);
  win.addEventListener('beforeunload', () => {
    win.clearTimeout(idleTimer);
    if (projectionWindow !== win) return;
    projectionWindow = null;
    stopComplicationProjection();
    $('btn-project').textContent = '開啟投影視窗';
  });
  revealControls();
}

function showProjectionMessage(doc, text) {
  const message = doc.getElementById('projection-message');
  message.textContent = text;
  message.style.display = 'grid';
}

function renderProjectionImage(doc, files, description, missingSource) {
  const stage = doc.getElementById('projection-stage');
  const message = doc.getElementById('projection-message');
  let index = 0;

  const tryNext = () => {
    const file = files[index++];
    if (!file) {
      showProjectionMessage(doc, '找不到環境素材：' + missingSource);
      return;
    }
    const image = doc.createElement('img');
    image.src = absoluteAssetUrl(file);
    image.alt = description || '環境圖片';
    image.addEventListener('load', () => { message.style.display = 'none'; }, { once: true });
    image.addEventListener('error', tryNext, { once: true });
    stage.replaceChildren(image);
  };
  tryNext();
}

function projectionDocument() {
  if (!projectionWindow || projectionWindow.closed) return null;
  try {
    return projectionWindow.document;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
    return null;
  }
}

// 只改樣式、不重載圖片，拖滑桿時投影畫面才能即時跟著動
function applyPatientOverlayLayout() {
  const doc = projectionDocument();
  const image = doc && doc.querySelector('#projection-patient-layer > img');
  if (!image) return;
  image.style.maxWidth = patientOverlay.size + 'vw';
  image.style.maxHeight = patientOverlay.size + 'vh';
  image.style.left = patientOverlay.x + '%';
  image.style.top = patientOverlay.y + '%';
}

function renderProjectionPatient() {
  const doc = projectionDocument();
  if (!doc) return;

  const layer = doc.getElementById('projection-patient-layer');
  layer.classList.remove('visible');
  layer.replaceChildren();
  if (!patientOverlay.enabled || !hasProjectablePatientPhoto(currentPatientPhotoAsset)) return;

  const file = assetPath(currentPatientPhotoAsset, assetFiles(currentPatientPhotoAsset)[0]);
  const image = doc.createElement('img');
  image.src = absoluteAssetUrl(file);
  image.alt = currentPatientPhotoAsset.description || '病患照片';
  image.addEventListener('load', () => layer.classList.add('visible'), { once: true });
  image.addEventListener('error', () => {
    layer.classList.remove('visible');
    layer.replaceChildren();
  }, { once: true });
  layer.appendChild(image);
  applyPatientOverlayLayout();
}

// 綠幕即時去背：綠幕色取 dev.md 指定的 #00b140，比對 YCbCr 的色度距離，
// 比直接比 RGB 耐得住打光不均；容差由該組的滑桿控制。
const KEY_RGB = { r: 0, g: 177, b: 64 };
const KEY_CB = -0.169 * KEY_RGB.r - 0.331 * KEY_RGB.g + 0.5 * KEY_RGB.b;
const KEY_CR = 0.5 * KEY_RGB.r - 0.419 * KEY_RGB.g - 0.081 * KEY_RGB.b;
const KEY_SOFT_EDGE = 26;    // 容差外再往外這麼多做半透明軟邊，邊緣才不會像鋸齒
const KEY_MAX_WIDTH = 960;   // canvas 內部解析度上限，控制逐像素運算量

let chromaFrame = null;      // { win, id }：進行中的 requestAnimationFrame
let chromaRedraw = null;     // 暫停預覽時，改滑桿要重畫一次
let chromaToken = 0;         // 換素材後，舊 video 的事件不該再影響新的
let complicationPreviewing = false;

function chromaKeyFrame(ctx, video, width, height, tolerance) {
  ctx.drawImage(video, 0, 0, width, height);
  const frame = ctx.getImageData(0, 0, width, height);
  const data = frame.data;
  const near = tolerance * tolerance;
  const far = (tolerance + KEY_SOFT_EDGE) * (tolerance + KEY_SOFT_EDGE);
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const dcb = (-0.169 * r - 0.331 * g + 0.5 * b) - KEY_CB;
    const dcr = (0.5 * r - 0.419 * g - 0.081 * b) - KEY_CR;
    const dist = dcb * dcb + dcr * dcr;
    if (dist >= far) continue;
    data[i + 3] = dist <= near
      ? 0
      : Math.round(255 * (Math.sqrt(dist) - tolerance) / KEY_SOFT_EDGE);
    // 抑制人物邊緣殘留的綠光
    const limit = (r + b) / 2;
    if (g > limit) data[i + 1] = limit;
  }
  ctx.putImageData(frame, 0, 0);
}

function cancelChromaLoop() {
  if (!chromaFrame) return;
  try { chromaFrame.win.cancelAnimationFrame(chromaFrame.id); } catch { /* 視窗已關閉 */ }
  chromaFrame = null;
}

// 只改樣式、不重載影片，拖滑桿時投影畫面才能即時跟著動
function applyComplicationOverlayLayout() {
  const doc = projectionDocument();
  const canvas = doc && doc.querySelector('#projection-complication-layer > canvas');
  if (!canvas || !activeComplication) return;
  const layout = complicationOverlay(activeComplication);
  canvas.style.maxWidth = layout.size + 'vw';
  canvas.style.maxHeight = layout.size + 'vh';
  canvas.style.left = layout.x + '%';
  canvas.style.top = layout.y + '%';
}

function stopComplicationProjection() {
  cancelChromaLoop();
  chromaToken++;
  chromaRedraw = null;
  activeComplication = null;
  activeSegment = null;
  complicationPreviewing = false;
  const doc = projectionDocument();
  if (doc) {
    const layer = doc.getElementById('projection-complication-layer');
    layer.classList.remove('visible');
    layer.querySelectorAll('video').forEach(video => {
      video.pause();
      video.removeAttribute('src');
      video.load();
    });
    layer.replaceChildren();
  }
  refreshComplicationPreviewButtons();
}

// 綠幕素材可以是影片，也可以是一張綠幕劇照
function hasProjectableComplication(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  if (!file) return false;
  return ['video', 'image'].includes(mediaKind(asset, file));
}

// 疊上去一律先停在第一格；mode 'play' 接著播一次並停在最後一格，'preview' 就停著不動。
// 兩種都不會自己消失，要收掉請按停止。
function startComplicationProjection(comp, segment, mode) {
  const asset = complicationVideoAssets[segmentKey(comp, segment)];
  if (!hasProjectableComplication(asset)) return false;
  const doc = projectionDocument();
  if (!doc) {
    setStatus('請先按「開啟投影視窗」，綠幕人物才有地方疊上去。', true);
    return false;
  }

  stopComplicationProjection();
  const token = ++chromaToken;
  const stale = () => token !== chromaToken;
  activeComplication = comp;
  activeSegment = segment;
  complicationPreviewing = mode === 'preview';

  const layer = doc.getElementById('projection-complication-layer');
  const canvas = doc.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  layer.appendChild(canvas);

  const file = assetPath(asset, assetFiles(asset)[0]);
  const url = absoluteAssetUrl(file);
  const fail = () => {
    if (stale()) return;
    stopComplicationProjection();
    setStatus('投影視窗載不到綠幕素材：' + file, true);
  };
  // 依素材原始比例決定 canvas，寬度上限控制逐像素運算量
  const mount = (source, sourceWidth, sourceHeight) => {
    const width = Math.min(sourceWidth || KEY_MAX_WIDTH, KEY_MAX_WIDTH);
    const ratio = sourceWidth && sourceHeight ? sourceHeight / sourceWidth : 9 / 16;
    canvas.width = width;
    canvas.height = Math.max(1, Math.round(width * ratio));
    applyComplicationOverlayLayout();
    layer.classList.add('visible');
    chromaRedraw = () => chromaKeyFrame(ctx, source, canvas.width, canvas.height,
      complicationOverlay(comp).tolerance);
  };

  if (mediaKind(asset, file) === 'image') {
    const image = doc.createElement('img');
    image.src = url;
    image.addEventListener('load', () => {
      if (stale()) return;
      mount(image, image.naturalWidth, image.naturalHeight);
      chromaRedraw();
    }, { once: true });
    image.addEventListener('error', fail, { once: true });
    layer.appendChild(image);
  } else {
    const video = doc.createElement('video');
    video.src = url;
    video.muted = true;          // 聲音走控制台那張卡，投影只要畫面
    video.playsInline = true;
    video.loop = false;
    layer.appendChild(video);

    const loop = () => {
      if (stale()) return;
      if (!projectionWindow || projectionWindow.closed) { chromaFrame = null; return; }
      chromaRedraw();
      if (video.paused || video.ended) { chromaFrame = null; return; }
      chromaFrame = { win: projectionWindow, id: projectionWindow.requestAnimationFrame(loop) };
    };

    video.addEventListener('loadeddata', () => {
      if (stale()) return;
      mount(video, video.videoWidth, video.videoHeight);
      chromaRedraw();               // 先畫出第一格，之後才決定要不要開始播
      if (mode !== 'preview') {
        video.play().then(loop).catch(() => {});
        return;
      }
      // 影片在還沒播過之前，瀏覽器不一定會把第一格交給 canvas，
      // 所以預覽時先播一下再倒回開頭停住，才保證畫得出東西。
      video.play().then(() => {
        if (stale()) return;
        video.pause();
        chromaRedraw();
        video.currentTime = 0;
      }).catch(() => {});
    }, { once: true });
    video.addEventListener('seeked', () => { if (!stale() && video.paused) chromaRedraw(); });
    // 播完停在最後一格，不自動退場；要收掉請按停止
    video.addEventListener('ended', () => { if (!stale()) chromaRedraw(); });
    video.addEventListener('error', fail, { once: true });
  }

  refreshComplicationPreviewButtons();
  return true;
}

function renderProjectionAsset(asset) {
  const doc = projectionDocument();
  if (!doc) return;

  const file = assetPath(asset, assetFiles(asset)[0]);
  const type = mediaKind(asset, file);
  doc.title = asset.description ? `情境環境投影｜${asset.description}` : '情境環境投影';
  doc.getElementById('projection-message').style.display = 'none';

  if (type === 'image') {
    renderProjectionImage(doc, [file], asset.description, file);
    return;
  }
  if (type !== 'video') {
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這筆環境素材不是可投影的影片或圖片。');
    return;
  }

  const video = doc.createElement('video');
  video.src = absoluteAssetUrl(file);
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('aria-label', asset.description || '環境影片');
  video.addEventListener('playing', () => {
    doc.getElementById('projection-message').style.display = 'none';
  });
  video.addEventListener('error', () => {
    const fallbacks = fallbackFiles(asset);
    if (fallbacks.length) {
      renderProjectionImage(doc, fallbacks, asset.description, file + '（圖片 fallback 也無法載入）');
    } else {
      doc.getElementById('projection-stage').replaceChildren();
      showProjectionMessage(doc, '找不到環境影片：' + file);
    }
  }, { once: true });
  doc.getElementById('projection-stage').replaceChildren(video);
  video.play().catch(() => {
    showProjectionMessage(doc, '瀏覽器阻擋自動播放，請點一下「進入全螢幕」後再播放。');
  });
}

function renderProjectionScene() {
  if (!projectionWindow || projectionWindow.closed) return;
  if (currentEnvironmentAsset) {
    renderProjectionAsset(currentEnvironmentAsset);
  } else {
    const doc = projectionWindow.document;
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這個情境沒有可投影的環境素材。');
  }
  renderProjectionPatient();
}

function openProjection() {
  if (!currentEnvironmentAsset) return;
  if (projectionWindow && !projectionWindow.closed) {
    projectionWindow.focus();
    renderProjectionScene();
    return;
  }

  const width = Math.max(640, window.screen.availWidth || 1280);
  const height = Math.max(480, window.screen.availHeight || 720);
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  const features = `popup=yes,width=${width},height=${height},left=${left},top=${top}`;
  const win = window.open('', 'scene-player-projection', features);
  if (!win) {
    setStatus('無法開啟投影視窗，請允許此網站顯示彈出式視窗後再試一次。', true);
    return;
  }

  projectionWindow = win;
  setupProjectionWindow(win);
  maximizeProjectionWindow(win);
  win.focus();
  $('btn-project').textContent = '聚焦投影視窗';
  renderProjectionScene();
}

function playProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.currentTime = 0;
    video.play().catch(() => {});
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
  }
}

function stopProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.pause();
    video.currentTime = 0;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
  }
}

function disposeMediaSources() {
  mediaLoadControllers.forEach(controller => controller.abort());
  mediaLoadControllers.clear();
  mediaObjectUrls.forEach(url => URL.revokeObjectURL(url));
  mediaObjectUrls.clear();
}

async function loadSeekableAudio(el, file) {
  const controller = new AbortController();
  mediaLoadControllers.add(controller);
  try {
    const response = await fetch(file, { signal: controller.signal });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const blob = await response.blob();
    if (!el.isConnected) return;
    const url = URL.createObjectURL(blob);
    mediaObjectUrls.add(url);
    el.src = url;
    el.load();
    updatePlaybackButtons();
  } catch (err) {
    if (err.name === 'AbortError' || !el.isConnected) return;
    // 外部音檔若因 CORS 無法 fetch，仍退回原始網址播放。
    el.src = file;
    updatePlaybackButtons();
  } finally {
    mediaLoadControllers.delete(controller);
  }
}

function mediaForFile(asset, sourceFile) {
  const file = assetPath(asset, sourceFile);
  const type = mediaKind(asset, file);
  if (type === 'image') return imageMedia(file, asset.description);

  const el = document.createElement(type === 'video' ? 'video' : 'audio');
  el.controls = true;
  el.loop = asset.role === 'ambient_sound';
  if (type === 'audio') {
    loadSeekableAudio(el, file);
  } else {
    el.src = file;
  }
  el.addEventListener('error', () => {
    const fallbacks = type === 'video' ? fallbackFiles(asset) : [];
    if (!fallbacks.length) {
      el.replaceWith(missingMedia(file));
      updatePlaybackButtons();
      return;
    }

    let index = 0;
    const tryNextImage = () => {
      const file = fallbacks[index++];
      if (!file) return missingMedia(assetPath(asset) + '（圖片 fallback 也無法載入）');
      const wrapper = document.createElement('div');
      wrapper.className = 'fallback-media';
      const note = document.createElement('div');
      note.className = 'fallback-note';
      note.textContent = '影片無法載入，已改用圖片：' + file;
      wrapper.append(note, imageMedia(file, asset.description, tryNextImage));
      return wrapper;
    };
    el.replaceWith(tryNextImage());
    updatePlaybackButtons();
  }, { once: true });
  return el;
}

function mediaFor(asset) {
  // type: none = 該情境刻意沒有這個素材（例如住宅 OHCA 沒有環境聲音）
  const files = assetFiles(asset);
  if (asset.type === 'none' || !files.length) {
    const note = document.createElement('div');
    note.className = 'none-note';
    note.textContent = '此情境無此素材';
    return note;
  }
  if (files.length === 1) return mediaForFile(asset, files[0]);

  const options = document.createElement('div');
  options.className = 'media-options';
  files.forEach((file, index) => {
    const option = document.createElement('div');
    option.className = 'media-option';
    const label = document.createElement('div');
    label.className = 'media-option-label';
    label.textContent = `版本 ${index + 1}：${file}`;
    const media = mediaForFile(asset, file);
    if (media.tagName === 'AUDIO' || media.tagName === 'VIDEO') {
      media.addEventListener('play', () => {
        options.querySelectorAll('audio, video').forEach(other => {
          if (other !== media) other.pause();
        });
        options.querySelectorAll('.media-option').forEach(item => item.classList.remove('selected'));
        option.classList.add('selected');
      });
    }
    option.append(label, media);
    options.appendChild(option);
  });
  return options;
}

// clipboard API 在部分環境（非 https、權限未給）會失敗，退回 execCommand，再不行就幫使用者選取
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch { /* 往下試 execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

function selectNode(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// 配音 prompt（ElevenLabs Eleven v3），收在 <details> 裡，需要重新生成配音時展開複製
function ttsBlock(tts) {
  const box = document.createElement('details');
  box.className = 'tts';
  const sum = document.createElement('summary');
  sum.textContent = `${tts.model || 'TTS'} 配音 prompt`;
  box.appendChild(sum);

  for (const [key, label] of [['voice', 'voice'], ['settings', 'settings']]) {
    if (!tts[key]) continue;
    const row = document.createElement('div');
    row.className = 'tts-meta';
    row.textContent = `${label}：${tts[key]}`;
    box.appendChild(row);
  }
  const pre = document.createElement('pre');
  pre.textContent = (tts.prompt || '').trim();
  box.appendChild(pre);

  const btn = document.createElement('button');
  btn.className = 'copy';
  btn.textContent = '複製 prompt';
  btn.addEventListener('click', async () => {
    btn.textContent = (await copyText(pre.textContent)) ? '已複製' : '複製失敗，已幫你選取，按 Ctrl+C';
    if (btn.textContent !== '已複製') selectNode(pre);
    setTimeout(() => { btn.textContent = '複製 prompt'; }, 2500);
  });
  box.appendChild(btn);
  return box;
}

// 疊加開關與大小／位置滑桿，掛在病患照片卡內；設定值存在 patientOverlay，重新產生後沿用
// 病患照片與綠幕人物共用的滑桿列；sync() 讓「重設版面」能把滑桿一起拉回去
// doc 參數保留：把面板長到另一個 document（例如之後要再放回投影視窗）時，
// 跨 document 的節點不能直接 append（要先 importNode），從源頭建對比較不會出錯。
function overlaySliderRows(state, specs, ariaPrefix, onChange, doc = document) {
  const wrap = doc.createElement('div');
  wrap.className = 'overlay-sliders';
  const rows = {};
  const text = ({ key, unit }) => state[key] + (unit === undefined ? '%' : unit);
  for (const spec of specs) {
    const { key, label, min, max } = spec;
    const row = doc.createElement('div');
    row.className = 'overlay-slider';
    const name = doc.createElement('span');
    name.textContent = label;
    const input = Object.assign(doc.createElement('input'),
      { type: 'range', min, max, step: 1, value: state[key] });
    input.setAttribute('aria-label', ariaPrefix + label);
    const value = doc.createElement('output');
    value.textContent = text(spec);
    input.addEventListener('input', () => {
      state[key] = Number(input.value);
      value.textContent = text(spec);
      onChange();
    });
    rows[key] = { input, value };
    row.append(name, input, value);
    wrap.appendChild(row);
  }
  return {
    node: wrap,
    sync() {
      for (const spec of specs) {
        rows[spec.key].input.value = state[spec.key];
        rows[spec.key].value.textContent = text(spec);
      }
    },
  };
}

function overlayFoot(hintText, reset, extraButton, doc = document) {
  const foot = doc.createElement('div');
  foot.className = 'overlay-foot';
  const hint = doc.createElement('span');
  hint.className = 'overlay-hint';
  hint.textContent = hintText;
  const buttons = doc.createElement('span');
  buttons.className = 'overlay-buttons';
  if (extraButton) buttons.appendChild(extraButton);
  buttons.appendChild(reset);
  foot.append(hint, buttons);
  return foot;
}

function patientOverlayControls(doc = document, hintText = layoutHint()) {
  const box = doc.createElement('div');
  box.className = 'overlay-controls';

  const toggle = doc.createElement('label');
  toggle.className = 'overlay-toggle';
  const checkbox = Object.assign(doc.createElement('input'),
    { type: 'checkbox', checked: patientOverlay.enabled });
  checkbox.addEventListener('change', () => {
    patientOverlay.enabled = checkbox.checked;
    // 載入情境時，「要不要疊病患」就是「這頁有沒有 patient 圖層」，
    // 不另外存一個開關狀態——兩份真相遲早對不起來
    const slide = currentSlide();
    if (currentScenario && slide) {
      const editingBefore = editingSlideId;
      editingSlideId = slide.id;
      if (checkbox.checked) addLayer('patient'); else removeLayer('patient');
      editingSlideId = editingBefore;
    }
    renderProjectionPatient();
    syncPatientOverlayBoxes();
  });
  toggle.append(checkbox, doc.createTextNode('疊加到投影視窗'));
  box.appendChild(toggle);

  const applyChange = () => {
    applyPatientOverlayLayout();
    syncPatientOverlayBoxes();
    updatePreviewLayout();
    persistLayerLayout('patient');
  };
  const sliders = overlaySliderRows(patientOverlay, PATIENT_OVERLAY_SLIDERS, '病患照片', applyChange, doc);
  box.appendChild(sliders.node);
  patientOverlayBoxes.push({ sync: sliders.sync, enabled: checkbox });

  const reset = Object.assign(doc.createElement('button'),
    { className: 'reset', type: 'button', textContent: '重設版面' });
  reset.addEventListener('click', () => {
    Object.assign(patientOverlay, PATIENT_OVERLAY_DEFAULTS);
    applyChange();
  });
  box.appendChild(overlayFoot(hintText, reset, null, doc));
  return box;
}

function refreshComplicationPreviewButtons() {
  document.querySelectorAll('#comp-groups button.preview').forEach(button => {
    const on = complicationPreviewing
      && button.dataset.comp === activeComplication
      && Number(button.dataset.segment) === activeSegment;
    button.textContent = on ? '結束預覽' : '預覽定位';
    button.classList.toggle('on', on);
  });
}

function complicationOverlayControls(comp, segment, playLabel, shared) {
  const layout = complicationOverlay(comp);
  const box = document.createElement('div');
  box.className = 'overlay-controls';
  const isPreviewingThis = () => complicationPreviewing
    && activeComplication === comp && activeSegment === segment;
  // 版面是整組共用的，所以投影上只要是同一個突發狀況，改滑桿就要跟著重畫
  const redrawIfPaused = () => {
    if (chromaRedraw && !chromaFrame && activeComplication === comp) chromaRedraw();
  };
  const applyChange = () => {
    applyComplicationOverlayLayout();
    redrawIfPaused();   // 暫停的畫面沒有 rAF 在跑，要自己重畫一幀
    syncComplicationOverlayBoxes(comp);
    updatePreviewLayout();
    persistLayerLayout('greenscreen', comp);
  };

  const sliders = overlaySliderRows(layout, COMP_OVERLAY_SLIDERS, `${comp}綠幕`, applyChange);
  box.appendChild(sliders.node);
  complicationOverlayBoxes.push({ comp, sync: sliders.sync });

  const preview = Object.assign(document.createElement('button'),
    { className: 'reset preview', type: 'button', textContent: '預覽定位' });
  preview.dataset.comp = comp;
  preview.dataset.segment = segment;
  preview.addEventListener('click', () => {
    if (isPreviewingThis()) stopComplicationProjection();
    else startComplicationProjection(comp, segment, 'preview');
  });

  const reset = Object.assign(document.createElement('button'),
    { className: 'reset', type: 'button', textContent: '重設版面' });
  reset.addEventListener('click', () => {
    Object.assign(layout, COMP_OVERLAY_DEFAULTS);
    applyChange();
  });

  const hint = `預覽定位＝疊上投影停在第一格；「${playLabel}」演完停在最後一格，按停止才收掉。`
    + layoutHint();
  box.appendChild(overlayFoot(hint, reset, preview));
  return box;
}
