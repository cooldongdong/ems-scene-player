  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="${SPEAKER_PATH}" fill="currentColor" stroke="none"/>${waves}</svg>`;
}

// el 省略＝套用到池裡全部；給了 el 就只套那一顆（新建時用）
function applyVolume(el) {
  const value = audioMuted ? 0 : masterVolume / 100;
  const targets = el ? [el] : $('media-pool').querySelectorAll('audio, video');
  targets.forEach(m => { m.volume = value; m.muted = audioMuted; });
}

function renderVolumeControl() {
  const btn = $('btn-mute');
  btn.innerHTML = speakerIcon(masterVolume, audioMuted || masterVolume === 0);
  btn.setAttribute('aria-pressed', String(audioMuted));
  btn.title = audioMuted ? '已靜音——按一下恢復' : `音量 ${masterVolume}%（按一下靜音）`;
  // 靜音時滑桿掉到最底，取消靜音自己回到原位。
  // **不需要記住「靜音前是多少」**——masterVolume 從頭到尾沒被改過，
  // 被靜音蓋掉的只有「顯示值」。多存一個 volumeBeforeMute 就是多一份會走鐘的狀態。
  const shown = audioMuted ? 0 : masterVolume;
  const slider = $('volume-slider');
  slider.value = String(shown);
  // --fill 掛在最外層：畫線的是 .volume-panel::before，不是 input，
  // 設在 input 上的話那個偽元素看不到（自訂屬性只往下繼承）
  $('volume-control').style.setProperty('--fill', shown + '%');
}

function setVolume(value) {
  masterVolume = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  localStorage.setItem(VOLUME_KEY, String(masterVolume));
  // 拉動滑桿等於「我要聽見」，所以順手解除靜音——不然拉半天沒聲音
  if (masterVolume > 0) audioMuted = false;
  applyVolume();
  renderVolumeControl();
}

function toggleMute() {
  audioMuted = !audioMuted;
  applyVolume();
  renderVolumeControl();
}

function absoluteAssetUrl(file) {
  try {
    return new URL(file, document.baseURI).href;
  } catch {
    return file;
  }
}

// 主控列的兩顆。狀態一律由媒體池決定，不再問畫面上有沒有卡片——
// 池是在 pickAssets() 裡同步建好的，所以這裡不需要等任何非同步載入。
function updateStageButtons() {
  const btn = $('btn-play');
  const has = poolBase.size > 0;
  btn.disabled = !has;
  const on = has && ambiencePlaying();
  btn.textContent = on ? '停止環境音' : '播放環境音';
  btn.classList.toggle('on', on);
  btn.title = has ? '' : '這個情境沒有環境聲音素材';
}

function updateProjectionButton() {
  const hasEnvironment = currentEnvironmentAsset
    && currentEnvironmentAsset.type !== 'none'
    && assetFiles(currentEnvironmentAsset).length > 0;
  $('btn-project').disabled = !hasEnvironment;
}

function hasProjectablePatientPhoto(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  return !!file && mediaKind(asset, file) === 'image';
}

function projectionMarkup() {
  return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情境環境投影</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  body {
    color: #fff;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  #projection-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  /* 場景的框由 Scenarios.sceneBoxStyle() 以百分比寫在 style 上，與預覽共用同一份
     換算（COO-104）。以前這裡是 object-fit:cover 寫死——在 270° 的超寬視窗上，
     cover 會把 1.833:1 的素材撐到三倍高，只剩中間一條看得見。 */
  #projection-stage > img, #projection-stage > video {
    position: absolute; display: block; border: 0;
    object-fit: fill;
    background: #000;
  }
  #projection-patient-layer {
    position: fixed; inset: 0; z-index: 1;
    display: none; pointer-events: none;
  }
  #projection-patient-layer.visible { display: block; }
  /* 大小與位置由主畫面的滑桿以 inline style 寫入 max-width／max-height／left／top */
  #projection-patient-layer > img {
    position: absolute; display: block;
    width: auto; height: auto; object-fit: contain;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.4));
  }
  /* 綠幕人物站在病患之上；canvas 由主畫面逐幀去背後畫進來 */
  #projection-complication-layer {
    position: fixed; inset: 0; z-index: 2;
    display: none; pointer-events: none;
  }
  #projection-complication-layer.visible { display: block; }
  #projection-complication-layer > video, #projection-complication-layer > img { display: none; }
  #projection-complication-layer > canvas {
    position: absolute; display: block;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.4));
  }
  /* 說明文字圖層。定位模型與預覽共用 Scenarios.textBoxStyle()：
     x/y 是文字方塊的中心點，size/10 是字級佔畫面寬度的百分比。
     **不要和下面的 #projection-message 合用同一個元素**——那顆是全螢幕黑底告示，
     兩者擠在一起就得靠 inline style 互相蓋來蓋去，投影位置也就是那樣歪掉的。 */
  #projection-text {
    position: absolute; z-index: 3; display: none;
    transform: translate(-50%, -50%); max-width: 90%;
    color: #fff; font-weight: 700; line-height: 1.3; text-align: center;
    white-space: pre-wrap; text-shadow: 0 2px 6px rgba(0,0,0,.85);
  }
  /* 素材找不到、瀏覽器擋自動播放這類告示：整面蓋掉，不是圖層 */
  #projection-message {
    position: absolute; inset: 0; z-index: 3; display: none; place-items: center;
    padding: 32px; background: #000; color: #fff; text-align: center;
    font-size: clamp(18px, 2.4vw, 32px);
  }
  #projection-controls {
    position: fixed; top: 18px; right: 18px; z-index: 4;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,.3);
    border-radius: 10px; background: rgba(0,0,0,.72);
    opacity: 1; transition: opacity .2s ease;
  }
  body.projection-idle #projection-controls { opacity: .18; }
  #projection-controls:hover, #projection-controls:focus-within { opacity: 1; }
  #projection-hint { font-size: 13px; color: rgba(255,255,255,.75); }
  #projection-fullscreen {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.55);
    border-radius: 7px; background: #fff; color: #111;
    font: 700 14px/1.2 inherit; cursor: pointer;
  }
  #projection-fullscreen:focus-visible { outline: 3px solid #ff6b3d; outline-offset: 2px; }
  @media (max-width: 640px) { #projection-hint { display: none; } }

</style>
</head>
<body>
  <main id="projection-stage" aria-label="情境環境投影"></main>
  <div id="projection-patient-layer" aria-label="病患照片疊加層"></div>
  <div id="projection-complication-layer" aria-label="突發狀況綠幕疊加層"></div>
  <div id="projection-text" aria-label="說明文字疊加層"></div>
  <div id="projection-message" role="status"></div>
  <div id="projection-controls">
    <span id="projection-hint">將視窗移至投影螢幕後，可進入全螢幕</span>
    <button id="projection-fullscreen" type="button">進入全螢幕</button>
  </div>
</body>
</html>`;
}

function maximizeProjectionWindow(win) {
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  try {
    win.moveTo(left, top);
    win.resizeTo(window.screen.availWidth, window.screen.availHeight);
  } catch {
    // 瀏覽器可能基於權限或視窗設定忽略 moveTo／resizeTo，仍可由投影視窗進入全螢幕。
  }
}

function setupProjectionWindow(win) {
  const doc = win.document;
  doc.open();
  doc.write(projectionMarkup());
  doc.close();

  const fullscreenButton = doc.getElementById('projection-fullscreen');
  const hint = doc.getElementById('projection-hint');
  const defaultHint = hint.textContent;
  let idleTimer = null;
  const revealControls = () => {
    doc.body.classList.remove('projection-idle');
    win.clearTimeout(idleTimer);
    idleTimer = win.setTimeout(() => doc.body.classList.add('projection-idle'), 3500);
  };
  const updateFullscreenLabel = () => {
    fullscreenButton.textContent = doc.fullscreenElement ? '離開全螢幕' : '進入全螢幕';
    revealControls();
  };
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (doc.fullscreenElement) {
        await doc.exitFullscreen();
      } else {
        await doc.documentElement.requestFullscreen();
      }
    } catch {
      hint.textContent = '瀏覽器未允許全螢幕，請使用瀏覽器的全螢幕功能。';
      win.setTimeout(() => { hint.textContent = defaultHint; }, 3500);
    }
  });
  doc.addEventListener('pointermove', revealControls);
  doc.addEventListener('keydown', revealControls);
  doc.addEventListener('keydown', handleFlowKey);   // 投影視窗也要能推流程
  doc.addEventListener('click', () => {
    const video = doc.querySelector('#projection-stage video');
    if (video && video.paused) video.play().catch(() => {});
  });
  doc.addEventListener('fullscreenchange', updateFullscreenLabel);
  win.addEventListener('beforeunload', () => {
    win.clearTimeout(idleTimer);
    if (projectionWindow !== win) return;
    projectionWindow = null;
    stopComplicationProjection();
    $('btn-project').textContent = '開始投影';
  });
  revealControls();
}

function showProjectionMessage(doc, text) {
  const message = doc.getElementById('projection-message');
  message.textContent = text;
  message.style.display = 'grid';
}

function renderProjectionImage(doc, files, description, missingSource) {
  const stage = doc.getElementById('projection-stage');
  const message = doc.getElementById('projection-message');
  let index = 0;

  const tryNext = () => {
    const file = files[index++];
    if (!file) {
      showProjectionMessage(doc, '找不到環境素材：' + missingSource);
      return;
    }
    const image = doc.createElement('img');
    image.src = absoluteAssetUrl(file);
    image.alt = description || '環境圖片';
    image.addEventListener('load', () => { message.style.display = 'none'; }, { once: true });
    image.addEventListener('error', tryNext, { once: true });
    stage.replaceChildren(image);
  };
  tryNext();
}

function projectionDocument() {
  if (!projectionWindow || projectionWindow.closed) return null;
  try {
    return projectionWindow.document;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開始投影';
    return null;
  }
}

// 只改樣式、不重載圖片，拖滑桿時投影畫面才能即時跟著動
function applyPatientOverlayLayout() {
  const doc = projectionDocument();
  const image = doc && doc.querySelector('#projection-patient-layer > img');
  if (!image) return;
  image.style.maxWidth = patientOverlay.size + 'vw';
  image.style.maxHeight = patientOverlay.size + 'vh';
  image.style.left = patientOverlay.x + '%';
  image.style.top = patientOverlay.y + '%';
}

function renderProjectionPatient() {
  const doc = projectionDocument();
  if (!doc) return;

  const layer = doc.getElementById('projection-patient-layer');
  layer.classList.remove('visible');
  layer.replaceChildren();
  // **隱藏必須同時作用在預覽與投影。** 只做預覽的話，教官會以為東西藏起來了，
  // 學員那面大螢幕上它還在——那比沒有這個功能更糟。
  const patientLayer = Scenarios.layerOf(currentSlide(), 'patient');
  if (!Scenarios.layerVisible(patientLayer)) return;
  if (!patientOverlay.enabled || !hasProjectablePatientPhoto(currentPatientPhotoAsset)) return;

  const file = assetPath(currentPatientPhotoAsset, assetFiles(currentPatientPhotoAsset)[0]);
  const image = doc.createElement('img');
  image.src = absoluteAssetUrl(file);
  image.alt = currentPatientPhotoAsset.description || '病患照片';
  image.addEventListener('load', () => layer.classList.add('visible'), { once: true });
  image.addEventListener('error', () => {
    layer.classList.remove('visible');
    layer.replaceChildren();
  }, { once: true });
  layer.appendChild(image);
  applyPatientOverlayLayout();
}

// 綠幕即時去背：綠幕色取 dev.md 指定的 #00b140，比對 YCbCr 的色度距離，
// 比直接比 RGB 耐得住打光不均；容差由該組的滑桿控制。
const KEY_RGB = { r: 0, g: 177, b: 64 };
const KEY_CB = -0.169 * KEY_RGB.r - 0.331 * KEY_RGB.g + 0.5 * KEY_RGB.b;
const KEY_CR = 0.5 * KEY_RGB.r - 0.419 * KEY_RGB.g - 0.081 * KEY_RGB.b;
const KEY_SOFT_EDGE = 26;    // 容差外再往外這麼多做半透明軟邊，邊緣才不會像鋸齒
const KEY_MAX_WIDTH = 960;   // canvas 內部解析度上限，控制逐像素運算量

let chromaFrame = null;      // { win, id }：進行中的 requestAnimationFrame
let chromaRedraw = null;     // 暫停預覽時，改滑桿要重畫一次
let chromaToken = 0;         // 換素材後，舊 video 的事件不該再影響新的
let complicationPreviewing = false;

function chromaKeyFrame(ctx, video, width, height, tolerance) {
  ctx.drawImage(video, 0, 0, width, height);
  const frame = ctx.getImageData(0, 0, width, height);
  const data = frame.data;
  const near = tolerance * tolerance;
  const far = (tolerance + KEY_SOFT_EDGE) * (tolerance + KEY_SOFT_EDGE);
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const dcb = (-0.169 * r - 0.331 * g + 0.5 * b) - KEY_CB;
    const dcr = (0.5 * r - 0.419 * g - 0.081 * b) - KEY_CR;
    const dist = dcb * dcb + dcr * dcr;
    if (dist >= far) continue;
    data[i + 3] = dist <= near
      ? 0
      : Math.round(255 * (Math.sqrt(dist) - tolerance) / KEY_SOFT_EDGE);
    // 抑制人物邊緣殘留的綠光
    const limit = (r + b) / 2;
    if (g > limit) data[i + 1] = limit;
  }
  ctx.putImageData(frame, 0, 0);
}

function cancelChromaLoop() {
  if (!chromaFrame) return;
  try { chromaFrame.win.cancelAnimationFrame(chromaFrame.id); } catch { /* 視窗已關閉 */ }
  chromaFrame = null;
}

// 只改樣式、不重載影片，拖滑桿時投影畫面才能即時跟著動
function applyComplicationOverlayLayout() {
  const doc = projectionDocument();
  const canvas = doc && doc.querySelector('#projection-complication-layer > canvas');
  if (!canvas || !activeComplication) return;
  const layout = complicationOverlay(activeComplication);
  canvas.style.maxWidth = layout.size + 'vw';
  canvas.style.maxHeight = layout.size + 'vh';
  canvas.style.left = layout.x + '%';
  canvas.style.top = layout.y + '%';
}

function stopComplicationProjection() {
  cancelChromaLoop();
  chromaToken++;
  chromaRedraw = null;
  activeComplication = null;
  activeSegment = null;
  complicationPreviewing = false;
  const doc = projectionDocument();
  if (doc) {
    const layer = doc.getElementById('projection-complication-layer');
    layer.classList.remove('visible');
    layer.querySelectorAll('video').forEach(video => {
      video.pause();
      video.removeAttribute('src');
      video.load();
    });
    layer.replaceChildren();
  }
}

// 綠幕素材可以是影片，也可以是一張綠幕劇照
function hasProjectableComplication(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  if (!file) return false;
  return ['video', 'image'].includes(mediaKind(asset, file));
}

// 疊上去一律先停在第一格；mode 'play' 接著播一次並停在最後一格，'preview' 就停著不動。
// 兩種都不會自己消失，要收掉請按停止。
function startComplicationProjection(comp, segment, mode) {
  // 這一頁把突發狀況藏起來了就不要疊上去——隱藏要對投影一樣有效
  if (!Scenarios.layerVisible(Scenarios.layerOf(currentSlide(), 'greenscreen'))) return false;
  const asset = complicationVideoAssets[segmentKey(comp, segment)];
  if (!hasProjectableComplication(asset)) return false;
  const doc = projectionDocument();
  if (!doc) {
    // 編輯時沒開投影是正常狀態：位置照樣能調（預覽的去背是自己畫的，不經過投影視窗），
    // 每翻一頁罵一次只會讓人以為被擋住了。真正要上課時才需要這句提醒。
    if (panelLevel !== 'edit') setStatus('請先按「開始投影」，綠幕人物才有地方疊上去。', true);
    return false;
  }

  stopComplicationProjection();
  const token = ++chromaToken;
  const stale = () => token !== chromaToken;
  activeComplication = comp;
  activeSegment = segment;
  complicationPreviewing = mode === 'preview';

  const layer = doc.getElementById('projection-complication-layer');
  const canvas = doc.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  layer.appendChild(canvas);

  const file = assetPath(asset, assetFiles(asset)[0]);
  const url = absoluteAssetUrl(file);
  const fail = () => {
    if (stale()) return;
    stopComplicationProjection();
    setStatus('投影視窗載不到綠幕素材：' + file, true);
  };
  // 依素材原始比例決定 canvas，寬度上限控制逐像素運算量
  const mount = (source, sourceWidth, sourceHeight) => {
    const width = Math.min(sourceWidth || KEY_MAX_WIDTH, KEY_MAX_WIDTH);
    const ratio = sourceWidth && sourceHeight ? sourceHeight / sourceWidth : 9 / 16;
    canvas.width = width;
    canvas.height = Math.max(1, Math.round(width * ratio));
    applyComplicationOverlayLayout();
    layer.classList.add('visible');
    chromaRedraw = () => chromaKeyFrame(ctx, source, canvas.width, canvas.height,
      complicationOverlay(comp).tolerance);
  };

  if (mediaKind(asset, file) === 'image') {
    const image = doc.createElement('img');
    image.src = url;
    image.addEventListener('load', () => {
      if (stale()) return;
      mount(image, image.naturalWidth, image.naturalHeight);
      chromaRedraw();
    }, { once: true });
    image.addEventListener('error', fail, { once: true });
    layer.appendChild(image);
  } else {
    const video = doc.createElement('video');
    video.src = url;
    video.muted = true;          // 聲音走控制台那張卡，投影只要畫面
    video.playsInline = true;
    video.loop = false;
    layer.appendChild(video);

    const loop = () => {
      if (stale()) return;
      if (!projectionWindow || projectionWindow.closed) { chromaFrame = null; return; }
      chromaRedraw();
      if (video.paused || video.ended) { chromaFrame = null; return; }
      chromaFrame = { win: projectionWindow, id: projectionWindow.requestAnimationFrame(loop) };
    };

    video.addEventListener('loadeddata', () => {
      if (stale()) return;
      mount(video, video.videoWidth, video.videoHeight);
      chromaRedraw();               // 先畫出第一格，之後才決定要不要開始播
      if (mode !== 'preview') {
        video.play().then(loop).catch(() => {});
        return;
      }
      // 影片在還沒播過之前，瀏覽器不一定會把第一格交給 canvas，
      // 所以預覽時先播一下再倒回開頭停住，才保證畫得出東西。
      video.play().then(() => {
        if (stale()) return;
        video.pause();
        chromaRedraw();
        video.currentTime = 0;
      }).catch(() => {});
    }, { once: true });
    video.addEventListener('seeked', () => { if (!stale() && video.paused) chromaRedraw(); });
    // 播完停在最後一格，不自動退場；要收掉請按停止
    video.addEventListener('ended', () => { if (!stale()) chromaRedraw(); });
    video.addEventListener('error', fail, { once: true });
  }

  return true;
}

function renderProjectionAsset(asset) {
  const doc = projectionDocument();
  if (!doc) return;

  const file = assetPath(asset, assetFiles(asset)[0]);
  const type = mediaKind(asset, file);
  doc.title = asset.description ? `情境環境投影｜${asset.description}` : '情境環境投影';
  doc.getElementById('projection-message').style.display = 'none';

  if (type === 'image') {
    renderProjectionImage(doc, [file], asset.description, file);
    return;
  }
  if (type !== 'video') {
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這筆環境素材不是可投影的影片或圖片。');
    return;
  }

  const video = doc.createElement('video');
  video.src = absoluteAssetUrl(file);
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('aria-label', asset.description || '環境影片');
  video.addEventListener('playing', () => {
    doc.getElementById('projection-message').style.display = 'none';
  });
  video.addEventListener('error', () => {
    const fallbacks = fallbackFiles(asset);
    if (fallbacks.length) {
      renderProjectionImage(doc, fallbacks, asset.description, file + '（圖片 fallback 也無法載入）');
    } else {
      doc.getElementById('projection-stage').replaceChildren();
      showProjectionMessage(doc, '找不到環境影片：' + file);
    }
  }, { once: true });
  doc.getElementById('projection-stage').replaceChildren(video);
  video.play().catch(() => {
    showProjectionMessage(doc, '瀏覽器阻擋自動播放，請點一下「進入全螢幕」後再播放。');
  });
}

// 投影端的場景框。舞台就是視窗本身，所以長寬比用視窗的量。
function applyProjectionSceneBox() {
  const doc = projectionDocument();
  if (!doc || !projectionWindow) return;
  const media = doc.querySelector('#projection-stage > img, #projection-stage > video');
  if (!media) return;
  const aspect = (projectionWindow.innerWidth || 0) / (projectionWindow.innerHeight || 1);
  const place = () => applySceneBox(media, sceneLayoutOf(), aspect);
  place();
  media.addEventListener('load', place, { once: true });
  media.addEventListener('loadedmetadata', place, { once: true });
}

function renderProjectionScene() {
  if (!projectionWindow || projectionWindow.closed) return;
  if (currentEnvironmentAsset) {
    renderProjectionAsset(currentEnvironmentAsset);
  } else {
    const doc = projectionWindow.document;
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這個情境沒有可投影的環境素材。');
  }
  renderProjectionPatient();
  applyProjectionSceneBox();
}

function openProjection() {
  if (!currentEnvironmentAsset) return;
  if (projectionWindow && !projectionWindow.closed) {
    projectionWindow.focus();
    renderProjectionScene();
    return;
  }

  const width = Math.max(640, window.screen.availWidth || 1280);
  const height = Math.max(480, window.screen.availHeight || 720);
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  const features = `popup=yes,width=${width},height=${height},left=${left},top=${top}`;
  const win = window.open('', 'scene-player-projection', features);
  if (!win) {
    setStatus('無法開始投影，請允許此網站顯示彈出式視窗後再試一次。', true);
    return;
  }

  projectionWindow = win;
  setupProjectionWindow(win);
  maximizeProjectionWindow(win);
  win.focus();
  $('btn-project').textContent = '聚焦投影視窗';
  renderProjectionScene();
  syncFormatToProjection(win);
}

/**
 * 投影視窗開好之後，依它自己的長寬比挑投影格式。
 * **現場沒有人會記得先切分頁**，但視窗知道自己多寬——所以這件事不該問人。
 * 放在 maximize 之後才量：視窗還在長大的時候量到的是中間過程。
 */
function syncFormatToProjection(win) {
  const measure = () => {
    if (!win || win.closed) return;
    const aspect = (win.innerWidth || 0) / (win.innerHeight || 1);
    const picked = Scenarios.formatForAspect(DATA.options, aspect);
    if (picked.id === activeFormatId()) return;
    setActiveFormat(picked.id);
    setStatus(`投影視窗是 ${aspect.toFixed(2)}:1，已切到「${picked.name}」的版面。`);
  };
  // 放大是非同步的，量太早會量到還沒展開的那一瞬間
  setTimeout(measure, 300);
}

function playProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.currentTime = 0;
    video.play().catch(() => {});
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開始投影';
  }
}

function stopProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.pause();
    video.currentTime = 0;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開始投影';
  }
}

function disposeMediaSources() {
  mediaLoadControllers.forEach(controller => controller.abort());
  mediaLoadControllers.clear();
  mediaObjectUrls.forEach(url => URL.revokeObjectURL(url));
  mediaObjectUrls.clear();
}

// ---------- 媒體池 ----------
// 播放曾經寄居在舊入口的卡片 DOM 裡（去卡片底下找 <audio> 按下去），所以那些卡片
// 一刪就等於拔掉喇叭。媒體池把發聲的地方搬到與畫面完全無關的容器，用 segmentKey
// 當索引——畫面怎麼改都不影響播放。

const poolBase = new Map();      // 基本角色 role -> 媒體元素
const poolSegments = new Map();  // segmentKey -> 該段要一起播的媒體元素

function resetMediaPool() {
  ambienceOn = false;      // 池整個換掉，原本在響的底噪也跟著沒了
  stopMediaIn($('media-pool'));
  $('media-pool').innerHTML = '';
  poolBase.clear();
  poolSegments.clear();
}

// 池裡的元素沒有 controls 也不需要拖時間軸，所以直接給 src——不必像舊卡片那樣
// 先把整個檔抓成 blob 才能 seek。
function poolMediaFor(asset) {
  if (!asset || asset.type === 'none') return null;
  const file = assetPath(asset, assetFiles(asset)[0]);
  const kind = mediaKind(asset, file);
  if (!file || (kind !== 'audio' && kind !== 'video')) return null;   // 圖片不發聲
  const el = document.createElement(kind === 'video' ? 'video' : 'audio');
  el.src = file;
  el.dataset.asset = asset.id;   // 池是隱形的，出事時要查得出這顆在放哪一筆素材
  el.preload = 'auto';
  el.loop = asset.role === 'ambient_sound';   // 環境聲音要撐滿全場，其餘播完就停
  $('media-pool').appendChild(el);
  applyVolume(el);   // 新建的也要跟上，否則下一段聲音會用滿音量炸出來
  return el;
}

function addBaseMedia(role, asset) {
  const el = poolMediaFor(asset);
  if (el) poolBase.set(role, el);
}

// 一段演出的聲音來源只有一個：綠幕素材是影片就用影片原聲，否則才用配音檔。
// 這條規則原本藏在舊卡片的 silentVoice——靠「不建那個播放器」來實現，規則與畫面
// 綁在一起。搬進池之後它是明文的一行判斷。
function addSegmentMedia(comp, segment, videoAsset, voiceAsset) {
  const els = [];
  const videoEl = poolMediaFor(videoAsset);
  if (videoEl) els.push(videoEl);
  const usesOwnAudio = !!videoAsset && mediaKind(videoAsset) === 'video';
  if (!usesOwnAudio) {
    const voiceEl = poolMediaFor(voiceAsset);
    if (voiceEl) els.push(voiceEl);
  }
  if (els.length) poolSegments.set(segmentKey(comp, segment), els);
}

// match 省略＝全部停。傳入判斷函式可只停某一段或某個突發狀況的所有片段。
function stopSegmentMedia(match = null) {
  poolSegments.forEach((els, key) => {
    if (match && !match(key)) return;
    els.forEach(el => { el.pause(); el.currentTime = 0; });
  });
}

const compOfKey = key => key.slice(0, key.lastIndexOf('|'));

// **一次只演一段。** 舊版這件事是撿到的——所有片段的 <audio> 剛好都長在同一棵子樹
// 底下，「停掉這塊區域」順手就停掉了其他段。池裡各段互相獨立，不明寫就會疊著響。
// 環境聲音不在停止範圍內：它是整場的底噪，不該被下一段演出打斷。
function playSegmentMedia(comp, segment) {
  stopSegmentMedia();
  (poolSegments.get(segmentKey(comp, segment)) || []).forEach(el => {
    el.currentTime = 0;
    el.play().catch(() => {});
  });
  startComplicationProjection(comp, segment, 'play');
}

// clipboard API 在部分環境（非 https、權限未給）會失敗，退回 execCommand，再不行就幫使用者選取
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch { /* 往下試 execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

function selectNode(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ---------- 流程 UI ----------

function flowButton(doc, label, onClick, { primary = false, disabled = false } = {}) {
  const btn = Object.assign(doc.createElement('button'), {
    type: 'button', textContent: label, disabled,
  });
  btn.className = 'flow-btn' + (primary ? ' primary' : '');
  btn.addEventListener('click', onClick);
  return btn;
}

// 長得像按鈕，但是一條真的連結。用在「要開另一個網頁」的地方——
// window.open() 是程式自己開視窗，瀏覽器與擴充功能都在防它（實測會直接回傳 null，
// 使用者按下去完全沒有反應）；使用者點連結沒有人會擋。
function flowLink(doc, label, href, onClick) {
  const a = Object.assign(doc.createElement('a'), {
    textContent: label, href, target: '_blank', rel: 'noopener noreferrer',
  });
  a.className = 'flow-btn';
  if (onClick) a.addEventListener('click', onClick);
  return a;
}

function buildScenarioTools(doc) {
  const bar = doc.createElement('div');
  bar.className = 'flow-actions';
  // 匯入留在清單這一層（它是「加一個情境進來」），匯出移到編輯畫面——
  // 匯出現在的單位是「一個情境」，在還沒選情境的清單上沒有東西可以匯
  bar.append(
    flowButton(doc, '＋ 新增情境', newScenario, { primary: true }),
    flowButton(doc, '匯入', pickImportFile),
  );
  return bar;
}

// L2：簡報頁清單 ＋ 播放控制
// 左右欄寬。存進 localStorage：教官調好一次之後，不該每次重開都要再調一遍。
const SPLIT_KEY = 'ems-scene-player:edit-split';
const SPLIT_MIN = 22;      // 百分比。留下限，免得任一欄被拖到 0 寬就再也抓不回來
const SPLIT_MAX = 62;
let splitPercent = (() => {
  const raw = Number(localStorage.getItem(SPLIT_KEY));
  // 預設左三右七：左欄是清單（窄一點就夠讀），右欄是預覽（這個工具的重點）。
  // 調過的人不受影響——這個值一調就存 localStorage，只有沒調過的人吃預設。
  return Number.isFinite(raw) && raw >= SPLIT_MIN && raw <= SPLIT_MAX ? raw : 30;
})();

function splitterColumns() {
  return `${splitPercent}% 10px minmax(0, 1fr)`;
}

function applySplit(next, screen) {
  splitPercent = Math.max(SPLIT_MIN, Math.min(SPLIT_MAX, next));
  screen.style.gridTemplateColumns = splitterColumns();
  localStorage.setItem(SPLIT_KEY, String(Math.round(splitPercent)));
  // 圖片的尺寸上限是依舞台寬度換算成 px 存下來的，欄寬一變就過期——
  // 不重算的話會看到「bar 拖寬了，人物卻沒跟著變大」。
  updatePreviewLayout();
}

// 分隔 bar。**要有鍵盤路徑**：只給滑鼠拖的話，只用鍵盤的人就永遠停在預設寬度。
function buildSplitter(doc, screen) {
  const bar = doc.createElement('div');
  bar.className = 'edit-splitter';
  bar.tabIndex = 0;
  bar.setAttribute('role', 'separator');
  bar.setAttribute('aria-orientation', 'vertical');
  bar.setAttribute('aria-label', '調整編輯區與預覽的寬度');
  bar.title = '拖曳調整寬度（方向鍵也可以）';

  const onMove = e => {
    const rect = screen.getBoundingClientRect();
    applySplit(((e.clientX - rect.left) / rect.width) * 100, screen);
  };
  const stop = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', stop);
    document.body.classList.remove('splitting');
  };
  bar.addEventListener('mousedown', e => {
    e.preventDefault();                     // 不要在拖曳過程中選到文字
    document.body.classList.add('splitting');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', stop);
  });
  bar.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    // **一定要擋下冒泡。** 方向鍵在全域是「翻頁」，焦點停在這條 bar 上時同一顆鍵
    // 會先調寬度、再翻一頁——畫面同時跳兩下，而使用者說不出是哪一件出了問題。
    e.stopPropagation();
    const step = e.shiftKey ? 5 : 2;
    applySplit(splitPercent + (e.key === 'ArrowLeft' ? -step : step), screen);
  });
  return bar;
}

// 編輯畫面：**左欄操作、右欄結果，兩者永遠並排。**
// 舊版是預覽在上、編輯在下，改一個欄位要往上看預覽，捲一下就有一邊看不見。
// 圖層收進頁裡（只展開當前頁），情境層設定放最上面——由大到小：這一整組 → 這一頁 → 這一層。
function buildFlowPanel(doc, preview) {
  const screen = doc.createElement('div');
  screen.className = 'edit-screen';
  if (!currentScenario) return screen;

  const left = doc.createElement('div');
  left.className = 'edit-main';

  const head = doc.createElement('div');
  head.className = 'flow-head';
  const back = flowButton(doc, '‹ 回到情境', () => { panelLevel = 'browse'; renderFlow(); });
  // 情境名稱直接雙擊改，不另外給按鈕——命名是偶爾才做的事，不值得常駐一顆
  const title = inlineTitle(doc, {
    value: currentScenario.name,
    hint: '雙擊（或按 Enter）改情境名稱',
    className: 'flow-title',
    onCommit: renameScenario,
  });
  const counter = doc.createElement('span');
  counter.className = 'flow-counter';
  counter.textContent = flowSteps.length
    ? (flowIndex < 0 ? `尚未開始 · 共 ${flowSteps.length} 步` : `第 ${flowIndex + 1} / ${flowSteps.length} 步`)
    : '這個情境沒有可播的頁';
  head.append(back, title, counter);
  left.appendChild(head);

  const list = doc.createElement('div');
  list.className = 'flow-list edit-pages';
  list.appendChild(buildScenarioSettingsRow(doc));
  // 情境設定與逐頁編輯之間的界線（理由見 .flow-divider 的註解）
  list.appendChild(Object.assign(doc.createElement('div'), { className: 'flow-divider' }));
  // flowSteps 現在就是「會播的頁」本身，欄位是 id 不是 slideId
  const currentSlideId = flowIndex >= 0 && flowSteps[flowIndex] ? flowSteps[flowIndex].id : null;
  currentScenario.slides.forEach((slide, index) => {
    // 展開的只有一頁。多開會讓左欄長回舊版那麼長，捲動的問題原地復發。
    const expanded = slide.id === editingSlideId;

    const item = doc.createElement('div');
    item.className = 'flow-item' + (expanded ? ' expanded' : '');

    const row = doc.createElement('div');
    // 情境設定展開時，橘色移到它身上——**同一時間只該有一個東西看起來是「選中的」**。
    // 兩邊都亮的話，你在改的是預設位置，眼睛卻被某一頁的橘框拉走。
    row.className = 'flow-row'
      + (slide.id === currentSlideId && !settingsExpanded ? ' current' : '')
      + (slide.enabled === false ? ' off' : '');

    const toggle = doc.createElement('label');
    toggle.className = 'flow-toggle';
    const box = Object.assign(doc.createElement('input'),
      { type: 'checkbox', checked: slide.enabled !== false });
    box.setAttribute('aria-label', `啟用「${slide.title}」`);
    box.addEventListener('change', () => toggleSlideEnabled(slide.id));
    toggle.appendChild(box);

    // 編號讓人對得上預覽右下角的「N / M」
    const num = doc.createElement('span');
    num.className = 'flow-row-num';
    num.textContent = index + 1;

    // 列名就是這一頁的標題，雙擊直接改——展開的內容裡不再重複一個標題欄位
    const name = inlineTitle(doc, {
      value: slide.title,
      hint: '雙擊（或按 Enter）改這一頁的標題',
      className: 'flow-row-title',
      onCommit: next => { slide.title = next; persistScenarioEdit(); },
    });

    // 一眼看出這頁畫面上有什麼：綠幕人物最重要，其次是字幕，都沒有就是純場景
    const meta = doc.createElement('span');
    meta.className = 'flow-row-meta';
    const green = Scenarios.layerOf(slide, 'greenscreen');
    const text = Scenarios.layerOf(slide, 'text');
    meta.textContent = slide.enabled === false ? '播放時跳過'
      : green ? (green.segment ? `片段 ${green.segment}` : '綠幕人物')
      : text ? '字幕'
      : (slide.note ? '等教官' : '純場景');

    // 複製／刪除放在該頁自己這一列，hover 才浮出來——常駐兩顆大按鈕會蓋過內容，
    // 而且「這頁」指的是哪一頁在底下的按鈕上並不明顯。
    const rowTools = doc.createElement('span');
    rowTools.className = 'flow-row-tools';
    const dup = flowButton(doc, '⧉', () => duplicateSlide(slide.id));
    dup.title = '複製這頁';
    dup.setAttribute('aria-label', `複製「${slide.title}」`);
    const del = flowButton(doc, '✕', () => {
      // 刪除縮成小 icon 之後誤觸機率上升，所以保留確認；複製是可逆的就不問
      if (confirm(`確定刪除「${slide.title}」？`)) deleteSlide(slide.id);
    });
    del.title = '刪除這頁';
    del.setAttribute('aria-label', `刪除「${slide.title}」`);
    rowTools.append(dup, del);

    // 拖曳把手。整列可拖的話，游標整條都是 grab，而且想選標題文字會變成拖頁；
    // 所以只有這個把手帶 grab 游標，也只有從它按下去才會啟動拖曳。
    const grip = doc.createElement('span');
    grip.className = 'flow-drag';
    grip.textContent = '⠿';
    grip.title = '拖曳調整順序';
    grip.setAttribute('aria-hidden', 'true');
    grip.addEventListener('mousedown', () => { row.draggable = true; });
    grip.addEventListener('mouseup', () => { row.draggable = false; });

    row.append(grip, toggle, num, name, meta, rowTools);

    row.dataset.slideId = slide.id;
    row.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', slide.id);
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      document.querySelectorAll('.drop-before, .drop-after')
        .forEach(el => el.classList.remove('drop-before', 'drop-after'));
      row.draggable = false;      // 放開後回到「不可拖」，游標才不會整列都是 grab
    });
    // 拖到哪裡要看得見：在會插入的那一側畫一條線，否則放手前完全是猜的
    const markEdge = e => {
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      row.classList.toggle('drop-after', after);
      row.classList.toggle('drop-before', !after);
    };
    const clearEdge = () => row.classList.remove('drop-before', 'drop-after');
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      markEdge(e);
    });
    row.addEventListener('dragleave', clearEdge);
    row.addEventListener('drop', e => {
      e.preventDefault();
      clearEdge();
      const draggedId = e.dataTransfer.getData('text/plain');
      if (!draggedId || draggedId === slide.id) return;
      const target = currentScenario.slides.findIndex(s => s.id === slide.id);
      const from = currentScenario.slides.findIndex(s => s.id === draggedId);
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      let to = target + (after ? 1 : 0);
      if (from < to) to -= 1;      // 往下搬時，自己被抽走會讓後面的索引往前一格
      moveSlide(draggedId, to);
    });

    // 點整列（含標題）＝展開／收起這一頁；展開時順便跳過去，預覽與投影跟著換。
    // 標題同時要能雙擊改字，所以點在標題上時延後一拍執行——雙擊會把它取消掉，
    // 否則每次要改標題都會先把頁收起來。
    if (slide.enabled !== false) {
      row.classList.add('clickable');
      let pending = null;
      const toggleThis = () => {
        settingsExpanded = false;                 // 一次只展開一個
        if (editingSlideId === slide.id) { editingSlideId = null; renderFlow(); return; }
        editingSlideId = slide.id;
        const i = flowSteps.findIndex(s => s.id === slide.id);
        if (i >= 0) gotoFlow(i); else renderFlow();
      };
      row.addEventListener('click', e => {
        if (e.target.closest('.flow-toggle, .flow-row-tools, .flow-drag, .inline-title-edit')) return;
        if (e.target.closest('.inline-title')) {
          clearTimeout(pending);
          pending = setTimeout(toggleThis, 220);   // 等一下看看是不是雙擊
          return;
        }
        toggleThis();
      });
      name.addEventListener('dblclick', () => clearTimeout(pending));
    }

    item.appendChild(row);
    if (expanded) {
      const body = doc.createElement('div');
      body.className = 'flow-body';
      body.appendChild(buildSlideBody(doc, slide));
      item.appendChild(body);
    }
    list.appendChild(item);
  });
  left.appendChild(list);

  const addBar = doc.createElement('div');
  addBar.className = 'flow-actions';
  // 這一列只放管「頁」的東西。整個情境的操作（匯出／貢獻／刪除）在情境設定裡——
  // 尺度不同的東西擠在同一列，按鈕就得靠「這個情境」四個字去補位置補不出來的語意。
  addBar.append(flowButton(doc, '＋ 新增頁', addSlide));
  left.appendChild(addBar);

  // 右欄：預覽固定在視窗上緣，捲到第 8 頁時它還在
  const right = doc.createElement('div');
  right.className = 'edit-aside';
  const stick = doc.createElement('div');
  stick.className = 'edit-sticky';
  if (preview) stick.appendChild(preview);
  // 預覽與備註之間一整列：左邊是逐頁操作（翻頁），右邊是整場設定（投影、環境音）。
  // 兩者都貼著預覽，但用左右分開表示它們是不同尺度的東西。
  const bar = doc.createElement('div');
  bar.className = 'preview-bar';
  const pager = doc.createElement('div');
  pager.className = 'flow-actions preview-pager';
  pager.append(
    flowButton(doc, '‹ 上一頁', prevFlow, { disabled: flowIndex <= 0 }),
    flowButton(doc, '下一頁 ›', nextFlow,
      { primary: true, disabled: !flowSteps.length || flowIndex >= flowSteps.length - 1 }),
  );
  const slot = doc.createElement('div');
  slot.className = 'flow-actions toolbar-slot';
  bar.append(pager, slot);
  stick.appendChild(bar);
  // 「只有場景／字幕…」那行拿掉：左欄每一列的 meta 已經寫著同樣的事，
  // 而右欄的空間應該留給預覽本身與備註。
  const noteSlide = (flowIndex >= 0 && flowSteps[flowIndex]) || editingSlide();
  if (noteSlide) stick.appendChild(buildNoteField(doc, noteSlide));
  right.appendChild(stick);

  screen.append(left, buildSplitter(doc, screen), right);
  screen.style.gridTemplateColumns = splitterColumns();
  return screen;
}


// L3：編輯單一簡報頁
// 標題平常就是標題，雙擊才變成輸入框——常駐一個 input 會讓「這是內容」看起來像
// 「這是表單」。雙擊沒有鍵盤路徑，所以 focus 後按 Enter 也要能進入編輯，
// 否則這個欄位對只用鍵盤的人等於消失。
function inlineTitle(doc, { value, onCommit, hint = '雙擊（或按 Enter）改名', className = '' }) {
  const box = doc.createElement('div');
  box.className = ('inline-title ' + className).trim();

  const view = doc.createElement('div');
  view.className = 'inline-title-view';
  view.tabIndex = 0;
  view.textContent = value;
  view.title = hint;

  const edit = Object.assign(doc.createElement('input'),
    { type: 'text', className: 'inline-title-edit', value, hidden: true });

  const open = () => {
    edit.value = value;
    edit.hidden = false;
    view.hidden = true;
    edit.focus();
    edit.select();
  };
  const close = commit => {
    if (commit) {
      const next = edit.value.trim();
      if (next && next !== value) {
        onCommit(next);            // 內含重繪，所以下面的還原只在沒有改動時才會被看到
        return;
      }
    }
    edit.hidden = true;
    view.hidden = false;
    view.focus();
  };

  view.addEventListener('dblclick', open);
  view.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  edit.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); close(true); }
    if (e.key === 'Escape') { e.preventDefault(); close(false); }
  });
  edit.addEventListener('blur', () => close(true));

  box.append(view, edit);
  return box;
}

// 給教官的備註。**不會投影出去**——要投影給學員看的字請加說明文字圖層。
// 放在預覽底下：它講的是「看著這個畫面要說什麼」，跟右邊那張圖是同一件事。
// 用 textarea 不用 input：備註常常是一整段流程說明，單行框會讓人只敢寫短句。
function buildNoteField(doc, slide) {
  const box = doc.createElement('div');
  box.className = 'note-field';
  const label = doc.createElement('label');
  label.className = 'note-label';
  label.textContent = '備註';
  label.htmlFor = 'slide-note';
  const area = Object.assign(doc.createElement('textarea'), {
    id: 'slide-note', rows: 4,
    placeholder: '只有教官看得到，不會投影出去',
    value: slide.note || '',
  });
  area.addEventListener('change', () => {
    const v = area.value.trim();
    if (v) slide.note = v; else delete slide.note;
    persistScenarioEdit();
  });
  box.append(label, area);
  return box;
}

// 展開在頁清單裡的那一頁的內容。標題不在這裡——它就是上面那一列的列名，
// 寫兩次會讓人不知道該改哪一個。
// emoji 的眼睛在不同系統上長相差很多（有的是彩色 3D、有的偏小），
// 而且沒有「關掉」的對應字元可用（🚫 是禁止符號，不是閉眼）。改用內嵌 SVG：
// 兩個狀態同一套線條、同一個粗細，關掉就是多一條斜線。
function eyeIcon(doc, open) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = doc.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', '14');
  svg.setAttribute('height', '14');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('aria-hidden', 'true');

  const outline = doc.createElementNS(NS, 'path');
  outline.setAttribute('d', 'M1 8s2.6-4.3 7-4.3S15 8 15 8s-2.6 4.3-7 4.3S1 8 1 8z');
  svg.appendChild(outline);

  const pupil = doc.createElementNS(NS, 'circle');
  pupil.setAttribute('cx', '8');
  pupil.setAttribute('cy', '8');
  pupil.setAttribute('r', '1.9');
  svg.appendChild(pupil);

  if (!open) {
    const slash = doc.createElementNS(NS, 'path');
    slash.setAttribute('d', 'M2.5 13.5 13.5 2.5');
    svg.appendChild(slash);
  }
  return svg;
}

function buildSlideBody(doc, slide) {
  const wrap = doc.createElement('div');
  wrap.className = 'flow-body-inner';
  if (!slide) return wrap;

  const LAYER_LABEL = {
    scene: '場景', patient: '病患照片', greenscreen: '突發狀況', text: '說明文字',
  };

  // 由上往下顯示＝畫面上由前往後，跟一般繪圖軟體的圖層面板一致
  [...slide.layers].reverse().forEach(layer => {
    const row = doc.createElement('div');
    row.className = 'edit-action';
    // 眼睛擺在最前面：它管的是「這一層在不在」，是讀這一列時第一個要知道的事。
    // **隱藏不是刪除**——scene 與 patient 每頁必備、刪不掉，要暫時只看場景只有這條路。
    const shown = Scenarios.layerVisible(layer);
    const eye = doc.createElement('button');
    eye.type = 'button';
    eye.className = 'layer-eye' + (shown ? '' : ' off');
    eye.title = shown ? '隱藏這一層（預覽與投影都不顯示）' : '顯示這一層';
    eye.setAttribute('aria-pressed', String(!shown));
    eye.appendChild(eyeIcon(doc, shown));
    eye.addEventListener('click', () => {
      if (shown) layer.visible = false; else delete layer.visible;
      persistScenarioEdit();
    });
    row.append(eye, Object.assign(doc.createElement('span'),
      { className: 'layer-name', textContent: LAYER_LABEL[layer.type] || layer.type }));

    if (layer.type === 'greenscreen') {
      // 編輯器也要把關：這個情境的環境×事件下沒素材的狀況，不該編得進去
      const compSel = doc.createElement('select');
      optionsFor('complication').forEach(c => {
        const usable = complicationUsable(c, currentScenario.environment, currentScenario.medicalEvent);
        compSel.appendChild(Object.assign(doc.createElement('option'), {
          value: c, textContent: usable ? c : `${c}（此情境無素材）`, disabled: !usable,
        }));
      });
      compSel.value = layer.complication;
      compSel.addEventListener('change', () => updateLayer('greenscreen', { complication: compSel.value }));
      row.appendChild(compSel);

      // 一個突發狀況可以拆成好幾段連續的演出（例：「肇事雙方爭吵」有 3 段影片），
      // 教官依現場節奏一段一段放。這裡原本是自由輸入的文字框，但合法值其實只有
      // 這個狀況真正存在的那幾段——填 5 進去不會有任何東西出現，而且看不出哪裡錯。
      const segments = complicationSegments(layer.complication, currentEnv(), currentMed());
      const seg = doc.createElement('select');
      seg.className = 'edit-seg';
      segments.forEach((n, i) => seg.appendChild(Object.assign(doc.createElement('option'),
        { value: String(n), textContent: `第 ${n} 段` + (i === 0 ? '（預設）' : '') })));
      seg.value = String(layer.segment || segments[0]);
      seg.addEventListener('change', () => updateLayer('greenscreen', { segment: seg.value }));
      // 只有一段的狀況沒有可選的東西，露出一個永遠只有一個選項的選單只是雜訊
      if (segments.length > 1) row.appendChild(seg);
    }

    if (layer.type === 'text') {
      const text = Object.assign(doc.createElement('input'),
        { type: 'text', placeholder: '投影給學員看的字', value: layer.text || '' });
      text.addEventListener('change', () => updateLayer('text', { text: text.value.trim() || layer.text }));
      row.appendChild(text);
    }

    if (layer.type === 'scene' || layer.type === 'patient') {
      // 素材由情境決定、編輯時換不掉，所以這裡只說明它現在用哪一筆
      const asset = layerAsset(layer, layer.type === 'scene' ? currentEnvironmentAsset : currentPatientPhotoAsset);
      row.appendChild(Object.assign(doc.createElement('span'), {
        className: 'layer-asset',
        textContent: asset ? (asset.description || asset.id) : '（此情境查無素材）',
      }));
    }

    const tools = doc.createElement('span');
    tools.className = 'edit-tools';
    // 只有病患有「歸位」與「設為預設」：它整場站同一個地方，所以情境層存得住一個預設。
    // 去背人物每一段站的位置本來就該各自調（這一段站左邊、下一段走近），
    // 沒有一個「原本的位置」可以回去——給它一顆歸位只會讓人以為自己弄壞了什麼。
    // 而且**只在這一頁真的偏離預設時才出現**：沒動過的時候，「歸位」歸到原地、
    // 「設為預設」把預設設成它自己，兩顆都是沒有效果的按鈕。常駐等於每一頁都掛著
    // 兩顆雜訊，而預設位置本身現在有自己的地方可以編（展開情境設定）。
    if (layer.type === 'patient' && patientMovedFromHome(layer)) {
      const home = flowButton(doc, '歸位', () => resetLayerLayout(layer.type));
      home.title = `回到「${activeFormatInfo().name}」的病患預設位置`;
      tools.append(home);
    }
    // 場景與病患是每頁必備、由情境決定的，沒有刪除鍵；
    // 沒有上下鍵則是因為 z 順序由型別決定，投影視窗的 z-index 是寫死的
    if (!Scenarios.ALWAYS_ON_LAYERS.includes(layer.type)) {
      tools.append(flowButton(doc, '✕', () => removeLayer(layer.type)));
    }
    row.appendChild(tools);
    wrap.appendChild(row);
  });

  const addBar = doc.createElement('div');
  addBar.className = 'flow-actions';
  Scenarios.LAYER_TYPES.forEach(type => {
    // 必備的兩層永遠都在，不必也不能「新增」
    if (Scenarios.ALWAYS_ON_LAYERS.includes(type)) return;
    if (Scenarios.layerOf(slide, type)) return;   // 每種一頁最多一個
    addBar.append(flowButton(doc, `＋ ${LAYER_LABEL[type] || type}`, () => addLayer(type)));
  });
  if (addBar.children.length) wrap.appendChild(addBar);

  return wrap;
}

// ---------- 預覽 ----------
// 圖層編輯器沒有預覽等於盲編：改了位置要開投影視窗才看得到。
// 預覽把同一頁的圖層堆在一個 16:9 的小框裡，用的是**與投影端同一組數值**
// （size→vw/vh 對應到框的寬高百分比，x/y→left/top，中心點對齊），
// 所以這裡看到的位置就是投影上的位置。

// 圖層要用哪一筆素材：釘選了就用那筆，否則用本次產生時挑到的
function layerAsset(layer, fallback) {
  if (!layer) return null;
  if (layer.asset) return DATA.assets.find(a => a.id === layer.asset) || null;
  return fallback || null;
}

function previewImage(asset, className) {
  if (!asset || asset.type === 'none') return null;
  const file = assetPath(asset, assetFiles(asset)[0]);
  if (!file) return null;
  return Object.assign(document.createElement('img'),
    { className, src: absoluteAssetUrl(file), alt: asset.description || '' });
}

// 綠幕在投影上是逐幀去背的 canvas；預覽只需要一張靜止的去背圖就夠了，
// 位置調得對不對不需要動畫，而且省下一整個 rAF 迴圈。
function previewGreenscreen(layer, canvas) {
  const segment = layer.segment || complicationSegments(layer.complication,
    currentEnv(), currentMed())[0];
  const asset = complicationVideoAssets[segmentKey(layer.complication, segment)];
  if (!hasProjectableComplication(asset)) return false;

  const file = assetPath(asset, assetFiles(asset)[0]);
  const url = absoluteAssetUrl(file);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const paint = (source, w, h) => {
    const width = Math.min(w || KEY_MAX_WIDTH, KEY_MAX_WIDTH);
    canvas.width = width;
    canvas.height = Math.max(1, Math.round(width * ((h && w) ? h / w : 9 / 16)));
    try {
      // 容差讀執行期物件，理由同 updatePreviewLayout：滑桿改的是它，圖層慢一拍
      chromaKeyFrame(ctx, source, canvas.width, canvas.height,
        complicationOverlay(layer.complication).tolerance);
    } catch { /* 素材還沒解碼完就跳過，下次重繪會補上 */ }
  };
  // 調「去背」滑桿要重算像素，不只是換位置——把重畫函式掛在 canvas 上供 updatePreviewLayout 呼叫。
  // paint 讀的是 layer.tolerance，而 layer 是被就地修改的同一個物件，所以永遠拿到最新值。
  const remember = (source, w, h) => {
    canvas.__repaint = () => paint(source, w, h);
    canvas.__repaint();
    // canvas 沒有 load 事件，畫完才知道長寬比——這時才擺得出正確的尺寸上限
    updatePreviewLayout();
  };
  if (mediaKind(asset, file) === 'video') {
    // preload 必須是 auto：metadata 只抓中繼資料、不抓影格，loadeddata 會拿到空白畫面
    const video = Object.assign(document.createElement('video'),
      { src: url, muted: true, playsInline: true, preload: 'auto' });
    video.addEventListener('loadeddata', () => remember(video, video.videoWidth, video.videoHeight), { once: true });
  } else {
    const img = new Image();
    img.addEventListener('load', () => remember(img, img.naturalWidth, img.naturalHeight), { once: true });
    img.src = url;
  }
  return true;
}

// 位置與大小改成直接在預覽上拖，所以這裡是唯一寫入 layout 的地方之一。
// 讀寫的都是 patientOverlay／complicationOverlay 這兩個**執行期物件**，
// 圖層要等 persistLayerLayout() 才同步——讀圖層會慢一拍。

// size 是「可佔畫面的百分比」，投影端用 vw/vh。預覽的 stage 不是視窗大小，
// 所以要換算成 px；百分比放在 shrink-to-fit 的外層裡會被瀏覽器當成沒設。
// 場景鋪底的框。預覽與投影共用同一份換算（Scenarios.sceneBoxStyle），差別只在
// 「舞台是誰」——預覽是那個框，投影是整個視窗。
// 素材的長寬比要等它載完才知道，所以 load 之後要再套一次。
function mediaAspect(el) {
  const w = el.naturalWidth || el.videoWidth || 0;
  const h = el.naturalHeight || el.videoHeight || 0;
  return h > 0 ? w / h : NaN;
}

function applySceneBox(el, layout, stageAspect) {
  if (!el) return;
  Object.assign(el.style, Scenarios.sceneBoxStyle(layout, mediaAspect(el), stageAspect));
}

// 場景的框是**情境層**的（一個情境一張背景，取景每頁都一樣），所以跟 slide 無關
function sceneLayoutOf() {
  return currentScenario ? Scenarios.sceneFrameFor(currentScenario, activeFormatId()) : null;
}

// 情境層版面（場景框、病患預設位置）在目前格式下的儲存位置。
// 基準格式就寫在那個物件上，其他格式寫進它的 layouts[id]——與圖層同一套規則。
function frameSlot(key, defaults) {
  if (!currentScenario) return null;
  if (!currentScenario[key]) currentScenario[key] = { ...defaults };
  const frame = currentScenario[key];
  const fmt = activeFormatId();
  if (fmt === Scenarios.baseFormatId(DATA.options)) return frame;
  if (!frame.layouts) frame.layouts = {};
  if (!frame.layouts[fmt]) {
    frame.layouts[fmt] = Object.fromEntries(
      Object.keys(defaults).map(k => [k, frame[k] !== undefined ? frame[k] : defaults[k]]));
  }
  return frame.layouts[fmt];
}

const sceneFrameSlot = () => frameSlot('sceneFrame', Scenarios.SCENE_FRAME_DEFAULTS);
const patientHomeSlot = () => frameSlot('patientHome', Scenarios.LAYER_DEFAULTS.patient);

// 展開「情境設定」時，預覽變成**預設位置的畫布**：顯示的不是某一頁，而是
// 「新的一頁會長什麼樣」。以前 patientHome 沒有任何地方看得到，只能在某一頁按
// 「設為預設」把它偷偷寫掉——一個局部按鈕改全域值。
function editingDefaults() {
  return panelLevel === 'edit' && settingsExpanded;
}

let sceneSaveTimer = null;
function persistSceneFrame() {
  if (!currentScenario) return;
  clearTimeout(sceneSaveTimer);
  sceneSaveTimer = setTimeout(() => saveScenarioOverride(currentScenario), 400);
}

function placePreviewItem(item, layout, stage) {
  if (!item || !layout) return;
  item.style.left = layout.x + '%';
  item.style.top = layout.y + '%';
  // 文字的 size 是字級不是寬高上限，而且字級用容器單位就會自己跟著舞台縮放，
  // 不必等下一次 updatePreviewLayout——所以它走自己這條，且與投影共用同一個公式。
  const text = item.querySelector('.preview-text');
  if (text) { text.style.fontSize = Scenarios.textBoxStyle(layout, 'cqw').fontSize; return; }
  const rect = stage.getBoundingClientRect();
  const media = item.querySelector('.preview-media');
  if (media) {
    media.style.maxWidth = (rect.width * layout.size / 100) + 'px';
    media.style.maxHeight = (rect.height * layout.size / 100) + 'px';
  }
}

function previewLayoutOf(slide, type) {
  if (type === 'patient') {
    if (editingDefaults()) return Scenarios.patientHomeFor(currentScenario, activeFormatId());
    return Scenarios.layerOf(slide, 'patient') ? patientOverlay : null;
  }
  // text 沒有執行期物件，直接算出目前格式生效的那一份
  if (type === 'text') {
    const layer = Scenarios.layerOf(slide, 'text');
    return layer ? Object.assign(Scenarios.layoutFor(layer, activeFormatId()), { text: layer.text }) : null;
  }
  const green = Scenarios.layerOf(slide, 'greenscreen');
  return green ? complicationOverlay(green.complication) : null;
}

// 編輯畫面的右欄高度是固定的（見 body.editing 那組版面），舞台能有多大，取決於
// 同欄的翻頁列與備註實際佔掉多少。把那個高度量出來交給 CSS，舞台才有辦法在
// 「維持 16:9」的前提下自己讓步——而 16:9 不能破，圖層的 x/y 是百分比。
function updatePreviewFit() {
  const stick = document.querySelector('#flow .edit-sticky');
  const preview = stick && stick.querySelector('.preview');
  if (!stick || !preview) return;
  const gap = parseFloat(getComputedStyle(stick).rowGap) || 0;
  const reserve = [...stick.children]
    .filter(el => el !== preview)
    .reduce((sum, el) => sum + el.getBoundingClientRect().height + gap, 0);
  stick.style.setProperty('--preview-reserve', reserve + 'px');
}

function updatePreviewLayout() {
  // 先定舞台大小再擺圖層：底下的尺寸換算讀的是舞台量出來的寬高，順序反了會慢一拍
  updatePreviewFit();
  const stage = document.querySelector('#flow .preview-stage');
  if (!stage) return;
  const slide = (panelLevel === 'edit' && editingSlide()) || currentSlide();
  if (!slide) return;
  applySceneBox(stage.querySelector('.preview-scene'), sceneLayoutOf(), activeFormatInfo().aspect);
  for (const type of ['patient', 'greenscreen', 'text']) {
    const item = stage.querySelector(`.preview-item[data-type="${type}"]`);
    placePreviewItem(item, previewLayoutOf(slide, type), stage);
  }
  const canvas = stage.querySelector('canvas.preview-media');
  if (canvas && canvas.__repaint) canvas.__repaint();   // 去背容差要重算像素
}

// 動完之後三個地方都要跟上：投影畫面、還留著的滑桿、情境檔
function commitPreviewLayout(type, comp) {
  if (type === 'scene') applyProjectionSceneBox();
  else if (type === 'text') renderProjectionText(currentSlide());
  else if (type === 'patient') applyPatientOverlayLayout();
  else {
    applyComplicationOverlayLayout();
    if (chromaRedraw && !chromaFrame) chromaRedraw();
  }
  persistLayerLayout(type, comp);

  // 拖完要重繪左欄：「歸位」是否該出現取決於這一頁有沒有偏離預設，而那件事
  // 剛剛才被改變。不重繪的話，你把病患拖走了，歸位鈕卻要等下一次換頁才冒出來。
  // **放在拖曳結束、不是拖曳過程**——每一幀重建整個左欄會讓拖曳卡住。
  if (type === 'patient' && !editingDefaults()) renderFlow();
}

// 直接在預覽上操作：整塊拖＝移動，右下角把手＝縮放。
// 縮放用「離中心的距離比例」而不是單看水平位移，因為從任何一角拉都該是同一種手感。
function makePreviewDraggable(item, type, comp, stage) {
  const layout = () => previewLayoutTarget(type, comp);
  const handle = item.querySelector('.preview-handle');

  const start = (event, mode) => {
    // patient／greenscreen 的執行期物件一定在，但 text 讀的是圖層，可能已經被刪掉
    // （預覽還沒重繪）——這裡不擋的話，展開運算子會先炸在 null 上
    if (!layout()) return;
    event.preventDefault();
    event.stopPropagation();
    const rect = stage.getBoundingClientRect();
    const box = item.getBoundingClientRect();   // 背景要用它換算「一像素等於幾 %」
    const from = { ...layout() };
    const centre = { x: rect.left + rect.width * from.x / 100, y: rect.top + rect.height * from.y / 100 };
    const startDist = Math.hypot(event.clientX - centre.x, event.clientY - centre.y) || 1;
    const origin = { x: event.clientX, y: event.clientY };
    const target = mode === 'resize' ? handle : item;
    item.classList.add('dragging');
    // 指標非活躍時（某些瀏覽器、或程式合成的事件）會丟例外，不能讓它擋掉後面的監聽
    try { target.setPointerCapture(event.pointerId); } catch { /* 沒有捕捉也還是能拖 */ }

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
    const move = e => {
      const l = layout();
      if (mode === 'resize') {
        const dist = Math.hypot(e.clientX - centre.x, e.clientY - centre.y);
        l.size = clamp(from.size * (dist / startDist), ...Scenarios.LAYER_RANGES.size);
      } else if (type === 'scene') {
        // 背景的 x／y 是**對齊比例**不是中心點，所以一個像素值多少 % 取決於
        // 「圖比舞台大多少」——圖越大，同樣拖一段距離對應的比例越小。
        // 放大時分母是負的，剛好把方向轉正（往下拖 = 看更下面 = 對齊比例變小）。
        const dx = rect.width - box.width;
        const dy = rect.height - box.height;
        if (dx) l.x = clamp(from.x + (e.clientX - origin.x) / dx * 100, ...Scenarios.LAYER_RANGES.x);
        if (dy) l.y = clamp(from.y + (e.clientY - origin.y) / dy * 100, ...Scenarios.LAYER_RANGES.y);
      } else {
        l.x = clamp(from.x + (e.clientX - origin.x) / rect.width * 100, ...Scenarios.LAYER_RANGES.x);
        l.y = clamp(from.y + (e.clientY - origin.y) / rect.height * 100, ...Scenarios.LAYER_RANGES.y);
      }
      if (type === 'scene') applySceneBox(item, l, activeFormatInfo().aspect);
      else placePreviewItem(item, l, stage);
      // 投影要即時跟著動，教官才看得到自己在調什麼
      if (type === 'scene') applyProjectionSceneBox();
      else if (type === 'text') renderProjectionText(currentSlide());
      else if (type === 'patient') applyPatientOverlayLayout();
      else applyComplicationOverlayLayout();
    };
    const end = e => {
      item.classList.remove('dragging');
      try { target.releasePointerCapture(e.pointerId); } catch { /* 已經放掉了 */ }
      target.removeEventListener('pointermove', move);
      target.removeEventListener('pointerup', end);
      target.removeEventListener('pointercancel', end);
      commitPreviewLayout(type, comp);
    };
    target.addEventListener('pointermove', move);
    target.addEventListener('pointerup', end);
    target.addEventListener('pointercancel', end);
  };

  item.addEventListener('pointerdown', e => { if (e.button === 0) start(e, 'move'); });
  if (handle) handle.addEventListener('pointerdown', e => { if (e.button === 0) start(e, 'resize'); });
}

// 把媒體包進可拖曳的外層
function previewItem(type, media, comp) {
  const item = document.createElement('div');
  item.className = 'preview-item';
  item.dataset.type = type;
  media.classList.add('preview-media');
  item.append(media, Object.assign(document.createElement('span'),
    { className: 'preview-handle', title: '拖曳縮放' }));
  item.title = '拖曳移動，拉右下角縮放';
  return item;
}

function buildPreview() {
  // 編輯中就預覽正在編的那一頁，播放中就預覽目前這一步
  const slide = (panelLevel === 'edit' && editingSlide()) || currentSlide();
  if (!slide) return null;

  const wrap = document.createElement('div');
  wrap.className = 'preview';

  // 投影格式的分頁。只在編輯時出現——瀏覽模式是「確認這是不是我要的情境」，
  // 不該讓人以為自己在調什麼。只有一種格式就整排不出現。
  const formats = projectionFormats();
  if (panelLevel === 'edit' && formats.length > 1) {
    const tabs = document.createElement('div');
    tabs.className = 'format-tabs';
    for (const f of formats) {
      const on = f.id === activeFormatId();
      const btn = Object.assign(document.createElement('button'), {
        type: 'button', textContent: f.name,
      });
      btn.className = 'format-tab' + (on ? ' active' : '');
      // 這個格式在這一頁到底調過沒有——沒調過就是照著基準那組在跑
      const tuned = ['patient', 'greenscreen', 'text']
        .map(t => Scenarios.layerOf(slide, t))
        .some(l => l && Scenarios.hasLayoutFor(l, f.id));
      if (!tuned && f.id !== Scenarios.baseFormatId(DATA.options)) {
        btn.classList.add('untuned');
        btn.title = `這一頁還沒有替「${f.name}」調過位置，目前照著基準那一組顯示`;
      }
      btn.addEventListener('click', () => setActiveFormat(f.id));
      tabs.appendChild(btn);
    }
    wrap.appendChild(tabs);
  }

  const stage = document.createElement('div');
  stage.className = 'preview-stage';
  // 兩個地方都要：aspect-ratio 給舞台自己，另一份給上面那條「塞得進這個框」的算式
  stage.style.setProperty('--stage-aspect', String(activeFormatInfo().aspect));

  // 瀏覽模式只是「確認這是不是我要的情境」，不該能改東西——編輯進去才給拖
  const editable = panelLevel !== 'browse';
  if (!editable) stage.classList.add('preview-locked');

  const scene = previewImage(layerAsset(Scenarios.layerOf(slide, 'scene'), currentEnvironmentAsset), 'preview-scene');
  if (scene) {
    stage.appendChild(scene);
    const place = () => applySceneBox(scene, sceneLayoutOf(), activeFormatInfo().aspect);
    place();                       // 已經在快取裡的圖，load 不會再觸發
    scene.addEventListener('load', place, { once: true });
    scene.addEventListener('loadedmetadata', place, { once: true });
    // 背景可以拖（決定看素材的哪一塊）與滾輪縮放（決定看多大一塊）。
    // 沒有做成 .preview-item 是因為它不是疊在畫面上的東西，是畫面本身——
    // 給它一個縮放手把會跟病患的手把長得一樣，但意義完全不同。
    if (editable) {
      scene.style.cursor = 'grab';
      scene.title = '拖曳決定看素材的哪一塊，滾輪縮放';
      makePreviewDraggable(scene, 'scene', null, stage);
      stage.addEventListener('wheel', e => {
        const slot = sceneFrameSlot();
        if (!slot) return;
        e.preventDefault();
        const [lo, hi] = Scenarios.LAYER_RANGES.size;
        slot.size = Math.max(lo, Math.min(hi, slot.size + (e.deltaY < 0 ? 2 : -2)));
        applySceneBox(scene, sceneLayoutOf(), activeFormatInfo().aspect);
        applyProjectionSceneBox();
        persistSceneFrame();
      }, { passive: false });
    }
  }
  else stage.appendChild(Object.assign(document.createElement('div'),
    { className: 'preview-empty', textContent: '這一頁沒有可預覽的場景素材' }));

  if (editingDefaults()) {
    // 這塊畫布顯示的不是某一頁，是「新的一頁會長什麼樣」。不畫綠幕人物與說明文字：
    // 那些是逐頁的東西，出現在這裡只會讓人以為自己在改那一頁。
    const img = previewImage(currentPatientPhotoAsset, '');
    if (img) {
      const item = previewItem('patient', img);
      stage.appendChild(item);
      const place = () => placePreviewItem(item, previewLayoutOf(slide, 'patient'), stage);
      img.addEventListener('load', place, { once: true });
      place();
      makePreviewDraggable(item, 'patient', null, stage);
    }
    stage.appendChild(Object.assign(document.createElement('div'),
      { className: 'preview-badge', textContent: `預設位置 · ${activeFormatInfo().name}` }));
    wrap.appendChild(stage);
    return wrap;
  }

  const patient = Scenarios.layerOf(slide, 'patient');
  const patientImg = previewImage(layerAsset(patient, currentPatientPhotoAsset), '');
  if (Scenarios.layerVisible(patient) && patientImg) {
    const item = previewItem('patient', patientImg);
    stage.appendChild(item);
    // 圖還沒載完就量不到尺寸，載完再擺一次
    patientImg.addEventListener('load', () => placePreviewItem(item, patientOverlay, stage), { once: true });
    if (editable) makePreviewDraggable(item, 'patient', null, stage);
  }

  const green = Scenarios.layerOf(slide, 'greenscreen');
  if (Scenarios.layerVisible(green)) {
    const canvas = document.createElement('canvas');
    if (previewGreenscreen(green, canvas)) {
      const item = previewItem('greenscreen', canvas, green.complication);
      stage.appendChild(item);
      if (editable) makePreviewDraggable(item, 'greenscreen', green.complication, stage);
    } else {
      stage.appendChild(Object.assign(document.createElement('div'),
        { className: 'preview-missing', textContent: `綠幕素材不存在：${green.complication}` }));
    }
  }

  // 說明文字也可以直接拖：它的 size/x/y 本來就在圖層上，之前只是沒接上拖曳，
  // 所以要挪一句字幕得回去改 YAML。位置寫回的是圖層本身（見 previewLayoutTarget）。
  const text = Scenarios.layerOf(slide, 'text');
  if (Scenarios.layerVisible(text)) {
    const node = Object.assign(document.createElement('div'),
      { className: 'preview-text', textContent: text.text });
    const item = previewItem('text', node);
    item.title = '拖曳移動，拉右下角改字級';
    stage.appendChild(item);
    placePreviewItem(item, text, stage);
    if (editable) makePreviewDraggable(item, 'text', null, stage);
  }

  if (panelLevel === 'browse') {
    stage.addEventListener('pointerenter', stopBrowseAutoplay);
    stage.addEventListener('pointerleave', startBrowseAutoplay);
  }

  // 翻頁：確認情境時就是靠這個一頁頁看過去
  if (flowSteps.length > 1) {
    const at = Math.max(0, flowIndex);
    const nav = (dir, label, cls, disabled) => {
      const b = Object.assign(document.createElement('button'),
        { type: 'button', className: `preview-nav ${cls}`, textContent: label, disabled });
      b.setAttribute('aria-label', dir < 0 ? '上一頁' : '下一頁');
      b.addEventListener('click', e => {
        e.stopPropagation();
        browseAutoStopped = true; stopBrowseAutoplay();
        gotoFlow(at + dir);
      });
      return b;
    };
    stage.append(
      nav(-1, '‹', 'prev', at <= 0),
      nav(1, '›', 'next', at >= flowSteps.length - 1),
      Object.assign(document.createElement('span'),
        { className: 'preview-page', textContent: `${at + 1} / ${flowSteps.length}` }),
    );
  }

  wrap.appendChild(stage);
  // 瀏覽模式才用文字講這一頁演什麼；編輯模式左欄每一列都已經寫著同樣的事，
  // 而右欄的空間應該留給預覽本身。拖曳提示改掛在 stage 上，需要時才浮出來。
  if (panelLevel === 'browse') {
    const caption = document.createElement('p');
    caption.className = 'preview-caption';
    caption.textContent = stepLabel(slide);
    wrap.appendChild(caption);
  } else {
    stage.title = '拖曳人物或說明文字移動、拉右下角縮放';
  }
  // stage 要先進 DOM 才量得到寬高，尺寸換算靠的是它
  requestAnimationFrame(() => updatePreviewLayout());
  return wrap;
}

// 瀏覽模式：右欄只有預覽與兩個出口。確認這是不是想要的情境，就這麼多。
// 頁清單、播放控制、圖層編輯全部推到「編輯」之後——它們是排練用的，不是確認用的。
// ---------- 瀏覽模式的自動翻頁 ----------
// 目的只有一個：讓人快速知道這個情境演什麼。所以它**只換預覽，不驅動投影**——
// 投影是給學員看的，被 3 秒一次的切換洗版就毀了。
// 同理，投影視窗開著時代表在演示，自動翻頁一律不啟動。
const BROWSE_INTERVAL = 2600;
let browseTimer = null;
let browseAutoStopped = false;   // 使用者手動翻過頁就不再自己跑

function stopBrowseAutoplay() {
  clearInterval(browseTimer);
  browseTimer = null;
}

function browseAutoplayable() {
  return panelLevel === 'browse' && flowSteps.length > 1 && !browseAutoStopped
    && !(projectionWindow && !projectionWindow.closed);
}

function startBrowseAutoplay() {
  stopBrowseAutoplay();
  if (!browseAutoplayable()) return;
  browseTimer = setInterval(() => {
    if (!browseAutoplayable()) { stopBrowseAutoplay(); return; }
    // 繞回開頭，讓人看完整輪；不呼叫 gotoFlow 就是為了不碰投影
    flowIndex = (Math.max(0, flowIndex) + 1) % flowSteps.length;
    renderFlow();
  }, BROWSE_INTERVAL);
}

function buildBrowseView(doc, preview) {
  const wrap = doc.createElement('div');
  const head = doc.createElement('div');
  head.className = 'browse-head';
  head.append(
    Object.assign(doc.createElement('span'), { className: 'browse-title', textContent: currentScenario.name }),
    Object.assign(doc.createElement('span'), {
      className: 'browse-meta',
      textContent: `${currentScenario.environment}／${currentScenario.medicalEvent}　·　${flowSteps.length} 頁`
        + (currentScenario.note ? `　·　${currentScenario.note}` : ''),
    }),
  );
  wrap.append(head);
  if (preview) wrap.append(preview);

  const actions = doc.createElement('div');
  actions.className = 'browse-actions toolbar-slot';
  actions.appendChild(flowButton(doc, '編輯', () => {
    panelLevel = 'edit';
    const now = flowIndex >= 0 && flowSteps[flowIndex] ? flowSteps[flowIndex] : currentScenario.slides[0];
    editingSlideId = now ? now.id : null;
    settingsExpanded = false;                     // 舊情境進來時設定是收著的
    renderFlow();
  }));
  wrap.append(actions);
  return wrap;
}

// 換畫面等於換脈絡：上一個畫面的訊息會跟著跑過來。實際咬過的例子是
// 「請先按『開始投影』」——它是瀏覽模式翻到綠幕頁時設的（編輯模式刻意不講這句），
// 但編輯畫面會顯示紅字，於是那句你此刻根本無能為力的話就掛在頂上不走。
let lastPanelLevel = null;

function renderFlow() {
  if (panelLevel !== lastPanelLevel) {
    if (lastPanelLevel !== null) setStatus('');
    lastPanelLevel = panelLevel;
  }
  const box = $('flow');
  const bar = $('stage-bar');
  const preview = currentScenario ? buildPreview() : null;

  let node;
  if (!currentScenario) node = document.createElement('div');
  else if (panelLevel === 'browse') node = buildBrowseView(document, preview);
  // 編輯模式自己把預覽收進右欄（sticky），所以預覽是傳進去的，不是疊在外面
  else node = buildFlowPanel(document, preview);

  box.replaceChildren(node);
  box.hidden = !currentScenario;

  // 三顆按鈕是搬過去的同一個節點，不是重建的——id、listener、啟用狀態都還在
  bar.classList.toggle('browse', panelLevel === 'browse');
  const slot = box.querySelector('.toolbar-slot');
  (slot || box.parentElement).appendChild(bar);
  bar.hidden = !currentScenario;

  document.querySelector('.workspace').classList.toggle('has-scenario', !!currentScenario);
  // 編輯是「另一個地方」，不是「同一頁多長出幾個控制項」——情境清單與頁首整個收起來，
  // 編輯佔滿畫面，靠頂部那條「‹ 回到情境」回去。分隔感靠的是版面換掉，不是欄位重排。
  document.body.classList.toggle('editing', !!currentScenario && panelLevel === 'edit');

  // 只在還沒跑時啟動：這個函式會被自動翻頁自己呼叫，每次都重設就永遠不會前進
  if (panelLevel === 'browse') { if (!browseTimer) startBrowseAutoplay(); }
  else stopBrowseAutoplay();
}

function pickAssets() {
  const env = currentEnv();
  const med = currentMed();
  // 勾哪些突發狀況由 slides 推導，不讀情境上的欄位——那個欄位刻意不存在
  const comps = currentScenario ? Scenarios.complicationsOf(currentScenario) : [];
  lastPickedComps = complicationsKey(currentScenario);

  disposeMediaSources();
  resetMediaPool();
  stopComplicationProjection();
  segmentPlayers.clear();
  currentEnvironmentAsset = null;
  currentPatientPhotoAsset = null;
  Object.keys(complicationVideoAssets).forEach(key => delete complicationVideoAssets[key]);

  const base = [];
  let patientPhoto = null;
  for (const { role, label } of BASE_ROLES) {
    const result = pickForRole(role, env, med, comps, { patientPhoto });
    if (role === 'patient_photo' && result) {
      patientPhoto = result.asset;
      currentPatientPhotoAsset = result.asset;
    }
    if (role === 'environment_video') {
      currentEnvironmentAsset = result ? result.asset : null;
      // 版面不再跟著環境素材走（那是舊的 localStorage 模型）。這裡先回到預設，
      // 真正的值在進到某一頁時由 loadLayoutFromSlide() 從該頁的圖層讀進來。
      loadLayoutFromSlide(currentSlide());
    }
    addBaseMedia(role, result && result.asset);
    base.push({ role, label, result });
  }

  // 勾選的突發狀況全部展開，不再每次隨機鎖定一個；一組可再拆成好幾個片段
  const groups = comps.map(comp => {
    const segmentNumbers = complicationSegments(comp, env, med);
    const segments = segmentNumbers.map(segment => {
      const roles = COMP_ROLES.map(({ role, label }) => {
        const result = pickForRole(role, env, med, [comp],
          { memoKey: `${role}|${segmentKey(comp, segment)}`, segment });
        if (role === 'complication_video' && result) {
          complicationVideoAssets[segmentKey(comp, segment)] = result.asset;
        }
        return { role, label, result };
      });
      const assetOf = wanted => {
        const found = roles.find(r => r.role === wanted);
        return found && found.result ? found.result.asset : null;
      };
      addSegmentMedia(comp, segment, assetOf('complication_video'), assetOf('complication_voice'));
      // 靜態綠幕沒有可播媒體，但仍要能觸發投影疊加，所以一律登記
      segmentPlayers.set(segmentKey(comp, segment), () => playSegmentMedia(comp, segment));
      return { segment, roles };
    });
    return { comp, segmentNumbers, segments };
  });

  updateStageButtons();
  updateProjectionButton();
  renderProjectionScene();
  return { env, med, comps, base, groups };
}

function stopMediaIn(root) {
  root.querySelectorAll('audio, video').forEach(el => { el.pause(); el.currentTime = 0; });
}

// **這一顆管的是整場的底噪，不是某一頁。** 分工：
//   環境音（這裡）→ 把環境聲音與病患聲音這層底噪開起來或收掉
//   流程翻頁      → 每頁觸發該頁的那一段演出（runStep），底噪不動
// runStep 刻意不碰底噪，所以這裡是**唯一**會讓環境聲音響起來的地方。
//
// 原本是「播放場景」＋「全部停止」兩顆。前者名不副實——它播的是背景音，不是場景；
// 後者的工作其實已經被別的東西涵蓋（翻頁會收掉上一段演出、關投影視窗會停投影），
// 剩下唯一專屬的功能就是「把底噪關掉」，那正好是這顆按鈕自己的反向操作。
// 所以收成一顆自帶開關的按鈕：按下去開，再按一次關。
// 用一個明確的旗標，不讀 el.paused：play() 之後 paused 何時翻面各家瀏覽器不保證，
// 讀它會讓按鈕文字偶爾停在錯的一邊。
let ambienceOn = false;

function ambiencePlaying() {
  return ambienceOn;
}

function toggleAmbience() {
  if (ambienceOn) {
    poolBase.forEach(el => { el.pause(); el.currentTime = 0; });
    stopProjection();
    ambienceOn = false;
  } else {
    poolBase.forEach(el => { el.currentTime = 0; el.play().catch(() => {}); });
    playProjection();
    ambienceOn = true;
  }
  updateStageButtons();
}

// 離開情境或結束流程時要把所有聲音收乾淨——包含正在演的那一段
function stopAll() {
  stopMediaIn($('media-pool'));
  stopComplicationProjection();
  stopProjection();
  ambienceOn = false;
  updateStageButtons();
}

// ---------- 快捷鍵 ----------
// 教官的手不會固定在某一個視窗上，所以主視窗與投影視窗都要掛一份。
// 焦點在會打字／有自己左右語意的元件上時放行——不然使用者在調滑桿或選單，
// 按方向鍵卻跳了頁。
const TYPING_TAGS = ['INPUT', 'SELECT', 'TEXTAREA', 'OPTION'];

// **BUTTON 刻意不在上面那張表裡。** 按鈕沒有左右語意，擋掉方向鍵的唯一效果是：
// 用滑鼠點過「下一頁」「＋ 新增頁」之後，焦點留在那顆按鈕上，方向鍵就整個失效——
// 而焦點是看不見的，所以那看起來就是「方向鍵壞了」。
// 但**空白鍵要留給按鈕本身**：那是它的啟動鍵，拿去翻頁的話按鈕就按不動了。
function flowKeyBlocked(target, key) {
  if (!target) return false;
  if (target.isContentEditable) return true;
  if (TYPING_TAGS.includes(target.tagName)) return true;
  return target.tagName === 'BUTTON' && (key === ' ' || key === 'Spacebar');
}

function handleFlowKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (flowKeyBlocked(e.target, e.key)) return;

  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': case 'Spacebar':
      if (!flowSteps.length) return;
      e.preventDefault();
      if (flowIndex < 0) gotoFlow(0); else nextFlow();
      break;
    case 'ArrowLeft': case 'PageUp':
      if (!flowSteps.length) return;
      e.preventDefault();
      prevFlow();
      break;
    case 'Home':
      if (!flowSteps.length) return;
      e.preventDefault();
      gotoFlow(0);
      break;
    case 'End':
      if (!flowSteps.length) return;
      e.preventDefault();
      gotoFlow(flowSteps.length - 1);
      break;
    case 'Escape':
      e.preventDefault();
      stopFlow();
      break;
    default:
  }
}

document.addEventListener('keydown', handleFlowKey);

$('btn-project').addEventListener('click', openProjection);
$('btn-play').addEventListener('click', toggleAmbience);
$('btn-mute').addEventListener('click', toggleMute);
$('volume-slider').addEventListener('input', e => setVolume(e.target.value));
renderVolumeControl();

// 預覽裡的尺寸有兩項是「依舞台實際寬高算成 px 存下來的」（圖層的尺寸上限、
// 舞台自己能有多大），視窗一改就過期。編輯畫面是固定一個視窗高的版面，
// 改視窗高度卻不重算的話，畫面不會報錯，只會安靜地不合身。
window.addEventListener('resize', updatePreviewLayout);

window.addEventListener('beforeunload', () => {
  if (projectionWindow && !projectionWindow.closed) projectionWindow.close();
});
init();
</script>
</body>
</html>
