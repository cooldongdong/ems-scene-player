<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防員場 事件腳本產生器</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #23272f;
    --line: #31363f;
    --text: #e9ecf1;
    --muted: #99a1af;
    --accent: #ff6b3d;
    --accent-dim: #ff6b3d22;
    --ok: #4ec9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 72px; }
  header h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .field label.title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  select {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-dim); }
  .checks input { accent-color: var(--accent); margin: 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px; }
  button {
    font-family: inherit; font-size: 15px; padding: 11px 22px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* 病患照片疊加：開關與版面微調就放在照片旁邊，邊看照片邊調 */
  .overlay-controls {
    margin-top: 8px; padding: 9px 11px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    display: grid; gap: 8px;
  }
  .overlay-controls:has(input[type="checkbox"]:checked) { border-color: var(--accent); }
  .overlay-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer; }
  .overlay-toggle input { margin: 0; accent-color: var(--accent); }
  /* 卡片夠寬時滑桿排成兩欄，窄的時候自動疊回一欄 */
  .overlay-sliders { display: grid; gap: 6px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .overlay-slider {
    display: grid; grid-template-columns: 32px 1fr 38px; align-items: center;
    gap: 8px; font-size: 12px; color: var(--muted);
  }
  .overlay-slider input { width: 100%; margin: 0; accent-color: var(--accent); }
  .overlay-slider output { text-align: right; font-family: ui-monospace, monospace; }
  .overlay-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .overlay-hint { font-size: 11px; line-height: 1.5; color: var(--muted); flex: 1 1 140px; }
  .overlay-buttons { display: flex; gap: 8px; flex: none; }
  .overlay-controls button.reset { font-size: 13px; padding: 5px 12px; white-space: nowrap; }
  .overlay-controls button.preview.on { border-color: var(--accent); background: var(--accent-dim); }

  #status { color: var(--muted); font-size: 13px; }
  #status.error { color: var(--accent); }

  /* 同一個事件裡的影片／照片／配音維持由上而下的閱讀順序 */
  .cards { display: grid; gap: 12px; margin-top: 18px; grid-template-columns: 1fr; }
  /* 六個突發狀況彼此獨立，排成網格才不會把整頁拉成一長條 */
  #comp-groups {
    display: grid; gap: 16px; margin-top: 16px; align-items: start;
    /* min() 讓視窗比 420px 還窄時軌道能跟著縮，不然會撐出橫向捲動 */
    grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
  }
  .group-note { grid-column: 1 / -1; }
  /* 一次訓練可能要演多個突發狀況，所以勾選的每一項都各自成一組（影片＋聲音）並列在頁面上 */
  .comp-group {
    padding: 14px 16px 16px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  }
  .comp-group-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .comp-group-title { margin: 0; font-size: 17px; }
  .comp-group-title .seq {
    display: inline-block; min-width: 22px; margin-right: 8px; padding: 1px 8px;
    border-radius: 999px; background: var(--accent); color: #1a1005;
    font-size: 13px; font-weight: 700; text-align: center;
  }
  .comp-group-actions { display: flex; gap: 8px; }
  .comp-group-actions button { font-size: 13px; padding: 6px 14px; }
  .comp-group .cards { margin-top: 12px; }
  .comp-group .card { background: var(--panel); }
  /* 拆成多段時，每段自己一個可觸發的區塊 */
  .comp-segment {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .comp-segment-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .comp-segment-title { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
  .comp-segment .cards { margin-top: 10px; }
  .group-note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; gap: 10px;
    grid-template-columns: 1fr; align-content: start; min-width: 0;
  }
  .role {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    font-size: 12px; color: var(--muted);
  }
  .role strong { font-size: 15px; color: var(--text); }
  .desc { margin: 0 0 6px; font-size: 14px; }
  /* 素材路徑是不能斷行的長字串，窄視窗會把卡片撐出橫向捲動 */
  .meta { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 8px;
  }
  .badge.hit { border-color: var(--ok); color: var(--ok); }
  .badge.only { border-style: dashed; }
  @keyframes flash {
    from { border-color: var(--accent); background: var(--accent-dim); }
    to   { border-color: var(--line); background: var(--panel); }
  }
  .card.changed { animation: flash 1.1s ease-out; }
  .card.empty .desc { color: var(--muted); }
  .line {
    margin: 0 0 8px; padding: 8px 12px;
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    background: var(--panel-2); font-size: 15px;
  }
  .tts {
    margin: 0 0 8px; padding: 8px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  }
  .tts summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .tts[open] summary { margin-bottom: 8px; color: var(--text); }
  .tts-meta { font-size: 12px; color: var(--muted); }
  .tts pre {
    margin: 8px 0 10px; padding: 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line);
    font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .tts button.copy { font-size: 13px; padding: 5px 12px; }
  .none-note {
    color: var(--muted); font-size: 13px; padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: 8px;
  }
  audio { width: 100%; margin-top: 4px; }
  .media-options { display: grid; gap: 8px; }
  .media-option {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2);
  }
  .media-option.selected { border-color: var(--accent); }
  .media-option-label { color: var(--muted); font-size: 12px; word-break: break-all; }
  /* 直式綠幕素材有 720×1280，一定要限高，否則一張卡就比一個螢幕還長 */
  .card img {
    display: block; width: auto; max-width: 100%; max-height: 190px;
    border-radius: 8px; border: 1px solid var(--line);
  }
  /* 影片保持滿寬，控制列才夠空間；畫面本身用 contain 不裁切 */
  .card video {
    display: block; width: 100%; height: 190px;
    object-fit: contain; background: #0d0f12;
    border-radius: 8px; border: 1px solid var(--line);
  }
  .missing { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
  .fallback-media { display: grid; gap: .45rem; }
  .fallback-note { color: #9a5b00; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>消防員場 事件腳本產生器</h1>
    <p>選環境、急救事件與突發狀況，自動從素材庫組出情境卡；勾選的每個突發狀況都會各自成一組（影片＋聲音），訓練時再逐一播放。</p>
  </header>

  <section class="panel">
    <div class="controls">
      <div class="field">
        <label class="title" for="sel-env">環境（單選）</label>
        <select id="sel-env"></select>
      </div>
      <div class="field">
        <label class="title" for="sel-med">急救事件（單選）</label>
        <select id="sel-med"></select>
      </div>
      <div class="field">
        <span class="title">突發狀況（可複選）</span>
        <div class="checks" id="checks-comp"></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="btn-gen" disabled>產生情境</button>
      <button id="btn-project" disabled>開啟投影視窗</button>
      <button id="btn-play" disabled>播放場景</button>
      <button id="btn-stop" disabled>全部停止</button>
      <span id="status">載入素材庫中…</span>
    </div>
  </section>

  <div class="cards" id="cards"></div>
  <div id="comp-groups"></div>
</div>

<script src="vendor/js-yaml.min.js"></script>
<script>
// 本地 vendor 讀不到時（例如只丟了 index.html）退回 CDN
if (typeof jsyaml === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"><\/script>');
}
</script>
<script>
const ROLES = [
  { role: 'environment_video',  label: '環境影像' },
  { role: 'ambient_sound',      label: '環境聲音' },
  { role: 'patient_photo',      label: '病患樣貌照片' },
  { role: 'patient_voice',      label: '病患聲音' },
  { role: 'complication_video', label: '突發狀況綠幕影片' },
  { role: 'complication_voice', label: '突發狀況聲音' },
];
// 這兩個角色一律成對綁在同一個突發狀況上，避免影片與台詞來自不同事件
const COMPLICATION_ROLES = ['complication_video', 'complication_voice'];
const BASE_ROLES = ROLES.filter(r => !COMPLICATION_ROLES.includes(r.role));
const COMP_ROLES = ROLES.filter(r => COMPLICATION_ROLES.includes(r.role));
const PATIENT_PAIR_TAGS = ['gender', 'ageGroup'];
// 決定「哪一筆素材比較貼合這次條件」的維度，順序不影響結果
const SPECIFICITY_TAGS = ['environment', 'medicalEvent', 'complication'];

let DATA = null;
// key = 基本角色的 role，或突發狀況的 `role|突發狀況`（同一次可有多組，不能只用 role）
const lastPicked = {};   // key -> 上一次選到的 id，重新產生時盡量換一個
const shownIds = {};     // key -> 目前卡片上的 id，用來標出這次換了哪幾張
const mediaObjectUrls = new Set();
const mediaLoadControllers = new Set();
let genCount = 0;
let currentEnvironmentAsset = null;
let currentPatientPhotoAsset = null;
let projectionWindow = null;

// 病患疊加的開關與版面；size 是「照片可佔畫面的比例」，x／y 是照片中心點位置
const PATIENT_OVERLAY_DEFAULTS = { size: 85, x: 50, y: 57 };
const patientOverlay = { enabled: false, ...PATIENT_OVERLAY_DEFAULTS };
const PATIENT_OVERLAY_SLIDERS = [
  { key: 'size', label: '大小', min: 10, max: 100 },
  { key: 'x',    label: '水平', min: 0,  max: 100 },
  { key: 'y',    label: '垂直', min: 0,  max: 100 },
];

// 綠幕疊加：每個突發狀況各自記版面與去背容差，重新產生情境後沿用
const COMP_OVERLAY_DEFAULTS = { size: 70, x: 50, y: 55, tolerance: 40 };
const COMP_OVERLAY_SLIDERS = [
  { key: 'size',      label: '大小', min: 10, max: 100 },
  { key: 'x',         label: '水平', min: 0,  max: 100 },
  { key: 'y',         label: '垂直', min: 0,  max: 100 },
  // 容差再往上會開始吃掉白色、深色制服這類低彩度的顏色，所以上限收在 60
  { key: 'tolerance', label: '去背', min: 5,  max: 60, unit: '' },
];
// 一個突發狀況可以拆成好幾個片段，素材以 `突發狀況|片段` 當 key；
// 但版面設定是整個突發狀況共用一份——同一個人站在同一個位置，不該每段重調一次。
const complicationOverlays = {};       // 突發狀況 -> 版面設定
const complicationOverlayBoxes = [];   // { comp, sync }：同組各片段的滑桿要一起動
const complicationVideoAssets = {};    // 片段 -> 本次選到的綠幕素材
let activeComplication = null;         // 目前疊在投影上的那一段（含預覽）
let activeSegment = null;

function segmentKey(comp, segment) {
  return `${comp}|${segment}`;
}

function complicationOverlay(comp) {
  return complicationOverlays[comp] || (complicationOverlays[comp] = { ...COMP_OVERLAY_DEFAULTS });
}

// 疊加版面依「當下的環境素材」存進 localStorage：同一個場景的人物位置每次訓練都一樣，
// 換到別的環境（甚至同環境的另一張背景）本來就該是另一組位置。
const OVERLAY_STORE_KEY = 'scene-player.overlay-layouts.v1';
let overlayStoreEnv = null;   // 目前這份版面屬於哪一筆 environment_video 素材

function readOverlayStore() {
  try {
    const raw = JSON.parse(localStorage.getItem(OVERLAY_STORE_KEY));
    return raw && typeof raw === 'object' ? raw : {};
  } catch {
    return {};   // 內容壞掉就當作沒存過，不要卡住整個頁面
  }
}

// 存進來的值可能被手改過，一律夾回滑桿範圍
function sanitizeLayout(raw, defaults, sliders) {
  const layout = { ...defaults };
  if (!raw || typeof raw !== 'object') return layout;
  for (const { key, min, max } of sliders) {
    const value = Number(raw[key]);
    if (Number.isFinite(value)) layout[key] = Math.min(max, Math.max(min, Math.round(value)));
  }
  return layout;
}

function saveOverlayLayouts() {
  if (!overlayStoreEnv) return;
  const store = readOverlayStore();
  store[overlayStoreEnv] = {
    patient: sanitizeLayout(patientOverlay, PATIENT_OVERLAY_DEFAULTS, PATIENT_OVERLAY_SLIDERS),
    complications: Object.fromEntries(Object.entries(complicationOverlays)
      .map(([comp, layout]) => [comp, sanitizeLayout(layout, COMP_OVERLAY_DEFAULTS, COMP_OVERLAY_SLIDERS)])),
  };
  try {
    localStorage.setItem(OVERLAY_STORE_KEY, JSON.stringify(store));
  } catch {
    // 無痕模式或容量滿：記不起來而已，不影響這次操作
  }
}

function loadOverlayLayouts(envAssetId) {
  overlayStoreEnv = envAssetId || null;
  Object.assign(patientOverlay, PATIENT_OVERLAY_DEFAULTS);
  Object.keys(complicationOverlays).forEach(comp => delete complicationOverlays[comp]);
  if (!envAssetId) return;

  const saved = readOverlayStore()[envAssetId];
  if (!saved) return;
  Object.assign(patientOverlay,
    sanitizeLayout(saved.patient, PATIENT_OVERLAY_DEFAULTS, PATIENT_OVERLAY_SLIDERS));
  for (const [comp, layout] of Object.entries(saved.complications || {})) {
    complicationOverlays[comp] = sanitizeLayout(layout, COMP_OVERLAY_DEFAULTS, COMP_OVERLAY_SLIDERS);
  }
}

function syncComplicationOverlayBoxes(comp) {
  complicationOverlayBoxes.forEach(box => { if (box.comp === comp) box.sync(); });
}

// 素材沒寫 segment 就是第 1 段；現有只有一段的資料完全不用改
function segmentOf(asset) {
  const value = Number(asset.segment);
  return Number.isFinite(value) && value > 0 ? Math.floor(value) : 1;
}

// 這個突發狀況在目前條件下被拆成哪幾段
function complicationSegments(comp, env, med) {
  const found = new Set();
  for (const asset of DATA.assets) {
    if (!COMPLICATION_ROLES.includes(asset.role)) continue;
    if (!intersects(asset.tags?.complication, [comp])) continue;
    if (!tagAllows(asset.tags?.environment, env)) continue;
    if (!tagAllows(asset.tags?.medicalEvent, med)) continue;
    found.add(segmentOf(asset));
  }
  return found.size ? [...found].sort((a, b) => a - b) : [1];
}

const $ = id => document.getElementById(id);
const status = $('status');

function setStatus(msg, isError) {
  status.textContent = msg;
  status.classList.toggle('error', !!isError);
}

async function init() {
  try {
    // no-cache：改完 YAML 重新整理就要看到新資料，不能讀到瀏覽器快取的舊版
    const res = await fetch('scenario-data.yaml', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (typeof jsyaml === 'undefined') throw new Error('js-yaml 未載入');
    DATA = jsyaml.load(await res.text());
    if (!DATA || !Array.isArray(DATA.assets)) throw new Error('scenario-data.yaml 缺少 assets 陣列');
    buildControls();
    $('btn-gen').disabled = false;
    setStatus(`素材庫已載入：${DATA.assets.length} 筆`);
  } catch (err) {
    setStatus('讀取 scenario-data.yaml 失敗：' + err.message + '（請用本地伺服器開啟，例如 python3 -m http.server 8000）', true);
  }
}

function optionsFor(dim) {
  const declared = DATA.options && DATA.options[dim];
  if (Array.isArray(declared) && declared.length) return declared;
  // options 沒寫時，從素材標籤自動蒐集
  const seen = new Set();
  DATA.assets.forEach(a => (a.tags?.[dim] || []).forEach(v => seen.add(v)));
  return [...seen];
}

// environment 可在 YAML 依室內／室外分組；舊版平鋪陣列和未宣告 options 的資料也可繼續使用。
function environmentGroups() {
  const declared = DATA.options && DATA.options.environment;
  if (declared && !Array.isArray(declared) && typeof declared === 'object') {
    const groups = Object.entries(declared)
      .filter(([, values]) => Array.isArray(values) && values.length);
    if (groups.length) return groups;
  }
  return [['未分類', optionsFor('environment')]];
}

function buildControls() {
  const env = $('sel-env');
  env.innerHTML = '';
  for (const [group, values] of environmentGroups()) {
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group });
    for (const value of values) {
      optgroup.appendChild(Object.assign(document.createElement('option'), { value, textContent: value }));
    }
    env.appendChild(optgroup);
  }

  const med = $('sel-med');
  med.innerHTML = '';
  for (const value of optionsFor('medicalEvent')) {
    med.appendChild(Object.assign(document.createElement('option'), { value, textContent: value }));
  }
  const box = $('checks-comp');
  box.innerHTML = '';
  for (const v of optionsFor('complication')) {
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'checkbox', value: v });
    label.append(input, document.createTextNode(v));
    box.appendChild(label);
  }
}

function selectedComplications() {
  return [...document.querySelectorAll('#checks-comp input:checked')].map(i => i.value);
}

// 空陣列＝該維度不限
function tagAllows(list, picked) {
  return !list || list.length === 0 || list.includes(picked);
}
function intersects(list, picks) {
  return (list || []).some(v => picks.includes(v));
}

// 特異性 = 有幾個維度被指定了範圍。gender／ageGroup 不算，那是配對條件不是精準度。
function specificity(asset) {
  return SPECIFICITY_TAGS.reduce((score, dim) => score + ((asset.tags?.[dim] || []).length ? 1 : 0), 0);
}

function patientTagsCompatible(asset, patientPhoto) {
  if (!patientPhoto) return true;
  return PATIENT_PAIR_TAGS.every(tag => {
    const candidate = asset.tags?.[tag] || [];
    const selected = patientPhoto.tags?.[tag] || [];
    return candidate.length === 0 || selected.length === 0 || intersects(candidate, selected);
  });
}

function pickForRole(role, env, med, comps, { patientPhoto = null, memoKey = role, segment = null } = {}) {
  const pool = DATA.assets.filter(a => a.role === role
    && (segment === null || segmentOf(a) === segment));

  // 1. 必要條件：環境／急救事件相符或通用
  let eligible = pool.filter(a =>
    tagAllows(a.tags?.environment, env) && tagAllows(a.tags?.medicalEvent, med));

  // 病患聲音必須與本次選到的照片性別、年齡層相容；空標籤代表通用（例如無呼吸、無反應）。
  if (role === 'patient_voice') {
    eligible = eligible.filter(a => patientTagsCompatible(a, patientPhoto));
  }

  // 2. 綁定特定突發狀況的素材，只有在該狀況被勾選時才可用
  eligible = eligible.filter(a => {
    const c = a.tags?.complication || [];
    return c.length === 0 || intersects(c, comps);
  });

  // 突發狀況素材：沒勾狀況就不出現，也不用通用素材頂替
  if (COMPLICATION_ROLES.includes(role)) {
    eligible = comps.length ? eligible.filter(a => intersects(a.tags?.complication, comps)) : [];
  }

  if (!eligible.length) return null;

  // 3. 特異性優先：標籤填得越精準的素材越優先，通用素材只在沒有專屬素材時頂替。
  //    例如「市區街道＋車禍」時，標了車禍的路口照要贏過任何路邊都能用的騎樓照；
  //    沒有這一步的話兩者機率相同，專屬標籤等於只是「也能被抽到」而已。
  const best = Math.max(...eligible.map(specificity));
  const candidates = eligible.filter(a => specificity(a) === best);

  // 同條件重新產生時盡量換一筆
  let picks = candidates;
  if (picks.length > 1 && lastPicked[memoKey]) {
    const others = picks.filter(a => a.id !== lastPicked[memoKey]);
    if (others.length) picks = others;
  }

  const chosen = picks[Math.floor(Math.random() * picks.length)];
  lastPicked[memoKey] = chosen.id;
  return {
    asset: chosen,
    hit: intersects(chosen.tags?.complication, comps),
    // 實際會被抽到的筆數（已排除輸掉特異性的通用素材），用來說明「為什麼重新產生沒變」
    poolSize: candidates.length,
  };
}

// file 可填單一檔名字串或多個檔名陣列；素材資料夾固定為 assets/<role>/。
// 仍接受舊版完整相對路徑，以及外部 URL，方便既有資料逐步遷移。
function assetFiles(asset) {
  const values = Array.isArray(asset.file) ? asset.file : [asset.file];
  return values
    .filter(file => typeof file === 'string')
    .map(file => file.trim())
    .filter(Boolean);
}

function assetPath(asset, file = assetFiles(asset)[0]) {
  if (typeof file !== 'string' || !file) return file;
  if (/^(?:[a-z][a-z0-9+.-]*:|\/|\.{1,2}\/)/i.test(file) || file.includes('/')) return file;
  return `assets/${asset.role}/${file}`;
}

function fallbackFiles(asset) {
  const files = Array.isArray(asset.fallback) ? asset.fallback : [asset.fallback];
  return files
    .filter(file => typeof file === 'string' && /\.(jpg|jpeg|png)$/i.test(file))
    .map(file => assetPath(asset, file));
}

// 副檔名優先於 YAML 的 type：真實素材常常換格式（例如綠幕從影片換成一張劇照），
// 這樣只要換檔案就能用，type 一時沒跟著改也不會讓整張卡壞掉。
function mediaKind(asset, file = assetPath(asset, assetFiles(asset)[0])) {
  if (asset.type === 'none') return 'none';
  if (typeof file === 'string') {
    if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(file)) return 'video';
    if (/\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(file)) return 'image';
    if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)$/i.test(file)) return 'audio';
  }
  return asset.type || 'audio';
}

function absoluteAssetUrl(file) {
  try {
    return new URL(file, document.baseURI).href;
  } catch {
    return file;
  }
}

function missingMedia(file) {
  const note = document.createElement('div');
  note.className = 'missing';
  note.textContent = '找不到素材檔：' + file;
  return note;
}

function imageMedia(file, description, onError) {
  const image = document.createElement('img');
  image.src = file;
  image.alt = description || '環境圖片';
  image.addEventListener('error', () => {
    const replacement = onError ? onError() : missingMedia(file);
    image.replaceWith(replacement);
  }, { once: true });
  return image;
}

function playableIn(root) {
  return root ? root.querySelectorAll('audio[src], video[src]').length > 0 : false;
}

function updatePlaybackButtons() {
  const scene = playableIn($('cards'));
  const groups = $('comp-groups');
  let anySegment = false;
  // 每個片段各自一顆播放鈕；靜態綠幕沒有可播媒體，但仍要能觸發投影疊加
  groups.querySelectorAll('button.play').forEach(button => {
    const block = button.closest('.comp-segment') || button.closest('.comp-group');
    const asset = complicationVideoAssets[segmentKey(button.dataset.comp, button.dataset.segment)];
    button.disabled = !playableIn(block) && !hasProjectableComplication(asset);
    if (!button.disabled) anySegment = true;
  });
  $('btn-play').disabled = !scene;
  $('btn-stop').disabled = !scene && !playableIn(groups) && !anySegment;
}

function updateProjectionButton() {
  const hasEnvironment = currentEnvironmentAsset
    && currentEnvironmentAsset.type !== 'none'
    && assetFiles(currentEnvironmentAsset).length > 0;
  $('btn-project').disabled = !hasEnvironment;
}

function hasProjectablePatientPhoto(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  return !!file && mediaKind(asset, file) === 'image';
}

function projectionMarkup() {
  return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情境環境投影</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  body {
    color: #fff;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  #projection-stage, #projection-stage > img, #projection-stage > video {
    width: 100%; height: 100%;
  }
  #projection-stage > img, #projection-stage > video {
    display: block;
    border: 0;
    object-fit: cover;
    object-position: center;
    background: #000;
  }
  #projection-patient-layer {
    position: fixed; inset: 0; z-index: 1;
    display: none; pointer-events: none;
  }
  #projection-patient-layer.visible { display: block; }
  /* 大小與位置由主畫面的滑桿以 inline style 寫入 max-width／max-height／left／top */
  #projection-patient-layer > img {
    position: absolute; display: block;
    width: auto; height: auto; object-fit: contain;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.4));
  }
  /* 綠幕人物站在病患之上；canvas 由主畫面逐幀去背後畫進來 */
  #projection-complication-layer {
    position: fixed; inset: 0; z-index: 2;
    display: none; pointer-events: none;
  }
  #projection-complication-layer.visible { display: block; }
  #projection-complication-layer > video, #projection-complication-layer > img { display: none; }
  #projection-complication-layer > canvas {
    position: absolute; display: block;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.4));
  }
  #projection-message {
    position: absolute; inset: 0; z-index: 3; display: none; place-items: center;
    padding: 32px; background: #000; color: #fff; text-align: center;
    font-size: clamp(18px, 2.4vw, 32px);
  }
  #projection-controls {
    position: fixed; top: 18px; right: 18px; z-index: 4;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,.3);
    border-radius: 10px; background: rgba(0,0,0,.72);
    opacity: 1; transition: opacity .2s ease;
  }
  body.projection-idle #projection-controls { opacity: .18; }
  #projection-controls:hover, #projection-controls:focus-within { opacity: 1; }
  #projection-hint { font-size: 13px; color: rgba(255,255,255,.75); }
  #projection-fullscreen {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.55);
    border-radius: 7px; background: #fff; color: #111;
    font: 700 14px/1.2 inherit; cursor: pointer;
  }
  #projection-fullscreen:focus-visible { outline: 3px solid #ff6b3d; outline-offset: 2px; }
  @media (max-width: 640px) { #projection-hint { display: none; } }
</style>
</head>
<body>
  <main id="projection-stage" aria-label="情境環境投影"></main>
  <div id="projection-patient-layer" aria-label="病患照片疊加層"></div>
  <div id="projection-complication-layer" aria-label="突發狀況綠幕疊加層"></div>
  <div id="projection-message" role="status"></div>
  <div id="projection-controls">
    <span id="projection-hint">將視窗移至投影螢幕後，可進入全螢幕</span>
    <button id="projection-fullscreen" type="button">進入全螢幕</button>
  </div>
</body>
</html>`;
}

function maximizeProjectionWindow(win) {
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  try {
    win.moveTo(left, top);
    win.resizeTo(window.screen.availWidth, window.screen.availHeight);
  } catch {
    // 瀏覽器可能基於權限或視窗設定忽略 moveTo／resizeTo，仍可由投影視窗進入全螢幕。
  }
}

function setupProjectionWindow(win) {
  const doc = win.document;
  doc.open();
  doc.write(projectionMarkup());
  doc.close();

  const fullscreenButton = doc.getElementById('projection-fullscreen');
  const hint = doc.getElementById('projection-hint');
  const defaultHint = hint.textContent;
  let idleTimer = null;
  const revealControls = () => {
    doc.body.classList.remove('projection-idle');
    win.clearTimeout(idleTimer);
    idleTimer = win.setTimeout(() => doc.body.classList.add('projection-idle'), 3500);
  };
  const updateFullscreenLabel = () => {
    fullscreenButton.textContent = doc.fullscreenElement ? '離開全螢幕' : '進入全螢幕';
    revealControls();
  };
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (doc.fullscreenElement) {
        await doc.exitFullscreen();
      } else {
        await doc.documentElement.requestFullscreen();
      }
    } catch {
      hint.textContent = '瀏覽器未允許全螢幕，請使用瀏覽器的全螢幕功能。';
      win.setTimeout(() => { hint.textContent = defaultHint; }, 3500);
    }
  });
  doc.addEventListener('pointermove', revealControls);
  doc.addEventListener('keydown', revealControls);
  doc.addEventListener('click', () => {
    const video = doc.querySelector('#projection-stage video');
    if (video && video.paused) video.play().catch(() => {});
  });
  doc.addEventListener('fullscreenchange', updateFullscreenLabel);
  win.addEventListener('beforeunload', () => {
    win.clearTimeout(idleTimer);
    if (projectionWindow !== win) return;
    projectionWindow = null;
    stopComplicationProjection();
    $('btn-project').textContent = '開啟投影視窗';
  });
  revealControls();
}

function showProjectionMessage(doc, text) {
  const message = doc.getElementById('projection-message');
  message.textContent = text;
  message.style.display = 'grid';
}

function renderProjectionImage(doc, files, description, missingSource) {
  const stage = doc.getElementById('projection-stage');
  const message = doc.getElementById('projection-message');
  let index = 0;

  const tryNext = () => {
    const file = files[index++];
    if (!file) {
      showProjectionMessage(doc, '找不到環境素材：' + missingSource);
      return;
    }
    const image = doc.createElement('img');
    image.src = absoluteAssetUrl(file);
    image.alt = description || '環境圖片';
    image.addEventListener('load', () => { message.style.display = 'none'; }, { once: true });
    image.addEventListener('error', tryNext, { once: true });
    stage.replaceChildren(image);
  };
  tryNext();
}

function projectionDocument() {
  if (!projectionWindow || projectionWindow.closed) return null;
  try {
    return projectionWindow.document;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
    return null;
  }
}

// 只改樣式、不重載圖片，拖滑桿時投影畫面才能即時跟著動
function applyPatientOverlayLayout() {
  const doc = projectionDocument();
  const image = doc && doc.querySelector('#projection-patient-layer > img');
  if (!image) return;
  image.style.maxWidth = patientOverlay.size + 'vw';
  image.style.maxHeight = patientOverlay.size + 'vh';
  image.style.left = patientOverlay.x + '%';
  image.style.top = patientOverlay.y + '%';
}

function renderProjectionPatient() {
  const doc = projectionDocument();
  if (!doc) return;

  const layer = doc.getElementById('projection-patient-layer');
  layer.classList.remove('visible');
  layer.replaceChildren();
  if (!patientOverlay.enabled || !hasProjectablePatientPhoto(currentPatientPhotoAsset)) return;

  const file = assetPath(currentPatientPhotoAsset, assetFiles(currentPatientPhotoAsset)[0]);
  const image = doc.createElement('img');
  image.src = absoluteAssetUrl(file);
  image.alt = currentPatientPhotoAsset.description || '病患照片';
  image.addEventListener('load', () => layer.classList.add('visible'), { once: true });
  image.addEventListener('error', () => {
    layer.classList.remove('visible');
    layer.replaceChildren();
  }, { once: true });
  layer.appendChild(image);
  applyPatientOverlayLayout();
}

// 綠幕即時去背：綠幕色取 dev.md 指定的 #00b140，比對 YCbCr 的色度距離，
// 比直接比 RGB 耐得住打光不均；容差由該組的滑桿控制。
const KEY_RGB = { r: 0, g: 177, b: 64 };
const KEY_CB = -0.169 * KEY_RGB.r - 0.331 * KEY_RGB.g + 0.5 * KEY_RGB.b;
const KEY_CR = 0.5 * KEY_RGB.r - 0.419 * KEY_RGB.g - 0.081 * KEY_RGB.b;
const KEY_SOFT_EDGE = 26;    // 容差外再往外這麼多做半透明軟邊，邊緣才不會像鋸齒
const KEY_MAX_WIDTH = 960;   // canvas 內部解析度上限，控制逐像素運算量

let chromaFrame = null;      // { win, id }：進行中的 requestAnimationFrame
let chromaRedraw = null;     // 暫停預覽時，改滑桿要重畫一次
let chromaToken = 0;         // 換素材後，舊 video 的事件不該再影響新的
let complicationPreviewing = false;

function chromaKeyFrame(ctx, video, width, height, tolerance) {
  ctx.drawImage(video, 0, 0, width, height);
  const frame = ctx.getImageData(0, 0, width, height);
  const data = frame.data;
  const near = tolerance * tolerance;
  const far = (tolerance + KEY_SOFT_EDGE) * (tolerance + KEY_SOFT_EDGE);
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const dcb = (-0.169 * r - 0.331 * g + 0.5 * b) - KEY_CB;
    const dcr = (0.5 * r - 0.419 * g - 0.081 * b) - KEY_CR;
    const dist = dcb * dcb + dcr * dcr;
    if (dist >= far) continue;
    data[i + 3] = dist <= near
      ? 0
      : Math.round(255 * (Math.sqrt(dist) - tolerance) / KEY_SOFT_EDGE);
    // 抑制人物邊緣殘留的綠光
    const limit = (r + b) / 2;
    if (g > limit) data[i + 1] = limit;
  }
  ctx.putImageData(frame, 0, 0);
}

function cancelChromaLoop() {
  if (!chromaFrame) return;
  try { chromaFrame.win.cancelAnimationFrame(chromaFrame.id); } catch { /* 視窗已關閉 */ }
  chromaFrame = null;
}

// 只改樣式、不重載影片，拖滑桿時投影畫面才能即時跟著動
function applyComplicationOverlayLayout() {
  const doc = projectionDocument();
  const canvas = doc && doc.querySelector('#projection-complication-layer > canvas');
  if (!canvas || !activeComplication) return;
  const layout = complicationOverlay(activeComplication);
  canvas.style.maxWidth = layout.size + 'vw';
  canvas.style.maxHeight = layout.size + 'vh';
  canvas.style.left = layout.x + '%';
  canvas.style.top = layout.y + '%';
}

function stopComplicationProjection() {
  cancelChromaLoop();
  chromaToken++;
  chromaRedraw = null;
  activeComplication = null;
  activeSegment = null;
  complicationPreviewing = false;
  const doc = projectionDocument();
  if (doc) {
    const layer = doc.getElementById('projection-complication-layer');
    layer.classList.remove('visible');
    layer.querySelectorAll('video').forEach(video => {
      video.pause();
      video.removeAttribute('src');
      video.load();
    });
    layer.replaceChildren();
  }
  refreshComplicationPreviewButtons();
}

// 綠幕素材可以是影片，也可以是一張綠幕劇照
function hasProjectableComplication(asset) {
  if (!asset || asset.type === 'none') return false;
  const file = assetPath(asset, assetFiles(asset)[0]);
  if (!file) return false;
  return ['video', 'image'].includes(mediaKind(asset, file));
}

// 疊上去一律先停在第一格；mode 'play' 接著播一次並停在最後一格，'preview' 就停著不動。
// 兩種都不會自己消失，要收掉請按停止。
function startComplicationProjection(comp, segment, mode) {
  const asset = complicationVideoAssets[segmentKey(comp, segment)];
  if (!hasProjectableComplication(asset)) return false;
  const doc = projectionDocument();
  if (!doc) {
    setStatus('請先按「開啟投影視窗」，綠幕人物才有地方疊上去。', true);
    return false;
  }

  stopComplicationProjection();
  const token = ++chromaToken;
  const stale = () => token !== chromaToken;
  activeComplication = comp;
  activeSegment = segment;
  complicationPreviewing = mode === 'preview';

  const layer = doc.getElementById('projection-complication-layer');
  const canvas = doc.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  layer.appendChild(canvas);

  const file = assetPath(asset, assetFiles(asset)[0]);
  const url = absoluteAssetUrl(file);
  const fail = () => {
    if (stale()) return;
    stopComplicationProjection();
    setStatus('投影視窗載不到綠幕素材：' + file, true);
  };
  // 依素材原始比例決定 canvas，寬度上限控制逐像素運算量
  const mount = (source, sourceWidth, sourceHeight) => {
    const width = Math.min(sourceWidth || KEY_MAX_WIDTH, KEY_MAX_WIDTH);
    const ratio = sourceWidth && sourceHeight ? sourceHeight / sourceWidth : 9 / 16;
    canvas.width = width;
    canvas.height = Math.max(1, Math.round(width * ratio));
    applyComplicationOverlayLayout();
    layer.classList.add('visible');
    chromaRedraw = () => chromaKeyFrame(ctx, source, canvas.width, canvas.height,
      complicationOverlay(comp).tolerance);
  };

  if (mediaKind(asset, file) === 'image') {
    const image = doc.createElement('img');
    image.src = url;
    image.addEventListener('load', () => {
      if (stale()) return;
      mount(image, image.naturalWidth, image.naturalHeight);
      chromaRedraw();
    }, { once: true });
    image.addEventListener('error', fail, { once: true });
    layer.appendChild(image);
  } else {
    const video = doc.createElement('video');
    video.src = url;
    video.muted = true;          // 聲音走控制台那張卡，投影只要畫面
    video.playsInline = true;
    video.loop = false;
    layer.appendChild(video);

    const loop = () => {
      if (stale()) return;
      if (!projectionWindow || projectionWindow.closed) { chromaFrame = null; return; }
      chromaRedraw();
      if (video.paused || video.ended) { chromaFrame = null; return; }
      chromaFrame = { win: projectionWindow, id: projectionWindow.requestAnimationFrame(loop) };
    };

    video.addEventListener('loadeddata', () => {
      if (stale()) return;
      mount(video, video.videoWidth, video.videoHeight);
      chromaRedraw();               // 先畫出第一格，之後才決定要不要開始播
      if (mode !== 'preview') {
        video.play().then(loop).catch(() => {});
        return;
      }
      // 影片在還沒播過之前，瀏覽器不一定會把第一格交給 canvas，
      // 所以預覽時先播一下再倒回開頭停住，才保證畫得出東西。
      video.play().then(() => {
        if (stale()) return;
        video.pause();
        chromaRedraw();
        video.currentTime = 0;
      }).catch(() => {});
    }, { once: true });
    video.addEventListener('seeked', () => { if (!stale() && video.paused) chromaRedraw(); });
    // 播完停在最後一格，不自動退場；要收掉請按停止
    video.addEventListener('ended', () => { if (!stale()) chromaRedraw(); });
    video.addEventListener('error', fail, { once: true });
  }

  refreshComplicationPreviewButtons();
  return true;
}

function renderProjectionAsset(asset) {
  const doc = projectionDocument();
  if (!doc) return;

  const file = assetPath(asset, assetFiles(asset)[0]);
  const type = mediaKind(asset, file);
  doc.title = asset.description ? `情境環境投影｜${asset.description}` : '情境環境投影';
  doc.getElementById('projection-message').style.display = 'none';

  if (type === 'image') {
    renderProjectionImage(doc, [file], asset.description, file);
    return;
  }
  if (type !== 'video') {
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這筆環境素材不是可投影的影片或圖片。');
    return;
  }

  const video = doc.createElement('video');
  video.src = absoluteAssetUrl(file);
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('aria-label', asset.description || '環境影片');
  video.addEventListener('playing', () => {
    doc.getElementById('projection-message').style.display = 'none';
  });
  video.addEventListener('error', () => {
    const fallbacks = fallbackFiles(asset);
    if (fallbacks.length) {
      renderProjectionImage(doc, fallbacks, asset.description, file + '（圖片 fallback 也無法載入）');
    } else {
      doc.getElementById('projection-stage').replaceChildren();
      showProjectionMessage(doc, '找不到環境影片：' + file);
    }
  }, { once: true });
  doc.getElementById('projection-stage').replaceChildren(video);
  video.play().catch(() => {
    showProjectionMessage(doc, '瀏覽器阻擋自動播放，請點一下「進入全螢幕」後再播放。');
  });
}

function renderProjectionScene() {
  if (!projectionWindow || projectionWindow.closed) return;
  if (currentEnvironmentAsset) {
    renderProjectionAsset(currentEnvironmentAsset);
  } else {
    const doc = projectionWindow.document;
    doc.getElementById('projection-stage').replaceChildren();
    showProjectionMessage(doc, '這個情境沒有可投影的環境素材。');
  }
  renderProjectionPatient();
}

function openProjection() {
  if (!currentEnvironmentAsset) return;
  if (projectionWindow && !projectionWindow.closed) {
    projectionWindow.focus();
    renderProjectionScene();
    return;
  }

  const width = Math.max(640, window.screen.availWidth || 1280);
  const height = Math.max(480, window.screen.availHeight || 720);
  const left = Number.isFinite(window.screen.availLeft) ? window.screen.availLeft : 0;
  const top = Number.isFinite(window.screen.availTop) ? window.screen.availTop : 0;
  const features = `popup=yes,width=${width},height=${height},left=${left},top=${top}`;
  const win = window.open('', 'scene-player-projection', features);
  if (!win) {
    setStatus('無法開啟投影視窗，請允許此網站顯示彈出式視窗後再試一次。', true);
    return;
  }

  projectionWindow = win;
  setupProjectionWindow(win);
  maximizeProjectionWindow(win);
  win.focus();
  $('btn-project').textContent = '聚焦投影視窗';
  renderProjectionScene();
}

function playProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.currentTime = 0;
    video.play().catch(() => {});
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
  }
}

function stopProjection() {
  if (!projectionWindow || projectionWindow.closed) return;
  try {
    const video = projectionWindow.document.querySelector('#projection-stage video');
    if (!video) return;
    video.pause();
    video.currentTime = 0;
  } catch {
    projectionWindow = null;
    $('btn-project').textContent = '開啟投影視窗';
  }
}

function disposeMediaSources() {
  mediaLoadControllers.forEach(controller => controller.abort());
  mediaLoadControllers.clear();
  mediaObjectUrls.forEach(url => URL.revokeObjectURL(url));
  mediaObjectUrls.clear();
}

async function loadSeekableAudio(el, file) {
  const controller = new AbortController();
  mediaLoadControllers.add(controller);
  try {
    const response = await fetch(file, { signal: controller.signal });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const blob = await response.blob();
    if (!el.isConnected) return;
    const url = URL.createObjectURL(blob);
    mediaObjectUrls.add(url);
    el.src = url;
    el.load();
    updatePlaybackButtons();
  } catch (err) {
    if (err.name === 'AbortError' || !el.isConnected) return;
    // 外部音檔若因 CORS 無法 fetch，仍退回原始網址播放。
    el.src = file;
    updatePlaybackButtons();
  } finally {
    mediaLoadControllers.delete(controller);
  }
}

function mediaForFile(asset, sourceFile) {
  const file = assetPath(asset, sourceFile);
  const type = mediaKind(asset, file);
  if (type === 'image') return imageMedia(file, asset.description);

  const el = document.createElement(type === 'video' ? 'video' : 'audio');
  el.controls = true;
  el.loop = asset.role === 'ambient_sound';
  if (type === 'audio') {
    loadSeekableAudio(el, file);
  } else {
    el.src = file;
  }
  el.addEventListener('error', () => {
    const fallbacks = type === 'video' ? fallbackFiles(asset) : [];
    if (!fallbacks.length) {
      el.replaceWith(missingMedia(file));
      updatePlaybackButtons();
      return;
    }

    let index = 0;
    const tryNextImage = () => {
      const file = fallbacks[index++];
      if (!file) return missingMedia(assetPath(asset) + '（圖片 fallback 也無法載入）');
      const wrapper = document.createElement('div');
      wrapper.className = 'fallback-media';
      const note = document.createElement('div');
      note.className = 'fallback-note';
      note.textContent = '影片無法載入，已改用圖片：' + file;
      wrapper.append(note, imageMedia(file, asset.description, tryNextImage));
      return wrapper;
    };
    el.replaceWith(tryNextImage());
    updatePlaybackButtons();
  }, { once: true });
  return el;
}

function mediaFor(asset) {
  // type: none = 該情境刻意沒有這個素材（例如住宅 OHCA 沒有環境聲音）
  const files = assetFiles(asset);
  if (asset.type === 'none' || !files.length) {
    const note = document.createElement('div');
    note.className = 'none-note';
    note.textContent = '此情境無此素材';
    return note;
  }
  if (files.length === 1) return mediaForFile(asset, files[0]);

  const options = document.createElement('div');
  options.className = 'media-options';
  files.forEach((file, index) => {
    const option = document.createElement('div');
    option.className = 'media-option';
    const label = document.createElement('div');
    label.className = 'media-option-label';
    label.textContent = `版本 ${index + 1}：${file}`;
    const media = mediaForFile(asset, file);
    if (media.tagName === 'AUDIO' || media.tagName === 'VIDEO') {
      media.addEventListener('play', () => {
        options.querySelectorAll('audio, video').forEach(other => {
          if (other !== media) other.pause();
        });
        options.querySelectorAll('.media-option').forEach(item => item.classList.remove('selected'));
        option.classList.add('selected');
      });
    }
    option.append(label, media);
    options.appendChild(option);
  });
  return options;
}

// clipboard API 在部分環境（非 https、權限未給）會失敗，退回 execCommand，再不行就幫使用者選取
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch { /* 往下試 execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

function selectNode(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// 配音 prompt（ElevenLabs Eleven v3），收在 <details> 裡，需要重新生成配音時展開複製
function ttsBlock(tts) {
  const box = document.createElement('details');
  box.className = 'tts';
  const sum = document.createElement('summary');
  sum.textContent = `${tts.model || 'TTS'} 配音 prompt`;
  box.appendChild(sum);

  for (const [key, label] of [['voice', 'voice'], ['settings', 'settings']]) {
    if (!tts[key]) continue;
    const row = document.createElement('div');
    row.className = 'tts-meta';
    row.textContent = `${label}：${tts[key]}`;
    box.appendChild(row);
  }
  const pre = document.createElement('pre');
  pre.textContent = (tts.prompt || '').trim();
  box.appendChild(pre);

  const btn = document.createElement('button');
  btn.className = 'copy';
  btn.textContent = '複製 prompt';
  btn.addEventListener('click', async () => {
    btn.textContent = (await copyText(pre.textContent)) ? '已複製' : '複製失敗，已幫你選取，按 Ctrl+C';
    if (btn.textContent !== '已複製') selectNode(pre);
    setTimeout(() => { btn.textContent = '複製 prompt'; }, 2500);
  });
  box.appendChild(btn);
  return box;
}

// 疊加開關與大小／位置滑桿，掛在病患照片卡內；設定值存在 patientOverlay，重新產生後沿用
// 病患照片與綠幕人物共用的滑桿列；sync() 讓「重設版面」能把滑桿一起拉回去
function overlaySliderRows(state, specs, ariaPrefix, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'overlay-sliders';
  const rows = {};
  const text = ({ key, unit }) => state[key] + (unit === undefined ? '%' : unit);
  for (const spec of specs) {
    const { key, label, min, max } = spec;
    const row = document.createElement('div');
    row.className = 'overlay-slider';
    const name = document.createElement('span');
    name.textContent = label;
    const input = Object.assign(document.createElement('input'),
      { type: 'range', min, max, step: 1, value: state[key] });
    input.setAttribute('aria-label', ariaPrefix + label);
    const value = document.createElement('output');
    value.textContent = text(spec);
    input.addEventListener('input', () => {
      state[key] = Number(input.value);
      value.textContent = text(spec);
      onChange();
    });
    rows[key] = { input, value };
    row.append(name, input, value);
    wrap.appendChild(row);
  }
  return {
    node: wrap,
    sync() {
      for (const spec of specs) {
        rows[spec.key].input.value = state[spec.key];
        rows[spec.key].value.textContent = text(spec);
      }
    },
  };
}

function overlayFoot(hintText, reset, extraButton) {
  const foot = document.createElement('div');
  foot.className = 'overlay-foot';
  const hint = document.createElement('span');
  hint.className = 'overlay-hint';
  hint.textContent = hintText;
  const buttons = document.createElement('span');
  buttons.className = 'overlay-buttons';
  if (extraButton) buttons.appendChild(extraButton);
  buttons.appendChild(reset);
  foot.append(hint, buttons);
  return foot;
}

function patientOverlayControls() {
  const box = document.createElement('div');
  box.className = 'overlay-controls';

  const toggle = document.createElement('label');
  toggle.className = 'overlay-toggle';
  const checkbox = Object.assign(document.createElement('input'),
    { type: 'checkbox', checked: patientOverlay.enabled });
  checkbox.addEventListener('change', () => {
    patientOverlay.enabled = checkbox.checked;
    renderProjectionPatient();
  });
  toggle.append(checkbox, document.createTextNode('疊加到投影視窗'));
  box.appendChild(toggle);

  const applyChange = () => {
    applyPatientOverlayLayout();
    saveOverlayLayouts();
  };
  const sliders = overlaySliderRows(patientOverlay, PATIENT_OVERLAY_SLIDERS, '病患照片', applyChange);
  box.appendChild(sliders.node);

  const reset = Object.assign(document.createElement('button'),
    { className: 'reset', type: 'button', textContent: '重設版面' });
  reset.addEventListener('click', () => {
    Object.assign(patientOverlay, PATIENT_OVERLAY_DEFAULTS);
    sliders.sync();
    applyChange();
  });
  box.appendChild(overlayFoot('調整會即時反映在投影視窗，並依目前環境素材記住', reset));
  return box;
}

function refreshComplicationPreviewButtons() {
  document.querySelectorAll('#comp-groups button.preview').forEach(button => {
    const on = complicationPreviewing
      && button.dataset.comp === activeComplication
      && Number(button.dataset.segment) === activeSegment;
    button.textContent = on ? '結束預覽' : '預覽定位';
    button.classList.toggle('on', on);
  });
}

function complicationOverlayControls(comp, segment, playLabel, shared) {
  const layout = complicationOverlay(comp);
  const box = document.createElement('div');
  box.className = 'overlay-controls';
  const isPreviewingThis = () => complicationPreviewing
    && activeComplication === comp && activeSegment === segment;
  // 版面是整組共用的，所以投影上只要是同一個突發狀況，改滑桿就要跟著重畫
  const redrawIfPaused = () => {
    if (chromaRedraw && !chromaFrame && activeComplication === comp) chromaRedraw();
  };
  const applyChange = () => {
    applyComplicationOverlayLayout();
    redrawIfPaused();   // 暫停的畫面沒有 rAF 在跑，要自己重畫一幀
    syncComplicationOverlayBoxes(comp);
    saveOverlayLayouts();
  };

  const sliders = overlaySliderRows(layout, COMP_OVERLAY_SLIDERS, `${comp}綠幕`, applyChange);
  box.appendChild(sliders.node);
  complicationOverlayBoxes.push({ comp, sync: sliders.sync });

  const preview = Object.assign(document.createElement('button'),
    { className: 'reset preview', type: 'button', textContent: '預覽定位' });
  preview.dataset.comp = comp;
  preview.dataset.segment = segment;
  preview.addEventListener('click', () => {
    if (isPreviewingThis()) stopComplicationProjection();
    else startComplicationProjection(comp, segment, 'preview');
  });

  const reset = Object.assign(document.createElement('button'),
    { className: 'reset', type: 'button', textContent: '重設版面' });
  reset.addEventListener('click', () => {
    Object.assign(layout, COMP_OVERLAY_DEFAULTS);
    applyChange();
  });

  const hint = `預覽定位＝疊上投影停在第一格；「${playLabel}」演完停在最後一格，按停止才收掉。`
    + (shared ? '版面本組各片段共用，' : '') + '依目前環境素材記住';
  box.appendChild(overlayFoot(hint, reset, preview));
  return box;
}

// 一張角色卡；emptyText 是查無素材時要說的話
function buildCard({ role, label, result, changed, emptyText, extras, silentVoice }) {
  const card = document.createElement('div');
  card.className = 'card' + (result ? '' : ' empty') + (changed ? ' changed' : '');

  const head = document.createElement('div');
  head.className = 'role';
  head.innerHTML = `<strong>${label}</strong>${role}`;
  card.appendChild(head);

  const body = document.createElement('div');
  if (result) {
    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = result.asset.description || '(無說明)';
    if (result.hit) {
      const b = document.createElement('span');
      b.className = 'badge hit';
      b.textContent = '命中突發狀況';
      desc.appendChild(b);
    }
    const pool = document.createElement('span');
    pool.className = 'badge' + (result.poolSize === 1 ? ' only' : '');
    pool.textContent = result.poolSize === 1
      ? '此條件僅 1 筆素材，重新產生不會變'
      : `${result.poolSize} 筆可選`;
    desc.appendChild(pool);
    body.appendChild(desc);
    if (result.asset.line) {
      const line = document.createElement('blockquote');
      line.className = 'line';
      line.textContent = '「' + result.asset.line + '」';
      body.appendChild(line);
    }
    if (result.asset.tts) body.appendChild(ttsBlock(result.asset.tts));
    // 這一段的綠幕素材是影片時就用影片自己的原聲，配音檔不放播放器，免得兩個聲音疊在一起
    if (silentVoice && result.asset.type !== 'none') {
      const note = document.createElement('div');
      note.className = 'none-note';
      note.textContent = '這一段用綠幕影片的原聲，這個配音檔不會播放';
      body.appendChild(note);
    } else {
      body.appendChild(mediaFor(result.asset));
    }
    if (role === 'patient_photo' && hasProjectablePatientPhoto(result.asset)) {
      body.appendChild(patientOverlayControls());
    }
    const extraNode = extras && extras(result.asset);
    if (extraNode) body.appendChild(extraNode);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const paths = assetFiles(result.asset).map(file => assetPath(result.asset, file));
    meta.textContent = `${result.asset.id} · ${paths.join(', ') || '（無檔案）'}`;
    body.appendChild(meta);
  } else {
    const desc = document.createElement('p');
    desc.className = 'desc';
    // 這一段本來就吃影片原聲，沒有另外的配音不是資料缺口，不要報成查無素材
    desc.textContent = silentVoice ? '這一段用綠幕影片的原聲，沒有另外的配音' : emptyText;
    body.appendChild(desc);
  }
  card.appendChild(body);
  return card;
}

// 播放／停止一段演出：綠幕素材與台詞一起，投影上同時去背疊上該段的人物
function segmentActions(comp, segment, block, playLabel) {
  const actions = document.createElement('div');
  actions.className = 'comp-group-actions';
  const play = Object.assign(document.createElement('button'), { className: 'play', textContent: playLabel });
  play.dataset.comp = comp;
  play.dataset.segment = segment;
  const stop = Object.assign(document.createElement('button'), { className: 'stop', textContent: '停止' });
  play.addEventListener('click', () => {
    stopMediaIn($('comp-groups'));   // 一次只演一段，接著演下一段就把上一段收掉
    playMediaIn(block);
    startComplicationProjection(comp, segment, 'play');
  });
  stop.addEventListener('click', () => {
    stopMediaIn(block);
    if (activeComplication === comp && activeSegment === segment) stopComplicationProjection();
  });
  actions.append(play, stop);
  return actions;
}

// 一個突發狀況＝一組。組內可再拆成好幾個片段，教官依現場節奏逐段觸發。
// 只有一段時不加片段標題，維持單純的「一組兩張卡」版面。
function buildComplicationGroup(comp, seq, segments) {
  const section = document.createElement('section');
  section.className = 'comp-group';
  const single = segments.length === 1;

  const head = document.createElement('div');
  head.className = 'comp-group-head';
  const title = document.createElement('h2');
  title.className = 'comp-group-title';
  title.innerHTML = `<span class="seq">${seq}</span>`;
  title.append(document.createTextNode(comp));
  if (!single) {
    const count = document.createElement('span');
    count.className = 'badge';
    count.textContent = `${segments.length} 個片段`;
    title.appendChild(count);
  }
  head.appendChild(title);

  const stopAllInGroup = Object.assign(document.createElement('button'),
    { className: 'stop', textContent: '停止' });
  stopAllInGroup.addEventListener('click', () => {
    stopMediaIn(section);
    if (activeComplication === comp) stopComplicationProjection();
  });

  if (single) {
    head.appendChild(segmentActions(comp, segments[0].segment, section, '播放這組'));
  } else {
    const actions = document.createElement('div');
    actions.className = 'comp-group-actions';
    actions.appendChild(stopAllInGroup);
    head.appendChild(actions);
  }
  section.appendChild(head);

  for (const { segment, nodes } of segments) {
    const cards = document.createElement('div');
    cards.className = 'cards';
    nodes.forEach(node => cards.appendChild(node));
    if (single) {
      section.appendChild(cards);
      continue;
    }
    const block = document.createElement('div');
    block.className = 'comp-segment';
    const bar = document.createElement('div');
    bar.className = 'comp-segment-head';
    const label = document.createElement('h3');
    label.className = 'comp-segment-title';
    label.textContent = `片段 ${segment}`;
    bar.append(label, segmentActions(comp, segment, block, '播放這段'));
    block.append(bar, cards);
    section.appendChild(block);
  }
  return section;
}

function generate() {
  const env = $('sel-env').value;
  const med = $('sel-med').value;
  const comps = selectedComplications();
  const cards = $('cards');
  const groups = $('comp-groups');
  const before = { ...shownIds };
  disposeMediaSources();
  stopComplicationProjection();
  cards.innerHTML = '';
  groups.innerHTML = '';
  complicationOverlayBoxes.length = 0;
  currentEnvironmentAsset = null;
  currentPatientPhotoAsset = null;
  Object.keys(complicationVideoAssets).forEach(key => delete complicationVideoAssets[key]);
  genCount++;

  let changed = 0, locked = 0;
  const track = (key, result) => {
    shownIds[key] = result ? result.asset.id : null;
    if (before[key] !== shownIds[key]) changed++;
    if (result && result.poolSize === 1) locked++;
    return genCount > 1 && before[key] !== shownIds[key];
  };

  let patientPhoto = null;
  for (const { role, label } of BASE_ROLES) {
    const result = pickForRole(role, env, med, comps, { patientPhoto });
    if (role === 'patient_photo' && result) {
      patientPhoto = result.asset;
      currentPatientPhotoAsset = result.asset;
    }
    if (role === 'environment_video') {
      currentEnvironmentAsset = result ? result.asset : null;
      // 疊加版面跟著環境素材走，要在建出病患／綠幕卡片之前先換好
      loadOverlayLayouts(result ? result.asset.id : null);
    }
    cards.appendChild(buildCard({
      role, label, result,
      changed: track(role, result),
      emptyText: '此條件下查無符合的素材，可在 scenario-data.yaml 補一筆通用素材',
    }));
  }

  // 勾選的突發狀況全部展開成群組，不再每次隨機鎖定一個；一組可再拆成好幾個片段
  comps.forEach((comp, index) => {
    const segmentNumbers = complicationSegments(comp, env, med);
    const playLabel = segmentNumbers.length === 1 ? '播放這組' : '播放這段';
    const segments = segmentNumbers.map(segment => ({
      segment,
      nodes: COMP_ROLES.map(({ role, label }) => {
        const key = `${role}|${segmentKey(comp, segment)}`;
        const result = pickForRole(role, env, med, [comp], { memoKey: key, segment });
        if (role === 'complication_video' && result) {
          complicationVideoAssets[segmentKey(comp, segment)] = result.asset;
        }
        // COMP_ROLES 的順序是先影片再聲音，所以輪到聲音時已經知道這段的綠幕素材是哪一種
        const greenScreen = complicationVideoAssets[segmentKey(comp, segment)];
        return buildCard({
          role, label, result,
          silentVoice: role === 'complication_voice'
            && !!greenScreen && mediaKind(greenScreen) === 'video',
          changed: track(key, result),
          // 突發狀況素材有綁環境／事件，所以空卡片多半是「這一組不適合這個情境」而不是缺素材
          emptyText: (segmentNumbers.length === 1 ? `「${comp}」` : `「${comp}」片段 ${segment} `)
            + `在「${env}／${med}」沒有素材：可能是這一組不適合這個情境，`
            + '也可能是還沒做，要放寬就改 scenario-data.yaml 的 environment／medicalEvent',
          extras: role === 'complication_video'
            ? asset => (hasProjectableComplication(asset)
              ? complicationOverlayControls(comp, segment, playLabel, segmentNumbers.length > 1) : null)
            : null,
        });
      }),
    }));
    groups.appendChild(buildComplicationGroup(comp, index + 1, segments));
  });

  if (!comps.length) {
    const note = document.createElement('p');
    note.className = 'group-note';
    note.textContent = '未勾選突發狀況，本次沒有突發狀況群組。';
    groups.appendChild(note);
  }

  $('btn-gen').textContent = '重新產生';
  updatePlaybackButtons();
  updateProjectionButton();
  renderProjectionScene();
  const summary = comps.map(comp => {
    const count = complicationSegments(comp, env, med).length;
    return count > 1 ? `${comp}（${count} 段）` : comp;
  });
  const cond = `${env}／${med}` + (comps.length
    ? `／突發狀況 ${comps.length} 組：${summary.join('、')}`
    : '／未選突發狀況');
  const detail = genCount === 1
    ? cond
    : `${cond}｜換了 ${changed} 個角色的素材` + (locked ? `，${locked} 個角色只有 1 筆素材可選` : '');
  setStatus(`第 ${genCount} 次產生 · ${detail}`);
}

function playMediaIn(root) {
  root.querySelectorAll('.card').forEach(card => {
    const selected = card.querySelector('.media-option.selected audio[src], .media-option.selected video[src]');
    const el = selected || card.querySelector('audio[src], video[src]');
    if (el) {
      el.currentTime = 0;
      el.play().catch(() => {});
    }
  });
}

function stopMediaIn(root) {
  root.querySelectorAll('audio, video').forEach(el => { el.pause(); el.currentTime = 0; });
}

// 場景底層（環境＋病患）一起播；突發狀況各組自己按，避免多個突發狀況同時炸開
function playScene() {
  playMediaIn($('cards'));
  playProjection();
}
function stopAll() {
  stopMediaIn($('cards'));
  stopMediaIn($('comp-groups'));
  stopComplicationProjection();
  stopProjection();
}

$('btn-gen').addEventListener('click', generate);
$('btn-project').addEventListener('click', openProjection);
$('btn-play').addEventListener('click', playScene);
$('btn-stop').addEventListener('click', stopAll);
window.addEventListener('beforeunload', () => {
  if (projectionWindow && !projectionWindow.closed) projectionWindow.close();
});
init();
</script>
</body>
</html>
