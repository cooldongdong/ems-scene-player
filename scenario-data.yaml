  # ---------- 突發狀況綠幕影片（約 10 秒）----------
  #
  # 同一個突發狀況可以拆成好幾個片段，讓教官依現場節奏一段一段觸發（例如爭吵→越吵越兇→動手）。
  # 作法是在素材上加 `segment:` 數字，綠幕素材與台詞各自標同一個 segment 就會配成同一段：
  #
  #   - id: cv004-2
  #     type: video
  #     role: complication_video
  #     file: drivers_argue_2_gs.mp4
  #     segment: 2
  #     tags: { ..., complication: [肇事雙方爭吵] }
  #
  # 沒寫 `segment` 就是第 1 段，所以下面這些只有一段的素材不用動。
  # 同一個 segment 底下放多筆素材＝多個候選，每次產生隨機挑一筆（和其他角色一樣）。
  # 想表達「同一句話的不同 take、只播其中一個」時不要用 segment，用 `file:` 陣列。
  - id: cv001
