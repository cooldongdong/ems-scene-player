# 事件腳本產生器 —— 素材標籤資料庫
#
# 資料來源：提案者提供的 6 個情境（scenario-data.md），拆成可重新組合的素材。
#
# 編輯規則：
#   1. options 決定畫面上三個選單「顯示什麼、順序如何」，由人工控制。
#      environment 依室內／室外分組，前端會以選單群組呈現；素材標籤仍填實際環境名稱。
#   2. assets 每一筆代表一個素材檔，tags 底下的陣列留空 [] = 該維度不限，任何選擇都適用。
#      patient_photo 與 patient_voice 可用 gender、ageGroup 配對，避免人物與聲音的性別或年齡不符。
#   3. 加素材時：把檔案放進對應的 assets/<role>/ 資料夾，file 只填檔名，再在下面補一筆即可，不用改程式。
#      同一筆素材若有多個版本，file 可改用 YAML 陣列；頁面會全部顯示，播放其中一個時會暫停同組其他版本。
#   4. 該情境「刻意沒有這個素材」（例如住宅 OHCA 沒有環境聲音）就寫 type: none 且不填 file，
#      卡片會顯示「此情境無此素材」，跟「查無素材」區分開。
#   5. 同一輪篩選過關的素材裡，「標了範圍的維度比較多」的那筆會勝出，通用素材只在沒有專屬素材時頂替。
#      例如市區街道＋車禍時，標了 medicalEvent 的 ev004（路口車禍現場）會贏過任何路邊都能用的 ev003。
#      所以留空不只是「不限」，也代表「讓位給更貼合的素材」——不確定就留空，別亂填來搶排序。
#
# role 說明：
#   environment_video   環境影片
#   ambient_sound       環境聲音
#   patient_photo       病患樣貌照片
#   patient_voice       病患聲音
#   complication_video  突發狀況綠幕影片（約 10 秒）
#   complication_voice  突發狀況聲音（1-2 句台詞，用 line 欄位寫台詞）
#
# 突發狀況影片與聲音會鎖定同一個突發狀況，不會出現「家屬哭喊的影片配工地同事的台詞」。
# 突發狀況的 environment／medicalEvent 也要填：台詞是綁情境寫的（例如「抬到旁邊陰涼的地方」是工地），
# 留空的話勾了就會配到不合理的場景。勾了但該情境沒有對應素材時，卡片會直接說這一組沒有素材。

options:
  environment:
    室內:
      - 住宅客廳
      - 出租套房
      - KTV 包廂
    室外:
      - 市區街道
      - 工地
  medicalEvent:
    - 心跳停止（OHCA）
    - 外傷出血
    - 骨折（墜落）
    - 車禍多重傷
    - 酒醉意識不清
    - 自傷（割腕）
  # 投影格式 —— 同一個情境會投在不同形狀的螢幕上（教室是一般 16:9，訓練場是 270° 投影）。
  #   1. **第一個是基準**：它的版面直接寫在圖層上（size／x／y），其餘格式寫進圖層的 layouts。
  #      所以既有的情境檔一個字都不用改。
  #   2. aspect 是寬÷高。投影視窗會量自己的長寬比、挑最接近的一個，現場不必先切。
  #   3. 這裡整段刪掉就退回程式內建的同樣兩種，不會壞。
  # 270° 那個數字先照「三台 16:9 並排」估（3×16/9 ≈ 5.333），量到實際值再改這一行。
  projection:
    - id: wide
      name: 一般 16:9 螢幕
      aspect: 1.778
    - id: ultrawide
      name: 270° 投影
      aspect: 5.333
  complication:
    - 家屬崩潰哭喊
    - 旁人嗆聲干擾
    - 同事欲搬動傷患
    - 肇事雙方爭吵
    - 同伴咆哮威脅
    - 情緒失控自傷

