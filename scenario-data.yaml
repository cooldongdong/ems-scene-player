# 事件腳本產生器 —— 素材標籤資料庫
#
# 資料來源：提案者提供的 6 個情境（scenario-data.md），拆成可重新組合的素材。
#
# 編輯規則：
#   1. options 決定畫面上三個選單「顯示什麼、順序如何」，由人工控制。
#      environment 依室內／室外分組，前端會以選單群組呈現；素材標籤仍填實際環境名稱。
#   2. assets 每一筆代表一個素材檔，tags 底下的陣列留空 [] = 該維度不限，任何選擇都適用。
#      patient_photo 與 patient_voice 可用 gender、ageGroup 配對，避免人物與聲音的性別或年齡不符。
#   3. 加素材時：把檔案放進對應的 assets/<role>/ 資料夾，file 只填檔名，再在下面補一筆即可，不用改程式。
#      同一筆素材若有多個版本，file 可改用 YAML 陣列；頁面會全部顯示，播放其中一個時會暫停同組其他版本。
#   4. 該情境「刻意沒有這個素材」（例如住宅 OHCA 沒有環境聲音）就寫 type: none 且不填 file，
#      卡片會顯示「此情境無此素材」，跟「查無素材」區分開。
#   5. 同一輪篩選過關的素材裡，「標了範圍的維度比較多」的那筆會勝出，通用素材只在沒有專屬素材時頂替。
#      例如市區街道＋車禍時，標了 medicalEvent 的 ev004（路口車禍現場）會贏過任何路邊都能用的 ev003。
#      所以留空不只是「不限」，也代表「讓位給更貼合的素材」——不確定就留空，別亂填來搶排序。
#
# role 說明：
#   environment_video   環境影片
#   ambient_sound       環境聲音
#   patient_photo       病患樣貌照片
#   patient_voice       病患聲音
#   complication_video  突發狀況綠幕影片（約 10 秒）
#   complication_voice  突發狀況聲音（1-2 句台詞，用 line 欄位寫台詞）
#
# 突發狀況影片與聲音會鎖定同一個突發狀況，不會出現「家屬哭喊的影片配工地同事的台詞」。
# 突發狀況的 environment／medicalEvent 也要填：台詞是綁情境寫的（例如「抬到旁邊陰涼的地方」是工地），
# 留空的話勾了就會配到不合理的場景。勾了但該情境沒有對應素材時，卡片會直接說這一組沒有素材。

options:
  environment:
    室內:
      - 住宅客廳
      - 出租套房
      - KTV 包廂
    室外:
      - 市區街道
      - 工地
  medicalEvent:
    - 心跳停止（OHCA）
    - 外傷出血
    - 骨折（墜落）
    - 車禍多重傷
    - 酒醉意識不清
    - 自傷（割腕）
  complication:
    - 家屬崩潰哭喊
    - 旁人嗆聲干擾
    - 同事欲搬動傷患
    - 肇事雙方爭吵
    - 同伴咆哮威脅
    - 情緒失控自傷

# 情境（scenario）—— 一場訓練的完整劇本：素材組合 ＋ 一串照順序演的簡報頁。
#
#   為什麼要有這一層：
#   ① 三個選單可以排出 5×6 = 30 種基本組合，但素材庫不是每一格都填滿，選到沒素材的格子
#      只會看到「查無符合的素材」。情境是「這組確定跑得動」的人工背書名單。
#   ② 光有素材還不夠——訓練需要的是「先發生什麼、再發生什麼」。slides 就是那條時間線。
#
#   編輯規則：
#   1. 整段 scenarios 可以直接刪掉，頁面會自動不顯示情境清單，不影響其他功能。
#   2. id 必須唯一且穩定，請用 ASCII kebab-case——它是自訂情境覆蓋內建情境的比對依據，
#      改了 id 等於變成另一個情境，使用者存在瀏覽器裡的修改會對不上而失效。
#   3. name 是清單上的字，越短越好；note 會變成滑鼠停留時的說明，可省略。
#   4. environment／medicalEvent 的值必須和上面 options 完全一致，對不上整筆會被跳過。
#   5. **不要寫 complications 欄位。** 這個情境用到哪些突發狀況，是從所有「啟用中」的
#      簡報頁自動推導出來的。多寫一份就是第二份真相，遲早出現「勾了但沒有任何一頁用到」
#      或反過來的矛盾。
#   6. 每個情境至少要有一頁有效的簡報頁，否則整筆會被跳過——空流程的情境載入後是一片
#      空白，比不存在更難懂。
#
#   簡報頁（slides）：
#   - id：情境內唯一即可，省略時自動編成 s1、s2……
#   - title：清單上顯示的字
#   - enabled：只有明確寫 false 才是關閉。關掉的頁**播放時會跳過，但仍留在清單裡**，
#     用途是現場臨時抽掉一個橋段，不必真的刪掉它。省略視為啟用，手寫時不必每頁都補。
#   - actions：這一頁要發生的事，目前只支援兩種型別（刻意收斂，先跑過真實訓練再考慮加）：
#       type: wait          停住等教官口述，可用 note 寫提示
#       type: complication  播某個突發狀況；complication 填狀況名稱，
#                           另可填 segment 只播其中一段（省略＝該狀況的全部片段）
#
#   下列 7 組的來源：把 30 種基本組合逐一比對素材庫後，四個角色（環境影像、環境聲音、
#   病患照片、病患聲音）都取得到素材的就是這 7 組；其餘 23 組至少缺一項，多半缺病患照片。
#   這只代表「素材齊全」，不代表「情境合理」——實際播過覺得不合適就直接改掉那一筆。
scenarios:
  - id: home-ohca
    name: 住宅 OHCA
    environment: 住宅客廳
    medicalEvent: 心跳停止（OHCA）
    note: 家中倒地的長者，家屬在旁崩潰
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、指派任務，等隊員完成初步評估
      - id: s2
        title: 家屬崩潰哭喊
        actions:
          - type: complication
            complication: 家屬崩潰哭喊

  - id: studio-selfharm
    name: 套房自傷
    environment: 出租套房
    medicalEvent: 自傷（割腕）
    note: 套房內自傷，患者情緒仍在失控
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、確認環境安全再接近患者
      - id: s2
        title: 情緒失控自傷
        actions:
          - type: complication
            complication: 情緒失控自傷

  - id: street-trauma
    name: 街頭外傷
    environment: 市區街道
    medicalEvent: 外傷出血
    note: 路邊外傷出血，圍觀者與同事都在干擾處置
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、指派任務，開始止血
      - id: s2
        title: 旁人嗆聲干擾
        actions:
          - type: complication
            complication: 旁人嗆聲干擾
      - id: s3
        title: 同事想搬動傷患
        actions:
          - type: complication
            complication: 同事欲搬動傷患

  - id: street-fall
    name: 街頭墜落骨折
    environment: 市區街道
    medicalEvent: 骨折（墜落）
    note: 墜落骨折，同事想直接把人搬走
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、評估墜落高度與可能的脊椎傷害
      - id: s2
        title: 同事想搬動傷患
        actions:
          - type: complication
            complication: 同事欲搬動傷患

  - id: intersection-crash
    name: 路口車禍
    environment: 市區街道
    medicalEvent: 車禍多重傷
    note: 路口車禍多重傷，肇事雙方在旁爭吵
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、確認交通管制與傷患人數
      - id: s2
        title: 肇事雙方爭吵
        actions:
          - type: complication
            complication: 肇事雙方爭吵
      - id: s3
        title: 旁人嗆聲干擾
        actions:
          - type: complication
            complication: 旁人嗆聲干擾

  - id: site-trauma
    name: 工地外傷
    environment: 工地
    medicalEvent: 外傷出血
    note: 工地外傷出血，工班急著搬動傷患
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、確認工地危害與動線
      - id: s2
        title: 同事想搬動傷患
        actions:
          - type: complication
            complication: 同事欲搬動傷患
      - id: s3
        title: 旁人嗆聲干擾
        actions:
          - type: complication
            complication: 旁人嗆聲干擾

  - id: site-fall
    name: 工地墜落
    environment: 工地
    medicalEvent: 骨折（墜落）
    note: 工地墜落骨折，同事想直接搬動
    slides:
      - id: s1
        title: 抵達現場
        actions:
          - type: wait
            note: 描述現場、評估墜落高度與固定需求
      - id: s2
        title: 同事想搬動傷患
        actions:
          - type: complication
            complication: 同事欲搬動傷患


