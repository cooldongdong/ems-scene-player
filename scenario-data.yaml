  # ---------- 突發狀況台詞（1-2 句）----------
  #
  # 注意：這一類的音檔「只有在該段綠幕是靜態劇照時才會播放」。
  # 綠幕是影片時（真實素材多半自帶現場收音），聲音以影片的音軌為準，這裡的音檔不播，
  # 免得兩個聲音疊在一起；line 台詞與 tts prompt 仍會顯示在卡片上，供現場演員對詞或日後補錄使用。
  #
  # tts 欄位是拿去 ElevenLabs「Eleven v3」生成配音用的 prompt，可直接複製貼上。
  #   - audio tag 用小寫方括號寫在句子裡，效果會隨所選 voice 而變；voice 的情緒幅度不夠時，
  #     v3 可能會把 tag 當文字念出來，換一個情緒表現力強的 voice 即可。
  #   - 全形省略號 ⋯⋯ 產生自然停頓，逗號控制換氣，要重音就把那個詞寫成大寫（中文可改用驚嘆號堆疊）。
  #   - stability 建議用 Creative（情緒最飽滿，但偶爾會失控，多生幾次挑一條）。
  #   - prompt 都寫成 4 句以上而不是只有一句台詞：v3 在太短的文字上情緒容易不穩，
  #     而且綠幕影片是 10 秒，配音長度要跟得上。用不到的句子剪掉就好。

